function renderListe(){
  const eintraege = sichtbareInstanzen();
  if(!eintraege.length){
    const leer = anzahlIn(st.dim) === 0;
    $liste.innerHTML = `<div class="module-empty" style="padding:40px 12px">
      <div class="me-ico">${ZIEL}</div>
      <div class="me-title">${leer ? `${inDim(st.dim).replace(/^i/, "I")} ist noch nichts erfasst` : "Nichts gefunden"}</div>
      <div class="me-sub">${leer ? "Screenshot vom Seed-Map-Popup machen und unten auf „Screenshot“ tippen." : "Suche oder Filter anpassen."}</div>
    </div>`;
    return;
  }
  // Gruppieren: Kategorie → Variante → Instanzen (Datenmodell-Hierarchie)
  const gruppen = new Map();
  for(const e of eintraege){
    if(!gruppen.has(e.t.kategorie)) gruppen.set(e.t.kategorie, new Map());
    const g = gruppen.get(e.t.kategorie);
    const v = e.t.variante || "";
    if(!g.has(v)) g.set(v, []);
    g.get(v).push(e);
  }
  const reihenfolge = [EIGENE_ORTE, ...FEATURE_KATEGORIEN[st.dim]].filter((k) => gruppen.has(k));
  const weg = (i) => entfernung(st.standort, i.x, i.z, st.dim);
  const sortieren = (a, b) => {
    const wa = weg(a.i), wb = weg(b.i);
    if(wa && wb) return wa.meter - wb.meter;
    return st.instanzen.indexOf(b.i) - st.instanzen.indexOf(a.i);   // neueste zuerst
  };

  $liste.innerHTML = reihenfolge.map((kat) => {
    const g = gruppen.get(kat);
    const summe = [...g.values()].reduce((n, l) => n + l.length, 0);
    const offen = !st.zu.has(`${st.dim}:${kat}`);
    const varianten = [...g.keys()].sort((a, b) => (a === "" ? -1 : b === "" ? 1 : a.localeCompare(b, "de")));
    const items = varianten.map((v) => {
      const zeilen = g.get(v).sort(sortieren).map(({ i }) => {
        const w = weg(i);
        return `<button class="ort-zeile" data-id="${i.id}">
          ${coordHtml(i.x, i.y, i.z)}
          ${portalHtml(i.x, i.z, st.dim, "ort-portal mono")}
          <span class="ort-weg">${w ? `<b>${entfernungText(w.meter)}</b><span>${w.richtung}${w.umgerechnet ? " ⟷" : ""}</span>` : ""}</span>
        </button>`;
      }).join("");
      return (v ? `<div class="ort-typ">${esc(v)}</div>` : "") + zeilen;
    }).join("");
    return `<div class="ort-kat ${offen ? "open" : ""}" data-kat="${esc(kat)}">
      <div class="ort-kat-head">
        <span class="ort-kat-icon">${symbol(kat)}</span>
        <span class="ort-kat-name">${esc(kat)}</span>
        <span class="ort-kat-count">${summe}</span>
        <span class="ort-kat-chevron">${CHEVRON}</span>
      </div>
      <div class="ort-kat-items">${items}</div>
    </div>`;
  }).join("");
}

function render(){
  renderKopf();
  if(aktivesModul === "sammelobjekte"){ renderSammel(); return; }
  if(aktivesModul === "banner"){ renderBanner(); return; }
  if(aktivesModul === "portale"){ renderPortale(); return; }
  if(st.ansicht === "liste"){ renderHud(); renderFilter(); renderListe(); }
  else karte.zeichnen();
  renderStatus();
}

/* ============================================================================
   8 · KARTE  ·  Canvas; Biome nur rund um bekannte Punkte, Rest bleibt leer
   ========================================================================== */
const karte = (() => {
  const canvas = document.getElementById("ortKarte");
  const ctx = canvas.getContext("2d");
  const $hinweis = document.getElementById("karteHinweis");
  const $legende = document.getElementById("karteLegende");
  const sicht = { cx:0, cz:0, zoom:0.25 };   // Mittelpunkt in Blöcken, Pixel pro Block
  const zeiger = new Map();
  let ziehen = null, pinch = null, bewegt = false, angepasst = null, dpr = 1;
  let marker = [];   // für Tap-Erkennung

  function groesse(){
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  }
  const var_ = (n) => getComputedStyle($device).getPropertyValue(n).trim();
  const zuBild = (x, z) => [(x - sicht.cx) * sicht.zoom + canvas.width / dpr / 2, (z - sicht.cz) * sicht.zoom + canvas.height / dpr / 2];
  const zuWelt = (px, py) => [(px - canvas.width / dpr / 2) / sicht.zoom + sicht.cx, (py - canvas.height / dpr / 2) / sicht.zoom + sicht.cz];

  /** Ausschnitt so wählen, dass alle Orte der Dimension (plus Standort) passen */
  function alles(){
    const punkte = sichtbareInstanzen().map(({ i }) => [i.x, i.z]);
    if(st.standort){
      const s = st.standort.dim === st.dim ? st.standort : null;
      const u = !s && umrechnen(st.standort.x, st.standort.z, st.standort.dim);
      if(s) punkte.push([s.x, s.z]); else if(u && u.dim === st.dim) punkte.push([u.x, u.z]);
    }
    if(!punkte.length){ Object.assign(sicht, { cx:0, cz:0, zoom:0.25 }); return; }
    const xs = punkte.map((p) => p[0]), zs = punkte.map((p) => p[1]);
    const [minX, maxX, minZ, maxZ] = [Math.min(...xs), Math.max(...xs), Math.min(...zs), Math.max(...zs)];
    const w = canvas.width / dpr, h = canvas.height / dpr;
    sicht.cx = (minX + maxX) / 2; sicht.cz = (minZ + maxZ) / 2;
    const noetig = Math.min((w - 90) / Math.max(1, maxX - minX + CONFIG.biomRadius * 2), (h - 120) / Math.max(1, maxZ - minZ + CONFIG.biomRadius * 2));
    sicht.zoom = Math.max(CONFIG.zoomMin, Math.min(1, noetig));
  }

  /** Rasterweite passend zum Zoom: 16 (Chunk), 128, 1024 … Blöcke */
  function rasterweite(){
    for(const s of [16, 64, 128, 512, 1024, 4096, 16384]) if(s * sicht.zoom >= 38) return s;
    return 65536;
  }

  function zeichnen(){
    if(st.ansicht !== "karte") return;
    if(angepasst !== `${st.welt?.id}:${st.dim}`){ groesse(); alles(); angepasst = `${st.welt?.id}:${st.dim}`; }
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = var_("--bg"); ctx.fillRect(0, 0, w, h);

    // Raster (unbekannte Fläche bleibt genau so: leer)
    const r = rasterweite();
    const [x0, z0] = zuWelt(0, 0), [x1, z1] = zuWelt(w, h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    ctx.beginPath();
    for(let x = Math.floor(x0 / r) * r; x <= x1; x += r){ const [px] = zuBild(x, 0); ctx.moveTo(Math.round(px) + .5, 0); ctx.lineTo(Math.round(px) + .5, h); }
    for(let z = Math.floor(z0 / r) * r; z <= z1; z += r){ const [, py] = zuBild(0, z); ctx.moveTo(0, Math.round(py) + .5); ctx.lineTo(w, Math.round(py) + .5); }
    ctx.stroke();
    // Achsen X=0 / Z=0
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.beginPath();
    const [ax, az] = zuBild(0, 0);
    ctx.moveTo(Math.round(ax) + .5, 0); ctx.lineTo(Math.round(ax) + .5, h);
    ctx.moveTo(0, Math.round(az) + .5); ctx.lineTo(w, Math.round(az) + .5);
    ctx.stroke();

    const eintraege = sichtbareInstanzen();
    marker = [];
    const belegt = [];   // bereits gezeichnete Beschriftungen – keine Überlappung
    const frei = (x, y, w, h) => {
      if(belegt.some((r) => x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y)) return false;
      belegt.push({ x, y, w, h }); return true;
    };

    // 1) Biome: Fläche nur um bekannte Punkte
    const biome = eintraege.filter((e) => e.t.kategorie === BIOMES);
    const legende = new Map();
    for(const { i, t } of biome){
      const b = biomFinden(t.variante); if(!b) continue;
      const farbe = biomFarbe(b);
      legende.set(b.name, farbe);
      const [px, py] = zuBild(i.x, i.z);
      const rad = Math.max(3, CONFIG.biomRadius * sicht.zoom);
      ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2);
      ctx.fillStyle = farbe + "8c"; ctx.fill();
      ctx.strokeStyle = farbe; ctx.lineWidth = 1.5; ctx.stroke();
      marker.push({ id:i.id, px, py, r:Math.max(rad, 14) });
      if(rad > 26 && frei(px - 40, py - 8, 80, 16)){
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.font = "600 11px -apple-system, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(b.name, px, py);
      }
    }

    // 2) Features + eigene Orte als Marker (Stil wie drawStructure in Modul A)
    const akzent = var_("--accent");
    const punkte = eintraege.filter((e) => e.t.kategorie !== BIOMES)
      .sort((a, b) => (a.t.kategorie === EIGENE_ORTE) - (b.t.kategorie === EIGENE_ORTE));
    for(const { i, t } of punkte){
      const [px, py] = zuBild(i.x, i.z);
      if(px < -20 || py < -20 || px > w + 20 || py > h + 20) continue;
      const eigen = t.kategorie === EIGENE_ORTE;
      ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI * 2);
      ctx.fillStyle = eigen ? akzent : "rgba(0,0,0,.6)"; ctx.fill();
      ctx.strokeStyle = akzent; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = eigen ? var_("--accent-ink") : akzent;
      ctx.font = "700 12px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(symbol(t.kategorie), px, py + 1);
      if(sicht.zoom >= 0.12 || eigen){
        const text = t.variante || t.kategorie;
        ctx.font = "600 11px -apple-system, system-ui, sans-serif";
        const tw = ctx.measureText(text).width;
        if(frei(px - tw / 2 - 5, py + 14, tw + 10, 17)){
          ctx.fillStyle = "rgba(0,0,0,.55)";
          ctx.fillRect(px - tw / 2 - 5, py + 14, tw + 10, 17);
          ctx.fillStyle = "#fff"; ctx.fillText(text, px, py + 23);
        }
      }
      marker.push({ id:i.id, px, py, r:16 });
    }

    // 3) Eigener Standort
    if(st.standort){
      let s = st.standort.dim === st.dim ? st.standort : null;
      if(!s){ const u = umrechnen(st.standort.x, st.standort.z, st.standort.dim); if(u && u.dim === st.dim) s = u; }
      if(s){
        const [px, py] = zuBild(s.x, s.z);
        ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.strokeStyle = akzent; ctx.globalAlpha = .45; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fillStyle = akzent; ctx.fill();
        ctx.font = "700 11px ui-monospace, monospace"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
        ctx.fillText("Du", px, py - 24);
      }
    }

    // Hinweis + Legende
    const bekannt = biome.length;
    $hinweis.innerHTML = `<span class="chip mono">${rasterweite()} Blöcke · ${bekannt ? `${bekannt} Biom-Punkte` : "keine Biome bekannt"}</span>`;
    $legende.innerHTML = [...legende].slice(0, 6).map(([n, f]) => `<span class="chip"><i style="background:${f}"></i>${esc(n)}</span>`).join("");
  }

  function zoomen(faktor, px, py){
    const w = canvas.width / dpr, h = canvas.height / dpr;
    px = px ?? w / 2; py = py ?? h / 2;
    const [wx, wz] = zuWelt(px, py);
    sicht.zoom = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, sicht.zoom * faktor));
    // Punkt unter dem Finger bleibt stehen
    sicht.cx = wx - (px - w / 2) / sicht.zoom;
    sicht.cz = wz - (py - h / 2) / sicht.zoom;
    zeichnen();
  }

  const lokal = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    zeiger.set(e.pointerId, lokal(e));
    bewegt = false;
    if(zeiger.size === 1){ const [px, py] = lokal(e); ziehen = { px, py, cx:sicht.cx, cz:sicht.cz }; }
    if(zeiger.size === 2){
      const [a, b] = [...zeiger.values()];
      pinch = { abstand:Math.hypot(a[0] - b[0], a[1] - b[1]), zoom:sicht.zoom };
      ziehen = null;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    if(!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, lokal(e));
    if(pinch && zeiger.size === 2){
      const [a, b] = [...zeiger.values()];
      const faktor = Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.abstand;
      const ziel = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, pinch.zoom * faktor));
      zoomen(ziel / sicht.zoom, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      bewegt = true;
      return;
    }
    if(ziehen){
      const [px, py] = lokal(e);
      if(Math.hypot(px - ziehen.px, py - ziehen.py) > 5) bewegt = true;
      sicht.cx = ziehen.cx - (px - ziehen.px) / sicht.zoom;
      sicht.cz = ziehen.cz - (py - ziehen.py) / sicht.zoom;
      zeichnen();
    }
  });
  const loslassen = (e) => {
    const [px, py] = lokal(e);
    zeiger.delete(e.pointerId);
    if(zeiger.size < 2) pinch = null;
    if(zeiger.size === 0){
      if(!bewegt){
        // Tap: nächsten Marker suchen (Features vor Biomen, weil später gezeichnet)
        const treffer = marker.slice().reverse().find((m) => Math.hypot(m.px - px, m.py - py) <= m.r);
        if(treffer) detailOeffnen(treffer.id);
      }
      ziehen = null;
    }
  };
  canvas.addEventListener("pointerup", loslassen);
  canvas.addEventListener("pointercancel", (e) => { zeiger.delete(e.pointerId); ziehen = null; pinch = null; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); const [px, py] = lokal(e); zoomen(e.deltaY < 0 ? 1.15 : 1 / 1.15, px, py); }, { passive:false });
  document.getElementById("karteZoomIn").addEventListener("click", () => zoomen(1.6));
  document.getElementById("karteZoomOut").addEventListener("click", () => zoomen(1 / 1.6));
  document.getElementById("karteFit").addEventListener("click", () => { alles(); zeichnen(); });
  window.addEventListener("resize", () => { if(st.ansicht === "karte"){ groesse(); zeichnen(); } });

  /** Auf einen Punkt springen (z. B. aus den Sammelobjekten) */
  function zentrieren(x, z){
    groesse();
    const zoom = Math.max(sicht.zoom, 0.6);
    // Punkt ins obere Drittel legen – unten öffnet sich das Detail-Sheet
    Object.assign(sicht, { cx:x, cz:z + (canvas.height / dpr) * 0.22 / zoom, zoom });
    angepasst = `${st.welt?.id}:${st.dim}`;
    zeichnen();
  }
  return { zeichnen, zentrieren, neuAnpassen(){ angepasst = null; } };
})();

function sheetOeffnen(art, html, dim){

const kopfHtml = (titel, sub) => `<div class="sheet-kopf"><div class="titel"><h2>${titel}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
  <button class="icon-btn" data-aktion="schliessen" aria-label="Schließen">${X_ICON}</button></div>`;

function koordFelder(prefix, x, y, z){
  const feld = (achse, wert, optional) => `<label class="field"><span class="field-label">${achse}</span>
    <span class="koord-in"><input type="text" inputmode="numeric" autocomplete="off" data-koord="${prefix}${achse}"
      value="${wert ?? ""}" placeholder="${optional ? "—" : "0"}" aria-label="${achse}-Koordinate">
    <button type="button" class="vz" data-vz="${prefix}${achse}" aria-label="Vorzeichen ${achse}">±</button></span></label>`;
  return `<div class="field-grid g3">${feld("X", x)}${feld("Y", y, true)}${feld("Z", z)}</div>`;
}
function koordLesen(prefix){
  const lies = (a) => {
    const v = $sheet.querySelector(`[data-koord="${prefix}${a}"]`)?.value.trim() ?? "";
    if(v === "" || v === "-") return null;
    const n = Number(v); return Number.isInteger(n) ? n : NaN;
  };
  return { x:lies("X"), y:lies("Y"), z:lies("Z") };
}
const koordGueltig = (k) => Number.isInteger(k.x) && Number.isInteger(k.z) && (k.y === null || Number.isInteger(k.y));

// --- Detail ------------------------------------------------------------------
function detailOeffnen(id, loeschenFragen){

  const t = typVon(i), dim = dimTypeVon(i.dimensionId);
  const w = entfernung(st.standort, i.x, i.z, dim);
  const biom = t.kategorie === BIOMES ? biomFinden(t.variante) : null;
  const titel = esc(t.variante || t.kategorie);
  const sub = `${t.variante ? `${esc(t.kategorie)} · ` : ""}${dimLabel(dim)}${biom ? ` · ${esc(biom.gruppe)}` : ""}`;
  const html = kopfHtml(titel, sub) + `<div class="orte-inhalt">
    <div class="result-card">
      <div class="result-label">Koordinaten</div>
      <div class="result-coords mono">
        <span><span class="lbl">X</span><b>${zahl(i.x)}</b></span>
        <span><span class="lbl">Y</span><b>${i.y != null ? zahl(i.y) : "—"}</b></span>
        <span><span class="lbl">Z</span><b>${zahl(i.z)}</b></span>
      </div>
      ${umrechnen(i.x, i.z, dim) ? `<div class="result-row"><span class="rname">${portalHtml(i.x, i.z, dim, "mono")}</span></div>` : ""}
      ${w ? `<div class="result-row"><span class="rname">Von deinem Standort</span><span><b class="rval mono">${entfernungText(w.meter)}</b><span class="runit">${w.richtung}</span></span></div>` : ""}
    </div>
    ${biom ? `<div class="banner info">Biome stammen aus Screenshots – die Koordinaten sind fest. Falsch erfasst? Löschen und neu auslesen.</div>` : ""}
    ${boardZeigenKnopf(`ort:${i.id}`)}
    <div class="knopf-raster">
      <button class="btn-secondary" data-aktion="kopieren" data-text="${i.x} ${i.y ?? "~"} ${i.z}">Koordinaten</button>
      <button class="btn-secondary" data-aktion="kopieren" data-text="${esc(tpBefehl(i.x, i.y, i.z, dim))}">/tp-Befehl</button>
    </div>
    ${loeschenFragen
      ? `<div class="knopf-raster"><button class="btn-secondary" data-aktion="detail" data-id="${i.id}">Abbrechen</button><button class="btn-danger" data-aktion="loeschen" data-id="${i.id}">Wirklich löschen</button></div>`
      : `<div class="knopf-raster">
          ${biom ? "" : `<button class="btn-primary" data-aktion="bearbeiten" data-id="${i.id}">Bearbeiten</button>`}
          <button class="btn-danger" data-aktion="loeschen-fragen" data-id="${i.id}" ${biom ? 'style="grid-column:1/-1"' : ""}>Löschen</button>
        </div>`}
  </div>`;

// --- Eintragen (manuell) ---------------------------------------------------
const form = { dim:"overworld", kategorie:EIGENE_ORTE, variante:"", neu:"" };
function formularOeffnen(){
  Object.assign(form, { dim:st.dim, kategorie:EIGENE_ORTE, variante:"", neu:"" });
  formularRendern();
}
function formularRendern(behalten){
  const alt = behalten ? koordLesen("f") : { x:null, y:null, z:null };
  const kats = kategorienManuell(form.dim);
  if(!kats.includes(form.kategorie)) form.kategorie = EIGENE_ORTE;
  const vorhandene = st.typen.filter((t) => t.kategorie === form.kategorie && t.variante).map((t) => t.variante)
    .filter((v, n, a) => a.indexOf(v) === n).sort((a, b) => a.localeCompare(b, "de"));
  const eigen = form.kategorie === EIGENE_ORTE;
  if(eigen && !vorhandene.includes(form.variante)) form.variante = "__neu__";
  const typFeld = eigen
    ? `<select class="orte-eingabe" id="formTyp">
        <option value="__neu__" ${form.variante === "__neu__" ? "selected" : ""}>Neuer Ort …</option>
        ${vorhandene.map((v) => `<option ${form.variante === v ? "selected" : ""}>${esc(v)}</option>`).join("")}
      </select>
      ${form.variante === "__neu__" ? `<input class="orte-eingabe" id="formNeu" maxlength="60" placeholder="z. B. Hauptbasis" value="${esc(form.neu)}">` : ""}`
    : `<select class="orte-eingabe" id="formTyp">
        <option value="" ${!form.variante ? "selected" : ""}>Ohne Variante</option>
        ${vorhandene.map((v) => `<option ${form.variante === v ? "selected" : ""}>${esc(v)}</option>`).join("")}
      </select>
      <div class="result-hint">Neue Varianten (z. B. „Stairway“) entstehen nur aus Screenshots.</div>`;

  const html = kopfHtml("Ort eintragen", "Von Hand – Biome nur per Screenshot") + `<div class="orte-inhalt">
    <div class="field-group"><div class="field-group-label">Dimension</div>
      <div class="tool-segment">${DIM_ORDER.map((d) => `<button class="seg-btn ${form.dim === d ? "active" : ""}" data-form-dim="${d}">${dimLabel(d)}</button>`).join("")}</div></div>
    <div class="field-group"><div class="field-group-label">Kategorie</div>
      <select class="orte-eingabe" id="formKategorie">${kats.map((k) => `<option ${form.kategorie === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></div>
    <div class="field-group"><div class="field-group-label">${eigen ? "Ort" : "Variante"}</div>${typFeld}</div>
    <div class="field-group"><div class="field-group-label">Koordinaten</div>
      <input class="orte-eingabe mono" id="formEinfuegen" placeholder="Einfügen: „X: -1,884 Z: -524“ oder /tp …" autocomplete="off">
      ${koordFelder("f", alt.x, alt.y, alt.z)}</div>
    <div class="banner" id="formBanner" hidden></div>
    <div class="sheet-fuss"><button class="btn-secondary" data-aktion="schliessen">Abbrechen</button>
      <button class="btn-primary" data-aktion="formular-speichern">Speichern</button></div>
  </div>`;
  const scroll = $sheet.scrollTop;
  sheetOeffnen("formular", html, form.dim);
  if(behalten) $sheet.scrollTop = scroll;
}

async function formularSpeichern(){
  const $b = document.getElementById("formBanner");
  const k = koordLesen("f");
  const eigen = form.kategorie === EIGENE_ORTE;
  const variante = eigen ? (form.variante === "__neu__" ? (document.getElementById("formNeu")?.value || "").trim() : form.variante) : (form.variante || null);
  if(!koordGueltig(k)) return banner($b, "bad", "Bitte X und Z als ganze Zahlen eintragen.");
  if(eigen && !variante) return banner($b, "bad", "Wie heißt der Ort?");
  const d = duplikat(form.dim, form.kategorie, variante, k.x, k.z);
  if(d && !$b.dataset.trotzdem){
    $b.dataset.trotzdem = "1";
    return banner($b, "warn", `Hier gibt es schon „${typLabel(typVon(d))}“. Nochmal tippen, um trotzdem zu speichern.`);
  }
  const r = await api("/orte/instanzen", { method:"POST", body:JSON.stringify({
    dimensionId:dimIdVon(form.dim), kategorie:form.kategorie, variante, x:k.x, y:k.y, z:k.z, quelle:"manuell" }) });
  if(!r.ok) return banner($b, "bad", meldungAus(r));
  uebernehmen(r.data);
  alleSchliessen();
  if(st.dim !== form.dim) dimWechseln(form.dim);
  toast(`„${variante || form.kategorie}“ gespeichert`);
  render();
}

// --- Screenshot-Prüfliste ------------------------------------------------------
let importLaeuft = false;
function importStarten(dateien){
  for(const datei of dateien){
    st.importe.push({ id:Math.random().toString(36).slice(2), url:URL.createObjectURL(datei), datei,
      status:"wartet", erkannt:null, dim:"overworld", x:"", y:"", z:"", an:false, meldungen:[] });
  }
  importRendern();
  importAbarbeiten();
}
async function importAbarbeiten(){
  if(importLaeuft) return;
  importLaeuft = true;
  let e;
  while((e = st.importe.find((x) => x.status === "wartet"))){
    e.status = "lese"; importRendern();
    const fd = new FormData(); fd.append("datei", e.datei);
    const r = await api("/orte/auslesen", { method:"POST", body:fd });
    if(!r.ok){ e.status = "fehler"; e.meldungen = [["bad", meldungAus(r)]]; importRendern(); continue; }
    const k = r.data?.erkannt;
    if(!k){ e.status = "leer"; e.meldungen = [["warn", "Kein Popup gefunden – ist die Karte aufgeklappt?"]]; importRendern(); continue; }
    Object.assign(e, { status:"fertig", erkannt:k, dim:k.dimension, x:String(k.x), y:k.y != null ? String(k.y) : "", z:String(k.z), an:true, meldungen:[] });
    if(k.kategorie === BIOMES){
      const b = biomFinden(k.variante);
      if(!b){ e.an = false; e.meldungen.push(["bad", `„${k.variante}“ steht nicht in der Biom-Liste`]); }
      else if(b.dimension !== k.dimension){
        e.dim = b.dimension;
        e.meldungen.push(["warn", `Das Dropdown zeigte ${dimLabel(k.dimension)}, ${b.name} liegt aber ${inDim(b.dimension)} – dort übernommen.`]);
      }
    } else if(!FEATURE_KATEGORIEN[e.dim].includes(k.kategorie)){
      e.an = false; e.meldungen.push(["bad", `„${k.kategorie}“ gibt es ${inDim(e.dim)} nicht`]);
    }
    const d = duplikat(e.dim, k.kategorie, k.variante, k.x, k.z);
    const imStapel = st.importe.find((o) => o !== e && o.status === "fertig" && o.dim === e.dim && o.erkannt.kategorie === k.kategorie
      && Math.abs(Number(o.x) - k.x) <= CONFIG.duplikatRadius && Math.abs(Number(o.z) - k.z) <= CONFIG.duplikatRadius);
    if(d){ e.an = false; e.meldungen.push(["warn", `Schon erfasst als „${typLabel(typVon(d))}“`]); }
    else if(imStapel){ e.an = false; e.meldungen.push(["warn", "Doppelt in dieser Auswahl"]); }
    importRendern();
  }
  importLaeuft = false;
}
function importFelderLesen(){
  for(const e of st.importe){
    if(e.status !== "fertig" || !e.an) continue;
    // Karte war vorher noch „Lese …“ → es gibt noch keine Felder, erkannte Werte behalten
    if(!$sheet.querySelector(`[data-koord="i${e.id}X"]`)) continue;
    const k = koordLesen(`i${e.id}`);
    e.x = k.x == null ? "" : String(k.x); e.y = k.y == null ? "" : String(k.y); e.z = k.z == null ? "" : String(k.z);
  }
}
function importRendern(){
  if(st.sheet && st.sheet !== "import") return;
  const scroll = $sheet.scrollTop;
  if(st.sheet === "import") importFelderLesen();
  const laufend = st.importe.some((e) => e.status === "wartet" || e.status === "lese");
  const auswahl = st.importe.filter((e) => e.status === "fertig" && e.an).length;
  const erkannt = st.importe.filter((e) => e.erkannt).length;
  const karten = st.importe.map((e) => {
    const k = e.erkannt;
    const biom = k && k.kategorie === BIOMES;
    const titel = e.status === "wartet" ? "Wartet …"
      : e.status === "lese" ? '<span class="dreher"></span>Lese Text …'
      : e.status === "gespeichert" ? `${esc(k.titel)} ✓`
      : k ? esc(k.variante ? `${k.kategorie} · ${k.variante}` : k.kategorie)
      : "Nicht erkannt";
    const meta = k ? `<span class="pill">${dimLabel(e.dim)}</span>${biom ? '<span class="pill">Biom</span>' : ""}` : "";
    const bearbeitbar = e.status === "fertig";
    return `<div class="card ${bearbeitbar && !e.an ? "aus" : ""}" style="${k ? "" : ""}" data-import="${e.id}">
      <div class="imp-kopf">
        <img src="${e.url}" alt="">
        <div class="text"><div class="card-title">${titel}</div><div class="card-meta">${meta}</div></div>
        ${bearbeitbar ? `<button class="switch ${e.an ? "on" : ""}" data-aktion="import-an" data-id="${e.id}" role="switch" aria-checked="${e.an}" aria-label="Übernehmen"></button>` : ""}
      </div>
      ${e.meldungen.map(([art, text]) => `<div class="banner ${art}">${esc(text)}</div>`).join("")}
      ${bearbeitbar && e.an ? `
        ${biom ? "" : `<div class="tool-segment">${DIM_ORDER.map((d) => `<button class="seg-btn ${e.dim === d ? "active" : ""}" data-import-dim="${d}" data-id="${e.id}">${dimLabel(d)}</button>`).join("")}</div>`}
        ${koordFelder(`i${e.id}`, e.x, e.y, e.z)}` : ""}
    </div>`;
  }).join("");
  const html = kopfHtml(st.importe.length === 1 ? "Screenshot auslesen" : `${st.importe.length} Screenshots auslesen`,
    laufend ? "Texterkennung läuft …" : `${erkannt} von ${st.importe.length} erkannt`) + `<div class="orte-inhalt">
    ${karten}
    <div class="sheet-fuss">
      <button class="btn-secondary" data-aktion="import-mehr" aria-label="Weitere Screenshots">+ Mehr</button>
      <button class="btn-primary" data-aktion="import-speichern" ${auswahl ? "" : "disabled"}>${laufend && !auswahl ? "Lese …" : auswahl === 1 ? "1 Ort speichern" : `${auswahl} Orte speichern`}</button>
    </div>
  </div>`;
  sheetOeffnen("import", html);
  $sheet.scrollTop = scroll;
}
async function importSpeichern(){
  importFelderLesen();
  const auswahl = st.importe.filter((e) => e.status === "fertig" && e.an);
  let gespeichert = 0; const dims = new Set();
  for(const e of auswahl){
    const x = Number(e.x), z = Number(e.z), y = e.y === "" ? null : Number(e.y);
    if(!Number.isInteger(x) || !Number.isInteger(z) || (y !== null && !Number.isInteger(y))){
      e.meldungen = [["bad", "Koordinaten prüfen"]]; continue;
    }
    const r = await api("/orte/instanzen", { method:"POST", body:JSON.stringify({
      dimensionId:dimIdVon(e.dim), kategorie:e.erkannt.kategorie, variante:e.erkannt.variante, x, y, z, quelle:"screenshot" }) });
    if(r.ok){ uebernehmen(r.data); e.status = "gespeichert"; e.meldungen = []; gespeichert++; dims.add(e.dim); }
    else e.meldungen = [["bad", meldungAus(r)]];
  }
  if(gespeichert === auswahl.length){
    st.importe.forEach((e) => URL.revokeObjectURL(e.url));
    st.importe = [];
    alleSchliessen();
    if(dims.size === 1) dimWechseln([...dims][0]);
    karte.neuAnpassen();
    toast(gespeichert === 1 ? "1 Ort gespeichert" : `${gespeichert} Orte gespeichert`);
    render();
  } else {
    render(); importRendern();
    toast(`${auswahl.length - gespeichert} nicht gespeichert`, true);
  }
}

function banner(el, art, text){
  el.className = "banner " + art; el.textContent = text; el.hidden = false;
  el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}
const $toast = document.getElementById("orteToast");
let toastTimer = null;
function toast(text, fehler){
  clearTimeout(toastTimer);
  $toast.textContent = text; $toast.classList.toggle("fehler", Boolean(fehler)); $toast.hidden = false;
  toastTimer = setTimeout(() => { $toast.hidden = true; }, CONFIG.toastMs);
}

/* ============================================================================
   9b · BEREICHE  ·  Registry für Sidebar (und später Dashboard-Widgets)
   ----------------------------------------------------------------------------
   Jeder Bereich ist in sich geschlossen: eigener State, eigene API-Pfade,
   eigenes Rendering. Modul-Vertrag:
     { key, titel, icon, mount(el), unmount(),
       ansichten: [{ key, titel, groessen:["1x1","2x1","2x2"], render(el, groesse) }] }
   „ansichten“ kommt später: Dashboard-Ansichten pro Bereich, nach dem Vorbild
   des iOS-Kontrollzentrums (siehe README → Dashboard-Ansichten).
   Bereiche: Karte (Live-Karte + Koordinaten-Sammlung), Sammelobjekte,
   Portal-Verwaltung, Handbuch, Baupläne, Banner, Rüstung.
   Umgesetzt sind Karte, Sammelobjekte, Portal-Verwaltung und Banner; ohne mount()
   erscheint ein Bereich in der Sidebar als „geplant“.
   ========================================================================== */
const ICON = Object.freeze({
  karte:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  sammelobjekte:'<path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  portale:'<path d="M6 21V7a6 6 0 0 1 12 0v14"/><path d="M9.5 21V8.5a2.5 2.5 0 0 1 5 0V21M4 21h16"/>',
  handbuch:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h5"/>',
  bauplaene:'<path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18M14 14h4v4h-4z"/>',
  banner:'<path d="M4 3h16"/><path d="M6 3v17l6-3 6 3V3"/><path d="M9 8h6M9 12h6"/>',
  ruestung:'<path d="M9 3 4 5v6h3v10h10V11h3V5l-5-2a3 3 0 0 1-6 0z"/>',
  board:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
});
const BEREICHE = [
  { key:"karte",         titel:"Karte",
    mount:() => { applyTheme(st.dim); karte.neuAnpassen(); render(); },
    unmount:() => alleSchliessen() },
  { key:"sammelobjekte", titel:"Sammelobjekte",       // Rüstungs-Modifikationen abhaken + Fundorte
    mount:() => { applyTheme("overworld"); render(); samLaden(); },
    unmount:() => alleSchliessen() },
  { key:"portale",       titel:"Portal-Verwaltung",   // Umrechnen, Verbindungen erfassen + prüfen
    mount:() => { applyTheme("nether"); render(); portaleLaden(); },
    unmount:() => alleSchliessen() },
  { key:"handbuch",      titel:"Handbuch" },
  { key:"bauplaene",     titel:"Baupläne" },
  { key:"banner",        titel:"Banner",              // Baupläne für Banner (Grundfarbe + Muster-Ebenen)
    mount:() => { applyTheme("overworld"); render(); bannerLaden(); },
    unmount:() => alleSchliessen() },
  { key:"ruestung",      titel:"Rüstung" },           // Rüstungs-Sets: Material, Besatz, Verzauberungen
];
let aktivesModul = "karte";
function modulWechseln(key){
  const bereich = BEREICHE.find((b) => b.key === key);
  alleSchliessen();
  if(!bereich?.mount){ toast(`„${bereich?.titel}“ ist geplant`); return; }
  if(key === aktivesModul) return;
  BEREICHE.find((b) => b.key === aktivesModul)?.unmount?.();
  aktivesModul = key;
  document.querySelectorAll(".module").forEach((el) => el.classList.toggle("is-active", el.dataset.module === key));
  document.getElementById("kopfTitel").textContent = bereich.titel;
  document.getElementById("kopfIcon").innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[key]}</svg>`;
  sidebarBauen(key);
  bereich.mount();
}

function sidebarBauen(aktiv){
  document.getElementById("sbNav").innerHTML = BEREICHE.map((b) => {
    const da = typeof b.mount === "function";
    return `<button class="nav-item ${b.key === aktiv ? "active" : ""} ${da ? "" : "soon"}" data-module="${b.key}">
      <span class="ico"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[b.key]}</svg></span>
      ${esc(b.titel)}${da ? "" : '<span class="soon-tag">geplant</span>'}
    </button>`;
  }).join("");
}

/* ============================================================================
   9c · SAMMELOBJEKTE  ·  Rüstungs-Modifikationen abhaken, Fundorte aus der Karte
   ========================================================================== */
const sam = { status:{}, filter:"alle", zu:new Set(), weltId:null };
const $samListe = document.getElementById("samListe");
const HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const themaStil = (dim) => Object.entries(THEMES[dim].ui).map(([k, v]) => `${k}:${v}`).join(";");
const samGefundenAnzahl = () => SAM_ZAEHLT.filter((o) => sam.status[o.id]).length;
const datumKurz = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", { day:"numeric", month:"numeric" }); };

/** Kennblock der Fundort-Struktur als Bild – ohne Bild (oder wenn es nicht lädt) das Symbol */
function kennblockHtml(kategorie){
  const s = STRUKTUREN[kategorie];
  return s && s.bild !== false
    ? `<img class="kennblock" src="${KENNBLOCK_PFAD}${s.id}.png" alt="" data-symbol="${esc(symbol(kategorie))}">`
    : esc(symbol(kategorie));
}
// error bubbelt nicht → in der Capture-Phase abfangen
document.addEventListener("error", (e) => {
  if(e.target instanceof HTMLImageElement && e.target.classList.contains("kennblock")) e.target.replaceWith(e.target.dataset.symbol);
}, true);

/** Bekannte Instanzen einer Fundort-Kategorie in der aktuellen Welt – nächste zuerst */
function bekannteFundorte(kategorie, dim){
  const dimId = dimIdVon(dim);
  return st.instanzen
    .filter((i) => i.dimensionId === dimId && typVon(i)?.kategorie === kategorie)
    .map((i) => ({ i, w:entfernung(st.standort, i.x, i.z, dim) }))
    .sort((a, b) => (a.w && b.w) ? a.w.meter - b.w.meter : 0);
}

async function samLaden(){
  if(!st.weltId) return;
  const r = await api(`/sammelobjekte/welten/${st.weltId}`);
  if(!r.ok){ toast(meldungAus(r), true); return; }
  sam.status = r.data.status || {};
  sam.weltId = st.weltId;
  if(aktivesModul === "sammelobjekte") render();
}

function renderSammel(){
  const gefunden = samGefundenAnzahl(), gesamt = SAM_ZAEHLT.length;
  const bekannt = FUNDORTE.filter((f) => bekannteFundorte(f.kategorie, f.dim).length).length;
  document.getElementById("samGefunden").textContent = gefunden;
  document.getElementById("samGesamt").textContent = gesamt;
  document.getElementById("samFundorte").textContent = bekannt;
  document.getElementById("samFundorteGesamt").textContent = FUNDORTE.length;
  document.getElementById("samProzent").textContent = Math.round(gefunden / gesamt * 100);
  document.getElementById("samBalken").style.width = `${gefunden / gesamt * 100}%`;
  document.querySelectorAll("#samFilter .seg-btn").forEach((b) => b.classList.toggle("active", b.dataset.filter === sam.filter));

  const passt = (o) => sam.filter === "alle" || (sam.filter === "gefunden") === Boolean(sam.status[o.id]);
  $samListe.innerHTML = FUNDORTE.map((f) => {
    const objekte = SAMMELOBJEKTE.filter((o) => o.kategorie === f.kategorie && o.dim === f.dim);
    const sichtbar = objekte.filter(passt);
    if(!sichtbar.length) return "";
    const key = `${f.dim}:${f.kategorie}`;
    const fund = bekannteFundorte(f.kategorie, f.dim);
    const naechster = fund[0];
    const fundText = fund.length
      ? `${fund.length} bekannt${naechster.w ? ` · nächste <span class="weg">${entfernungText(naechster.w.meter)}</span> ${naechster.w.richtung}` : ""}`
      : "Noch nicht auf der Karte";
    const zaehlbar = objekte.filter((o) => !o.aufwertung);
    const items = sichtbar.map((o) => {
      const s = sam.status[o.id];
      return `<div class="ach-item sam-item ${s ? "earned" : ""}" data-sam="${o.id}">
        <div class="ach-icon">${esc(o.name.charAt(0))}</div>
        <div class="ach-body">
          <div class="ach-name">${esc(o.name)}<span class="en">${esc(o.en)}</span></div>
          <div class="ach-desc">${esc(o.quelle)}</div>
          <div class="ach-foot">${s ? `<span class="von">✓ ${esc(s.von)} · ${datumKurz(s.am)}</span>` : `<span>${fundText}</span>`}${o.aufwertung ? '<span class="pill">Aufwertung</span>' : ""}</div>
        </div>
        <button class="sam-check" data-sam-haken="${o.id}" aria-label="${esc(o.name)} ${s ? "zurücksetzen" : "abhaken"}" aria-pressed="${Boolean(s)}">${HAKEN}</button>
      </div>`;
    }).join("");
    return `<div class="ach-cat ${sam.zu.has(key) ? "" : "open"}" data-sam-kat="${esc(key)}" style="${themaStil(f.dim)}">
      <div class="ach-cat-head">
        <span class="ach-cat-icon">${kennblockHtml(f.kategorie)}</span>
        <span class="ach-cat-name">${esc(strukturName(f.kategorie))}${f.dim !== "overworld" ? `<span class="ach-cat-dim">${dimLabel(f.dim)}</span>` : ""}<span class="en">${esc(f.kategorie)}</span></span>
        <span class="ach-cat-count">${zaehlbar.filter((o) => sam.status[o.id]).length}/${zaehlbar.length}</span>
        <span class="ach-cat-chevron">${CHEVRON}</span>
      </div>
      <div class="ach-cat-items">${items}</div>
    </div>`;
  }).join("") || `<div class="empty-list">${sam.filter === "gefunden" ? "Noch nichts abgehakt." : "Alles gefunden – stark!"}</div>`;
}

async function samUmschalten(id){
  const vorher = sam.status[id];
  // Sofort umschalten, bei Fehler zurück
  if(vorher) delete sam.status[id]; else sam.status[id] = { von:"…", am:new Date().toISOString() };
  render();
  const r = await api(`/sammelobjekte/welten/${st.weltId}/${id}`, { method:"PUT", body:JSON.stringify({ gefunden:!vorher }) });
  if(!r.ok){
    if(vorher) sam.status[id] = vorher; else delete sam.status[id];
    toast(meldungAus(r), true);
  } else sam.status = r.data.status;
  render();
  if(st.sheet === "sam") samDetailOeffnen(id);
}

function samDetailOeffnen(id){
  const o = SAMMELOBJEKTE.find((x) => x.id === id); if(!o) return;
  const s = sam.status[id];
  const fund = bekannteFundorte(o.kategorie, o.dim);
  const fundHtml = fund.length
    ? `<div class="list-stack">${fund.slice(0, 5).map(({ i, w }) => `<div class="card fund-zeile">
        ${coordHtml(i.x, i.y, i.z)}
        ${w ? `<span class="weg">${entfernungText(w.meter)}</span><span class="card-meta">${w.richtung}</span>` : ""}

const MAX_EBENEN = 6;   // so viele Muster nimmt der Webstuhl

/** Regeln für einen Bauplan – identisch im Server umzusetzen. Gibt Fehlertext oder null zurück. */
function bannerPruefen(b){
  const name = String(b?.name ?? "").trim();
  if(!name) return "Bitte einen Namen eingeben";
  if(name.length > 60) return "Name ist zu lang (max. 60 Zeichen)";
  if(!FARBEN.some((f) => f.id === b.basis)) return "Unbekannte Grundfarbe";
  if(!Array.isArray(b.ebenen)) return "Ebenen fehlen";
  if(b.ebenen.length > MAX_EBENEN) return `Im Webstuhl passen höchstens ${MAX_EBENEN} Muster auf ein Banner`;
  for(const e of b.ebenen){
    if(!MUSTER.some((m) => m.id === e?.muster)) return "Unbekanntes Muster";
    if(!FARBEN.some((f) => f.id === e?.farbe)) return "Unbekannte Farbe";
  }
  return null;
}
const bannerSauber = (b) => ({ name:String(b.name).trim(), basis:b.basis, ebenen:b.ebenen.map(({ muster, farbe }) => ({ muster, farbe })) });

/** Zeichnet ein Banner auf 20×40 Pixel → Data-URL (mit Cache) */
const bannerCache = new Map();
function bannerBild(b){
  const schluessel = JSON.stringify([b.basis, b.ebenen]);
  if(bannerCache.has(schluessel)) return bannerCache.get(schluessel);
  const c = document.createElement("canvas");
  c.width = 20; c.height = 40;
  const g = c.getContext("2d");
  const bild = g.createImageData(20, 40);
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const pix = Array.from({ length:800 }, () => rgb(farbe(b.basis).hex));
  for(const e of b.ebenen){
    const m = muster(e.muster).m, f = rgb(farbe(e.farbe).hex);
    for(let y = 0; y < 40; y++) for(let x = 0; x < 20; x++){
      const a = Math.max(0, Math.min(1, Number(m(x, y))));
      if(!a) continue;
      const p = pix[y * 20 + x];
      pix[y * 20 + x] = p.map((v, i) => Math.round(v * (1 - a) + f[i] * a));
    }
  }
  pix.forEach((p, i) => { bild.data.set([...p, 255], i * 4); });
  g.putImageData(bild, 0, 0);
  const url = c.toDataURL();
  bannerCache.set(schluessel, url);
  return url;
}
const bannerImg = (b, klasse, alt) => `<img class="banner-bild ${klasse || ""}" src="${bannerBild(b)}" alt="${esc(alt || "")}">`;
const vorlagenVon = (b) => [...new Set(b.ebenen.map((e) => e.muster).filter((m) => BANNERVORLAGEN[m]))];

/** Material + Schritte für Werkbank und Webstuhl */
function bannerAnleitung(b){
  const farbstoffe = new Map();
  for(const e of b.ebenen) farbstoffe.set(e.farbe, (farbstoffe.get(e.farbe) || 0) + 1);
  const schritte = [
    { titel:"Banner herstellen", info:`6 × ${farbe(b.basis).wolle} + 1 Stock · Werkbank`, bild:{ basis:b.basis, ebenen:[] } },
    ...b.ebenen.map((e, n) => {
      const v = BANNERVORLAGEN[e.muster];
      return { titel:muster(e.muster).de, en:muster(e.muster).en,
        info:`${farbe(e.farbe).farbstoff}${v ? ` + ${v.de}` : ""} · Webstuhl`,
        bild:{ basis:b.basis, ebenen:b.ebenen.slice(0, n + 1) } };
    }),
  ];
  return { farbstoffe, vorlagen:vorlagenVon(b), schritte };
}

/** Klicks im Editor. Gibt true zurück, wenn der Klick hier behandelt wurde. */
function bannerEditorKlick(ziel){
  const e = bn.entwurf; if(!e) return false;
  const basis = ziel.closest("[data-basis]");
  if(basis){ e.basis = basis.dataset.basis; bannerEditorRendern(); return true; }
  const wahl = ziel.closest("[data-ebene]");
  const f = ziel.closest("[data-farbe]"), m = ziel.closest("[data-muster]");
  if(wahl && (f || m)){
    const l = e.ebenen[Number(wahl.dataset.ebene)];
    if(f) l.farbe = f.dataset.farbe; else l.muster = m.dataset.muster;
    bannerEditorRendern(); return true;
  }
  const a = ziel.closest("[data-aktion]"); if(!a) return false;
  const n = Number(a.dataset.n);
  const tauschen = (i, j) => { [e.ebenen[i], e.ebenen[j]] = [e.ebenen[j], e.ebenen[i]]; if(bn.offen === i) bn.offen = j; else if(bn.offen === j) bn.offen = i; };
  switch(a.dataset.aktion){
    case "ebene-auf": bn.offen = bn.offen === n ? null : n; break;
    case "ebene-neu":
      if(e.ebenen.length >= MAX_EBENEN) return true;
      e.ebenen.push({ muster:"stripe_bottom", farbe:kontrast(e.basis) });
      bn.offen = e.ebenen.length - 1; break;
    case "ebene-hoch": if(n > 0) tauschen(n, n - 1); break;
    case "ebene-runter": if(n < e.ebenen.length - 1) tauschen(n, n + 1); break;
    case "ebene-weg":
      e.ebenen.splice(n, 1);
      if(bn.offen === n) bn.offen = null; else if(bn.offen > n) bn.offen--;
      break;
    default: return false;
  }
  bannerEditorRendern();
  return true;
}

async function bannerSpeichern(){
  const e = bn.entwurf;
  e.name = document.getElementById("bannerName").value.trim();
  const $m = document.getElementById("bannerMeldung");
  const problem = bannerPruefen(e);
  if(problem) return banner($m, "bad", problem + ".");
  const body = JSON.stringify(bannerSauber(e));
  const r = e.id ? await api(`/banner/${e.id}`, { method:"PUT", body }) : await api("/banner", { method:"POST", body });
  if(!r.ok) return banner($m, "bad", meldungAus(r));
  const neu = r.data.banner;
  const i = bn.liste.findIndex((x) => x.id === neu.id);
  // Muster geändert → abgehakte Schritte passen nicht mehr
  if(i >= 0 && JSON.stringify([bn.liste[i].basis, bn.liste[i].ebenen]) !== JSON.stringify([neu.basis, neu.ebenen]))
    lsSchreiben(`banner.schritte.${neu.id}`, null);
  if(i >= 0) bn.liste[i] = neu; else bn.liste.unshift(neu);
  bn.entwurf = null;
  render(); bannerDetailOeffnen(neu.id); toast("Banner gespeichert");
}

async function bannerLoeschen(id){
  const r = await api(`/banner/${id}`, { method:"DELETE" });
  if(!r.ok) return toast(meldungAus(r), true);
  bn.liste = bn.liste.filter((b) => b.id !== id);
  lsSchreiben(`banner.schritte.${id}`, null);
  alleSchliessen(); render(); toast("Banner gelöscht");
}

function bannerSchrittUmschalten(id, n){
  const erledigt = bannerFortschritt(id);
  erledigt.has(n) ? erledigt.delete(n) : erledigt.add(n);
  lsSchreiben(`banner.schritte.${id}`, erledigt.size ? [...erledigt] : null);
  bannerDetailOeffnen(id);
}

/* ============================================================================
   9e · PORTAL-VERWALTUNG  ·  Umrechnen, Verbindungen erfassen + prüfen, Infokarte
   ----------------------------------------------------------------------------
   Verbindung = zwei Portale (Oberwelt + Nether) einer Welt, für alle gemeinsam.
   Die Prüfung spielt nach, was das Spiel beim Durchgehen macht – aber nur mit
   den hier erfassten Portalen:
     1. Position umrechnen: Oberwelt → Nether ÷ 8 (abgerundet), zurück × 8, Y bleibt
     2. Im Suchbereich (Quadrat) um diesen Zielpunkt nach Portalen suchen:
        Bedrock ±128 in beiden Dimensionen · Java ±16 im Nether, ±128 in der Oberwelt
     3. Das nächste gewinnt – 3D-Abstand, Y zählt mit. Keins gefunden → neues Portal.
   Quelle: minecraft.wiki/w/Nether_portal („Portal search“)
   Die Edition (Bedrock/Java) ist eine Einstellung auf dem Gerät, Standard Bedrock.
   ========================================================================== */
const PORTAL_REGELN = Object.freeze({
  bedrock: { label:"Bedrock", radius:{ overworld:128, nether:128 } },
  java:    { label:"Java",    radius:{ overworld:128, nether:16 } },
});
const pt = {
  liste: [],
  edition: lsLesen("portale.edition") === "java" ? "java" : "bedrock",
  info: Boolean(lsLesen("portale.info")),
  rechner: Object.assign({ von:"overworld", x:"", y:"", z:"" }, lsLesen("portale.rechner") || {}),
  entwurfId: null,   // Verbindung im Editor (null = neu)
};
const $portalStage = document.getElementById("portalStage");
const andereDim = (d) => d === "overworld" ? "nether" : "overworld";
const dimFarbe = (d) => THEMES[d].ui["--accent"];
const kurzKoord = (p) => `X ${zahl(p.x)}${p.y != null ? ` · Y ${zahl(p.y)}` : ""} · Z ${zahl(p.z)}`;
const regelLabel = () => PORTAL_REGELN[pt.edition].label;

/** Beide Portale jeder Verbindung als flache Liste */
function portaleAlle(liste){
  return liste.flatMap((v) => [
    { vid:v.id, name:v.name, dim:"overworld", ...v.oberwelt },
    { vid:v.id, name:v.name, dim:"nether", ...v.nether },
  ]);
}

/** Was passiert, wenn man an Punkt p (Dimension „von“) durchs Portal geht? */
function zielSuchen(von, p, portale){
  const u = umrechnen(p.x, p.z, von);
  const ziel = { x:u.x, y:p.y ?? null, z:u.z, dim:u.dim };
  const radius = PORTAL_REGELN[pt.edition].radius[u.dim];
  let treffer = null;
  for(const q of portale){
    if(q.dim !== u.dim || Math.abs(q.x - ziel.x) > radius || Math.abs(q.z - ziel.z) > radius) continue;
    const dy = q.y != null && ziel.y != null ? q.y - ziel.y : 0;
    const abstand = Math.hypot(q.x - ziel.x, dy, q.z - ziel.z);
    if(!treffer || abstand < treffer.abstand) treffer = { portal:q, abstand };
  }
  return { ziel, radius, treffer };
}

/** Prüft beide Richtungen einer Verbindung gegen alle erfassten Portale der Welt */
function verbindungPruefen(v, liste){
  const portale = portaleAlle([...liste.filter((x) => x.id !== v.id), v]);
  const hin = zielSuchen("overworld", v.oberwelt, portale);
  const rueck = zielSuchen("nether", v.nether, portale);
  const art = (s) => !s.treffer ? "neu" : s.treffer.portal.vid === v.id ? "ok" : "anders";
  const artHin = art(hin), artRueck = art(rueck);
  const ideal = { x:hin.ziel.x, y:v.oberwelt.y ?? v.nether.y ?? null, z:hin.ziel.z };
  let gesamt = "ok", label = "Verbunden";
  if(artHin === "neu" || artRueck === "neu"){ gesamt = "bad"; label = "Neues Portal"; }
  else if(artHin === "anders" && artRueck === "anders"){ gesamt = "warn"; label = "Falsch verknüpft"; }
  else if(artHin === "anders" || artRueck === "anders"){ gesamt = "warn"; label = "Einseitig"; }
  return { hin, rueck, artHin, artRueck, gesamt, label, ideal,
    abweichung:Math.round(Math.hypot(v.nether.x - ideal.x, v.nether.z - ideal.z)) };
}

/** Konkreter Vorschlag, wenn eine Verbindung nicht passt */
function portalEmpfehlung(v, p, liste){
  if(p.gesamt === "ok") return null;
  const versetzt = { ...v, nether:{ ...p.ideal } };
  const schonIdeal = p.abweichung === 0 && (v.nether.y ?? null) === p.ideal.y;
  if(!schonIdeal && verbindungPruefen(versetzt, liste).gesamt === "ok")
    return { art:"info", text:`Nether-Portal genau bei ${kurzKoord(p.ideal)} bauen – dann passt es in beide Richtungen. Das alte Nether-Portal danach ausschalten.` };
  return { art:"warn", text:"Auch am Idealpunkt klappt es nicht: Ein anderes Portal liegt zu nah. Die Portale weiter auseinander bauen oder das störende entfernen." };
}

function richtungText(s, art){
  if(art === "ok") return `kommt am eigenen Portal an${s.treffer.abstand >= 1 ? ` (${Math.round(s.treffer.abstand)} Blöcke vom Zielpunkt)` : ""}`;
  if(art === "anders") return `landet bei <b>„${esc(s.treffer.portal.name)}“</b> – das liegt näher am Zielpunkt ${zahl(s.ziel.x)} / ${zahl(s.ziel.z)}`;
  return `kein Portal im Suchbereich (±${s.radius}) – das Spiel baut ein neues bei ${zahl(s.ziel.x)} / ${zahl(s.ziel.z)}`;
}
const pruefZeile = (von, s, art) => `<div class="pruef-zeile ${art === "ok" ? "ok" : art === "anders" ? "warn" : "bad"}">
  <span class="ico">${art === "ok" ? "✓" : "!"}</span>
  <span><b>${dimLabel(von)} → ${dimLabel(andereDim(von))}:</b> ${richtungText(s, art)}</span></div>`;
const pruefZeilen = (p) => pruefZeile("overworld", p.hin, p.artHin) + pruefZeile("nether", p.rueck, p.artRueck);

/** Regeln für eine Verbindung – identisch im Server umzusetzen. Gibt Fehlertext oder null zurück. */
function verbindungRegelPruefen(v){
  const name = String(v?.name ?? "").trim();
  if(!name) return "Bitte einen Namen eingeben";
  if(name.length > 60) return "Name ist zu lang (max. 60 Zeichen)";
  const seite = (s, dim) => {
    const grenze = dim === "overworld" ? CONFIG.weltGrenze : CONFIG.weltGrenze / 8;
    const [ymin, ymax] = dim === "overworld" ? [-64, 320] : [0, 256];
    if(!s || !Number.isInteger(s.x) || !Number.isInteger(s.z)) return `${dimLabel(dim)}: X und Z als ganze Zahlen eintragen`;
    if(Math.abs(s.x) > grenze || Math.abs(s.z) > grenze) return `${dimLabel(dim)}: Koordinaten liegen außerhalb der Welt`;
    if(s.y != null && (!Number.isInteger(s.y) || s.y < ymin || s.y > ymax)) return `${dimLabel(dim)}: Y muss zwischen ${ymin} und ${ymax} liegen`;
    return null;
  };
  return seite(v.oberwelt, "overworld") || seite(v.nether, "nether");
}
const verbindungSauber = (v) => ({
  name:String(v.name).trim(),
  oberwelt:{ x:v.oberwelt.x, y:v.oberwelt.y ?? null, z:v.oberwelt.z },
  nether:{ x:v.nether.x, y:v.nether.y ?? null, z:v.nether.z },
});

async function portaleLaden(){
  if(!st.weltId) return;
  const r = await api(`/portale/welten/${st.weltId}`);
  if(!r.ok) return toast(meldungAus(r), true);
  pt.liste = r.data.verbindungen;
  if(aktivesModul === "portale") render();
}

function rechnerWerte(){
  const n = (v) => (v === "" || v === "-" ? null : Number(v));
  const x = n(pt.rechner.x), y = n(pt.rechner.y), z = n(pt.rechner.z);
  if(!Number.isInteger(x) || !Number.isInteger(z) || (y !== null && !Number.isInteger(y))) return null;
  return { x, y, z };
}
function rechnerZiel(){
  const p = rechnerWerte(); if(!p) return null;
  return { p, s:zielSuchen(pt.rechner.von, p, portaleAlle(pt.liste)) };
}
function rechnerErgebnisHtml(){

      <div class="result-coords mono"><span><span class="lbl">X</span><b>${zahl(z.x)}</b></span>${z.y != null ? `<span><span class="lbl">Y</span><b>${zahl(z.y)}</b></span>` : ""}<span><span class="lbl">Z</span><b>${zahl(z.z)}</b></span></div>

  return `<div class="result-card rechner">

/* ============================================================================
   9f · BOARD-VERBINDUNG  ·  QR-Code der Anzeige scannen, beitreten, live halten
   ----------------------------------------------------------------------------
   Das Koordinaten-Board zeigt einen QR-Code mit „http://<ip>:<port>/?pin=1234“.
   Die Companion liest ihn (Kamera, Foto oder von Hand), tritt mit Name + PIN
   bei und hält danach die Live-Verbindung offen:
     POST <board>/api/beitreten  { pin, name }  → { token, name }
     WS   <board>/ws?token=…                    → { art:"zustand"|"teilnehmer", … }
   Das Board ist ein eigenes Gerät: Die Verbindung ist auch im DEMO-Modus echt.
   Sie gilt nur für dieses Gerät (localStorage „board.verbindung“, „board.name“).

   „Aufs Board“ (Inhalte auf die Anzeige werfen), über dieselbe Verbindung:
     → { art:"zeigen", karte, anfrage }       ← { art:"ok"|"fehler", anfrage }
     → { art:"verbergen", id, anfrage }       ← an alle: { art:"gezeigt", karte|null }
     karte = { titel, unter?, bereich?, quelle?, dimension:"oberwelt"|"nether"|"ende"|null,
               bloecke:[ { art:"koordinaten", label?, x, y|null, z, dimension? }
                       | { art:"zeilen", zeilen:[{ label, wert }] } | { art:"text", text } ] }
   Das Board prüft die Karte (koordinaten-board/server/src/zeigen.js) und zeigt
   sie groß, bis die nächste kommt oder jemand sie wegnimmt. Welche Inhalte es
   gibt, legt BOARD_KARTEN fest – das Board selbst kennt keine Bereiche.
   ========================================================================== */
const bd = {
  verbindung: lsLesen("board.verbindung"),  // { adresse, token, name } oder null
  status: "aus",                             // aus · verbindet · verbunden · getrennt
  teilnehmer: [], orte: null,
  socket: null, timer: null, wartezeit: 500,
  scan: null,                                // { stream } solange die Kamera läuft
  gezeigt: null,                             // Karte, die gerade auf der Anzeige liegt
  offen: new Map(), zaehler: 0,              // gesendete Nachrichten, die auf „ok“ warten
};
const BOARD_DIM = Object.freeze({ overworld:"oberwelt", nether:"nether", end:"ende" });
const adresseKurz = (a) => String(a || "").replace(/^https?:\/\//, "");

/** Inhalt des Board-QR-Codes lesen: „http://192.168.8.184:3000/?pin=1234“ → { adresse, pin } */
function boardQrLesen(text){
  let url;
  try { url = new URL(String(text || "").trim()); } catch { return null; }
  const pin = url.searchParams.get("pin") || "";
  if(!/^https?:$/.test(url.protocol) || !/^\d{4}$/.test(pin)) return null;
  return { adresse:url.origin, pin };
}
/** Adresse von Hand: „192.168.8.184“ oder „192.168.8.184:3000“ → „http://192.168.8.184:3000“ */
function boardAdresseLesen(text){
  let t = String(text || "").trim().replace(/\/+$/, "");
  if(!t) return null;
  if(!/^https?:\/\//i.test(t)) t = "http://" + t;
  let url;
  try { url = new URL(t); } catch { return null; }
  if(!url.port && url.protocol === "http:") url.port = String(CONFIG.boardPort);
  return url.origin;
}

// --- QR-Erkennung: BarcodeDetector (Android-Chrome), sonst jsQR nachladen -----
let qrLeserZusage = null;
function skriptLaden(src){
  return new Promise((ok, fehler) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); fehler(new Error("Skript nicht geladen")); };
    document.head.appendChild(s);
  });
}
/** Liefert eine Funktion (Video, Bild oder ImageBitmap) → Text des QR-Codes oder null */
function qrLeser(){
  if(!qrLeserZusage) qrLeserZusage = (async () => {
    if("BarcodeDetector" in window){
      try {
        if((await BarcodeDetector.getSupportedFormats()).includes("qr_code")){
          const d = new BarcodeDetector({ formats:["qr_code"] });
          return async (quelle) => (await d.detect(quelle))[0]?.rawValue || null;
        }
      } catch {}
    }
    if(!window.jsQR) await skriptLaden(CONFIG.qrBibliothek);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    return async (quelle) => {
      const w0 = quelle.videoWidth || quelle.width, h0 = quelle.videoHeight || quelle.height;
      if(!w0 || !h0) return null;
      const f = Math.min(1, CONFIG.scanMaxPx / Math.max(w0, h0));
      const w = Math.round(w0 * f), h = Math.round(h0 * f);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(quelle, 0, 0, w, h);
      return window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h)?.data || null;
    };
  })();
  qrLeserZusage.catch(() => { qrLeserZusage = null; });  // nächster Versuch lädt neu
  return qrLeserZusage;
}

// --- Kamera ------------------------------------------------------------------
async function boardScanStarten(){
  boardScanStoppen();
  const $box = document.getElementById("boardScanner"), $text = document.getElementById("boardScanText");
  const $video = document.getElementById("boardVideo");
  if(!$box) return;
  $box.classList.remove("aus", "erkannt");
  const aus = (text) => { $box.classList.add("aus"); $text.textContent = text; };
  if(!navigator.mediaDevices?.getUserMedia)
    return aus(window.isSecureContext ? "Keine Kamera gefunden – Foto oder Adresse nutzen"
                                      : "Kamera nur über https – Foto oder Adresse nutzen");
  const scan = { stream:null };
  bd.scan = scan;
  $text.textContent = "Kamera startet …";
  try {
    scan.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
  } catch(e){
    if(bd.scan !== scan) return;
    bd.scan = null;
    return aus(e?.name === "NotAllowedError" ? "Kamera nicht erlaubt – Foto oder Adresse nutzen"
                                             : "Keine Kamera gefunden – Foto oder Adresse nutzen");
  }
  // Sheet inzwischen geschlossen → Kamera gleich wieder aus
  if(bd.scan !== scan){ scan.stream.getTracks().forEach((t) => t.stop()); return; }
  $video.srcObject = scan.stream;
  try { await $video.play(); } catch {}
  let lesen;
  try { lesen = await qrLeser(); }
  catch { boardScanStoppen(); return aus("QR-Erkennung nicht geladen – Foto oder Adresse nutzen"); }
  if(bd.scan !== scan) return;
  $text.textContent = "QR-Code der Anzeige in den Rahmen halten";
  const runde = async () => {
    if(bd.scan !== scan) return;
    if($video.readyState >= 2){
      const text = await lesen($video).catch(() => null);
      if(bd.scan !== scan) return;
      if(text && boardTreffer(text)) return;
    }
    setTimeout(runde, CONFIG.scanTaktMs);
  };
  runde();
}
function boardScanStoppen(){
  const s = bd.scan; bd.scan = null;
  s?.stream?.getTracks().forEach((t) => t.stop());
}

/** Gelesener QR-Text – true, wenn es der Code eines Boards war */
function boardTreffer(text){
  const qr = boardQrLesen(text);
  const $text = document.getElementById("boardScanText");
  if(!qr){
    if(bd.scan && $text) $text.textContent = "Das ist kein QR-Code vom Board";
    return false;
  }
  boardScanStoppen();
  document.getElementById("boardScanner")?.classList.add("erkannt");
  if($text) $text.textContent = "Erkannt";
  document.getElementById("boardAdresse").value = adresseKurz(qr.adresse);
  document.getElementById("boardPin").value = qr.pin;
  banner(document.getElementById("boardBanner"), "ok", `QR-Code erkannt · ${adresseKurz(qr.adresse)}`);
  const $name = document.getElementById("boardName");
  if($name.value.trim()) boardBeitretenKlick(); else $name.focus();
  return true;
}
async function boardFotoLesen(datei){
  const $b = document.getElementById("boardBanner");
  let text = null;
  try {
    const bild = await createImageBitmap(datei);
    text = await (await qrLeser())(bild);
    bild.close?.();
  } catch { return banner($b, "bad", "Foto konnte nicht gelesen werden – Adresse und PIN von Hand eintragen."); }
  if(!text) return banner($b, "bad", "Auf dem Foto ist kein QR-Code zu erkennen.");
  if(!boardTreffer(text)) banner($b, "bad", "Das ist kein QR-Code vom Koordinaten-Board.");
}

// --- Beitreten + Live-Verbindung -----------------------------------------------
function boardNetzFehler(adresse){
  if(location.protocol === "https:" && adresse.startsWith("http:"))
    return "Der Browser blockiert die Verbindung: Die Companion läuft über https, das Board über http.";
  return "Board nicht erreichbar – gleiches WLAN? Läuft das Board noch?";
}
async function boardBeitreten(adresse, pin, name){
  let res, data = null;
  try {
    res = await fetch(`${adresse}/api/beitreten`, { method:"POST",
      headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ pin, name }) });
    data = await res.json().catch(() => null);
  } catch { return { fehler:boardNetzFehler(adresse) }; }
  if(!res.ok) return { fehler:data?.fehler || `Fehler ${res.status}` };
  return { verbindung:{ adresse, token:data.token, name:data.name } };
}
async function boardBeitretenKlick(){
  const $b = document.getElementById("boardBanner"), $knopf = $sheet.querySelector('[data-aktion="board-beitreten"]');
  const roh = document.getElementById("boardAdresse").value;
  const ausQr = boardQrLesen(roh);
  const adresse = ausQr?.adresse || boardAdresseLesen(roh);
  const pin = document.getElementById("boardPin").value.trim() || ausQr?.pin || "";
  const name = document.getElementById("boardName").value.trim();
  if(!adresse) return banner($b, "bad", "Adresse fehlt – QR-Code scannen oder eintragen.");
  if(!/^\d{4}$/.test(pin)) return banner($b, "bad", "Die PIN hat 4 Ziffern und steht auf der Anzeige.");
  if(!name) return banner($b, "bad", "Wie heißt du? Der Name steht auf dem Board bei deinen Einträgen.");
  lsSchreiben("board.name", name);
  $knopf.disabled = true; $knopf.textContent = "Verbinde …";
  const r = await boardBeitreten(adresse, pin, name);
  const offen = st.sheet === "board" && $knopf.isConnected;   // Sheet evtl. schon zu
  if(r.fehler){
    if(!offen) return;
    $knopf.disabled = false; $knopf.textContent = "Beitreten";
    return banner($b, "bad", r.fehler);
  }
  bd.verbindung = r.verbindung; lsSchreiben("board.verbindung", r.verbindung);
  boardVerbinden();
  if(offen) boardSheetRendern();
  toast("Mit dem Board verbunden");
}

function boardVerbinden(){
  boardSocketZu();
  const v = bd.verbindung; if(!v) return;
  bd.status = "verbindet"; boardAnzeigen();
  let ws;
  try { ws = new WebSocket(`${v.adresse.replace(/^http/, "ws")}/ws?token=${encodeURIComponent(v.token)}`); }
  catch { bd.status = "getrennt"; boardAnzeigen(); return; }   // z. B. ws:// von einer https-Seite
  bd.socket = ws;
  ws.onopen = () => { if(bd.socket !== ws) return; bd.status = "verbunden"; bd.wartezeit = 500; boardAnzeigen(); };
  ws.onmessage = (e) => {
    let n; try { n = JSON.parse(e.data); } catch { return; }
    if((n.art === "ok" || n.art === "fehler") && n.anfrage){
      const w = bd.offen.get(n.anfrage); bd.offen.delete(n.anfrage);
      return n.art === "ok" ? w?.ok() : w?.fehler(n.text || "Board hat abgelehnt");
    }
    if(n.art === "teilnehmer") bd.teilnehmer = n.namen || [];
    else if(n.art === "zustand") bd.orte = n.zustand?.orte?.length ?? null;
    else if(n.art === "gezeigt") bd.gezeigt = n.karte || null;
    else return;
    boardAnzeigen();
  };
  ws.onclose = (e) => {
    if(bd.socket !== ws) return;             // absichtlich geschlossen oder ersetzt
    bd.socket = null;
    boardOffeneAbbrechen();
    if(e.code === 4001){                     // Token abgelehnt, z. B. Board neu eingerichtet
      boardTrennen();
      return toast("Das Board kennt dieses Gerät nicht mehr – bitte neu scannen", true);
    }
    bd.status = "getrennt"; boardAnzeigen();
    bd.timer = setTimeout(boardVerbinden, bd.wartezeit);
    bd.wartezeit = Math.min(bd.wartezeit * 2, 8000);
  };
}
function boardSocketZu(){
  clearTimeout(bd.timer);
  const s = bd.socket; bd.socket = null;
  s?.close();
  boardOffeneAbbrechen();
}
function boardOffeneAbbrechen(){
  for(const w of bd.offen.values()) w.fehler("Verbindung zum Board unterbrochen");
  bd.offen.clear();
  bd.gezeigt = null;                          // nach dem Neuverbinden schickt das Board den Stand
}
/** Nachricht ans Board, wartet auf dessen „ok“ (sonst Fehlertext) */
function boardSenden(op){
  return new Promise((ok, fehler) => {
    const s = bd.socket;
    if(!s || s.readyState !== WebSocket.OPEN) return fehler("Keine Verbindung zum Board");
    const anfrage = ++bd.zaehler;
    bd.offen.set(anfrage, { ok, fehler });
    s.send(JSON.stringify({ ...op, anfrage }));
    setTimeout(() => { if(bd.offen.delete(anfrage)) fehler("Board antwortet nicht"); }, 8000);
  });
}

// Welche Inhalte sich zeigen lassen: quelle „<art>:<id>“ → Karte fürs Board
const BOARD_KARTEN = {
  ort: ortKarte,                              // Karte: ein Ort aus der Koordinaten-Sammlung
};
function ortKarte(id){
  const i = st.instanzen.find((x) => x.id === id); if(!i) return null;
  const t = typVon(i), dim = dimTypeVon(i.dimensionId);
  const biom = t.kategorie === BIOMES ? biomFinden(t.variante) : null;
  const bloecke = [{ art:"koordinaten", x:i.x, y:i.y ?? null, z:i.z }];
  const u = umrechnen(i.x, i.z, dim);
  if(u) bloecke.push({ art:"koordinaten", label:u.dim === "nether" ? "Im Nether" : "In der Oberwelt",
                       x:u.x, y:null, z:u.z, dimension:BOARD_DIM[u.dim] });
  const unter = [t.variante ? t.kategorie : null, biom?.gruppe].filter(Boolean).join(" · ");
  return { titel:t.variante || t.kategorie, unter:unter || undefined, bereich:"Karte",
           quelle:`ort:${i.id}`, dimension:BOARD_DIM[dim], bloecke };
}
async function boardZeigen(quelle){
  const [art, ...rest] = quelle.split(":");
  const karte = BOARD_KARTEN[art]?.(rest.join(":"));
  if(!karte) return toast("Das lässt sich nicht aufs Board legen", true);
  try { await boardSenden({ art:"zeigen", karte }); toast("Liegt auf dem Board"); }
  catch(f){ toast(String(f), true); }
}
async function boardWegnehmen(){
  if(!bd.gezeigt) return;
  try { await boardSenden({ art:"verbergen", id:bd.gezeigt.id }); toast("Vom Board genommen"); }
  catch(f){ toast(String(f), true); }

/** Knopf „Aufs Board“ für ein Sheet – nur, wenn dieses Gerät mit einem Board verbunden ist */

function uebernehmen({ instanz, typ }){
  if(typ && !st.typen.some((t) => t.id === typ.id)) st.typen.push(typ);
  if(instanz){
    const alt = st.instanzen.findIndex((i) => i.id === instanz.id);
    if(alt >= 0) st.instanzen[alt] = instanz; else st.instanzen.push(instanz);
    const w = st.welten.find((x) => x.id === st.weltId); if(w && alt < 0) w.anzahl = (w.anzahl || 0) + 1;
  }
}
async function weltenLaden(){
  const r = await api("/orte/welten");
  if(!r.ok){ toast(meldungAus(r), true); return; }
  st.welten = r.data.welten;
  if(!st.welten.some((w) => w.id === st.weltId)) st.weltId = st.welten[0]?.id || null;
  if(st.weltId) await weltLaden(st.weltId);
}
async function weltLaden(id){
  const r = await api(`/orte/welten/${id}`);
  if(!r.ok){ toast(meldungAus(r), true); return; }
  Object.assign(st, { weltId:id, welt:r.data.welt, dimensionen:r.data.dimensionen, typen:r.data.typen, instanzen:r.data.instanzen, filter:null });
  lsSchreiben("orte.welt", id);
  karte.neuAnpassen();
  render();
  samLaden();
  portaleLaden();
}

$sheet.addEventListener("click", async (e) => {
  const vz = e.target.closest("[data-vz]");
  if(vz){
    const inp = $sheet.querySelector(`[data-koord="${vz.dataset.vz}"]`);
    inp.value = inp.value.startsWith("-") ? inp.value.slice(1) : "-" + inp.value;
    if(st.sheet === "portal-editor") portalEditorPruefen();
    return;
  }
  const fd = e.target.closest("[data-form-dim]");
  if(fd){ form.dim = fd.dataset.formDim; return formularRendern(true); }
  const sd = e.target.closest("[data-standort-dim]");
  if(sd){
    standortDim = sd.dataset.standortDim;
    $sheet.querySelectorAll("[data-standort-dim]").forEach((b) => b.classList.toggle("active", b === sd));
    return themaSetzen($sheet, standortDim);
  }
  const idim = e.target.closest("[data-import-dim]");
  if(idim){
    importFelderLesen();
    const imp = st.importe.find((x) => x.id === idim.dataset.id);
    imp.dim = idim.dataset.importDim;
    return importRendern();
  }
  if(st.sheet === "banner-editor" && bannerEditorKlick(e.target)) return;
  const a = e.target.closest("[data-aktion]"); if(!a) return;
  const id = a.dataset.id;
  switch(a.dataset.aktion){
    case "schliessen": alleSchliessen(); break;
    case "detail": detailOeffnen(id); break;
    case "kopieren":
      try { await kopieren(a.dataset.text); toast("Kopiert"); } catch { toast("Kopieren nicht möglich", true); }
      break;
    case "loeschen-fragen": detailOeffnen(id, true); break;
    case "loeschen": {
      const r = await api(`/orte/instanzen/${id}`, { method:"DELETE" });
      if(!r.ok) return toast(meldungAus(r), true);
      st.instanzen = st.instanzen.filter((i) => i.id !== id);
      const w = st.welten.find((x) => x.id === st.weltId); if(w) w.anzahl = Math.max(0, (w.anzahl || 1) - 1);
      alleSchliessen(); toast("Gelöscht"); render();
      break;
    }
    case "bearbeiten": bearbeitenOeffnen(id); break;
    case "bearbeiten-speichern": {
      const k = koordLesen("b"), $b = document.getElementById("bearbeitenBanner");
      if(!koordGueltig(k)) return banner($b, "bad", "Bitte X und Z als ganze Zahlen eintragen.");
      const r = await api(`/orte/instanzen/${id}`, { method:"PATCH", body:JSON.stringify(k) });
      if(!r.ok) return banner($b, "bad", meldungAus(r));
      uebernehmen(r.data); render(); detailOeffnen(id); toast("Gespeichert");
      break;
    }
    case "formular-speichern": formularSpeichern(); break;
    case "import-an": {
      importFelderLesen();
      const imp = st.importe.find((x) => x.id === id); imp.an = !imp.an;
      importRendern(); break;
    }
    case "import-mehr": importFelderLesen(); $datei.click(); break;
    case "import-speichern": importSpeichern(); break;
    case "welt-waehlen":
      if(id !== st.weltId){ await weltLaden(id); toast("Welt gewechselt"); }
      alleSchliessen(); break;
    case "welt-anlegen": {
      const seed = document.getElementById("weltSeed").value.trim();
      const r = await api("/orte/welten", { method:"POST", body:JSON.stringify({ seed }) });
      if(!r.ok) return weltOeffnen(["bad", meldungAus(r)]);
      st.welten.push({ ...r.data.welt, anzahl:0 });
      await weltLaden(r.data.welt.id);
      alleSchliessen(); toast("Welt angelegt");
      break;
    }
    case "standort-speichern": {
      const k = koordLesen("s");
      if(!koordGueltig(k)) return toast("X und Z als ganze Zahlen eintragen", true);
      st.standort = { ...k, dim:standortDim }; lsSchreiben("orte.standort", st.standort);
      alleSchliessen(); render(); break;
    }
    case "sam-umschalten": samUmschalten(id); break;
    case "sam-auf-karte": aufKarteZeigen(id); break;
    case "sam-zur-karte":
      modulWechseln("karte");
      if(st.dim !== a.dataset.dim) dimWechseln(a.dataset.dim);
      if(st.ansicht !== "karte") ansichtWechseln("karte");
      break;
    case "standort-weg":
      st.standort = null; lsSchreiben("orte.standort", null); alleSchliessen(); render(); break;
    // Portal-Verwaltung
    case "portal-bearbeiten": portalEditorOeffnen(id); break;
    case "portal-aus-oberwelt": portalBerechnen("n"); break;
    case "portal-aus-nether": portalBerechnen("o"); break;
    case "portal-speichern": portalSpeichern(); break;
    case "portal-abbrechen": {
      const zurueck = pt.entwurfId; pt.entwurfId = null;
      zurueck ? portalDetailOeffnen(zurueck) : alleSchliessen();
      break;
    }
    case "portal-loeschen":
      if(a.dataset.sicher !== "1"){ a.dataset.sicher = "1"; a.textContent = "Wirklich löschen?"; return; }
      portalLoeschen(id); break;
    // Banner
    case "banner-schritt": bannerSchrittUmschalten(id, Number(a.dataset.n)); break;
    case "banner-schritte-weg": lsSchreiben(`banner.schritte.${id}`, null); bannerDetailOeffnen(id); break;
    case "banner-bearbeiten": bannerEditorOeffnen(id); break;
    case "banner-speichern": bannerSpeichern(); break;
    case "banner-abbrechen": {
      const zurueck = bn.entwurf?.id; bn.entwurf = null;
      zurueck ? bannerDetailOeffnen(zurueck) : alleSchliessen();
      break;
    }
    // Board-Verbindung
    case "board-beitreten": boardBeitretenKlick(); break;
    case "board-kamera": boardScanStarten(); break;
    case "board-foto": document.getElementById("boardFoto").click(); break;
    case "board-trennen": boardTrennen(); alleSchliessen(); toast("Vom Board getrennt"); break;
    case "board-zeigen": boardZeigen(a.dataset.boardQuelle); break;
    case "board-wegnehmen": boardWegnehmen(); break;
    case "banner-loeschen":
      // Zweimal tippen – ein Bauplan ist schnell weg und für alle
      if(a.dataset.sicher !== "1"){ a.dataset.sicher = "1"; a.textContent = "Wirklich löschen?"; return; }
      bannerLoeschen(id); break;
  }
});

  sidebarBauen("karte");
  boardKnopfRendern();
  if(bd.verbindung) boardVerbinden();
  document.getElementById("kopfIcon").innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.karte}</svg>`;
  applyTheme(st.dim);
  ansichtWechseln(st.ansicht);
  uhr(); setInterval(uhr, 30000);
  weltenLaden().then(() => {
    const start = new URLSearchParams(location.search).get("modul");
    if(start && start !== "karte") modulWechseln(start);
  });
}
init();
</script>
</body>
