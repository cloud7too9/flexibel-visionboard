          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="lab">Neue Verbindung</span>
        </button>
        <button class="bb-item" id="portalWeltBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <span class="lab">Welt</span>
        </button>
      </nav>
    </section>

    <!-- === Modul: Banner · Baupläne ========================================= -->
    <section class="module" data-module="banner" id="moduleBanner">
      <div class="orte-stage banner-stage">
        <div class="orte-suche">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="orte-eingabe" id="bannerSuche" type="search" placeholder="Banner suchen …" autocomplete="off">
        </div>
        <div class="banner-raster" id="bannerListe"></div>
      </div>
      <nav class="bottombar">
        <button class="bb-item" id="bannerScreenshotBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
          <span class="lab">Screenshot</span>
        </button>
        <div class="bb-placeholder">Baupläne gelten für alle Welten</div>
        <button class="bb-item active" id="bannerNeuBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="lab">Neuer Banner</span>
        </button>
      </nav>
    </section>

    <!-- === Modul: Rüstung · Sets am Schmiedetisch =========================== -->
    <section class="module" data-module="ruestung" id="moduleRuestung">
      <div class="orte-stage ruestung-stage">
        <div class="list-stack" id="ruestungListe"></div>
      </div>
      <nav class="bottombar">
        <div class="bb-placeholder">Sets gelten für alle Welten · ✓ = Besatz in dieser Welt gefunden</div>
        <button class="bb-item active" id="ruestungNeuBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="lab">Neues Set</span>
        </button>
      </nav>
    </section>

  </main>

  <!-- EBENE 1 · Sidebar – wird aus BEREICHE gebaut -->
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="kicker">Minecraft</div>
      <div class="name">Companion</div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <!-- Verbindung zum Koordinaten-Board im Zimmer (kein Bereich, gilt fürs Gerät) -->
    <div class="sb-fuss"><button class="board-knopf" id="boardBtn"></button></div>
  </aside>

  <!-- Ein Sheet für alle Ansichten des Moduls – Inhalt wird je nach Aufgabe gerendert -->
  <section class="sheet orte-sheet" id="orteSheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="orteSheetInhalt"></div>
  </section>

  <div class="orte-toast chip" id="orteToast" hidden></div>
</div>

<script src="regeln.js"></script>
<script src="board-karten.js"></script>
<script src="biom-ids.js"></script>
<script>
"use strict";
/* ============================================================================
   KARTE · KOORDINATEN-SAMMLUNG  ·  nach dem minimalen Datenmodell
   (wird Teil des Moduls „Karte“, vormals Live-Karte)
   ----------------------------------------------------------------------------
   DATABASE                         STATIC CONFIG
   ├── World  (id, seed)            ├── FeatureCategory  (je Dimension)
   ├── Dimension (id, worldId,type) ├── FeatureType      (Kategorie + Variante)
   └── FeatureInstance              ├── Biome            (Name, Gruppe, Dimension)
       (id, dimensionId,            └── Group
        featureTypeId, x, y?, z)

   Regeln (Server prüft, Mock bildet sie nach):
   · „Eigene Orte“ ist eine zusätzliche Kategorie – dort legt man Typen selbst an
     (z. B. „Hauptbasis“), in allen anderen Kategorien entstehen Typen nur aus
     Screenshots (Variante aus dem Popup, z. B. Stronghold → „Stairway“).
   · Biome kommen ausschließlich aus dem Welt-Import (.zip/.mcworld, 9h): je Chunk
     ein Biom, als Kacheln zu 32 × 32 Chunks. Unerkundete Fläche bleibt leer.

   Abschnitte: 0 Konfig · 1 Themes · 2 Stammdaten · 3 Koordinaten · 4 API-Vertrag
               + DEMO-Mock · 5 State · 6 Theme · 7 Liste · 8 Karte · 9 Sheets
               · 9h Welt-Import · 10 Init
   ========================================================================== */

/* ============================================================================
   0 · KONFIG
   ========================================================================== */
const CONFIG = Object.freeze({
  duplikatRadius: 3,     // Blöcke – gleicher Typ so nah beieinander gilt als Duplikat
  kachelChunks: KACHEL_CHUNKS,   // Biom-Kachel: 32 × 32 Chunks = 512 × 512 Blöcke (regeln.js)
  netherBiomY: 64,       // Nether und End haben keine Oberfläche – Biom auf dieser Höhe
  endBiomY: 64,
  zoomMin: 0.02,         // Pixel pro Block
  zoomMax: 4,
  toastMs: 2600,
  weltGrenze: WELTGRENZE,  // Minecraft-Weltgrenze ±30 Mio. (regeln.js)
  boardPort: 3000,       // Standard-Port des Koordinaten-Boards, falls von Hand ohne Port eingetragen

/** Kennblock einer Kategorie als <img> – ohne Bild (oder wenn es nicht lädt) das Symbol */
function kennblockHtml(kategorie){

    ? `<img class="kennblock" src="${datei}" alt="" data-symbol="${esc(symbol(kategorie))}">`

// error bubbelt nicht → in der Capture-Phase abfangen
document.addEventListener("error", (e) => {
  if(e.target instanceof HTMLImageElement && e.target.classList.contains("kennblock")) e.target.replaceWith(e.target.dataset.symbol);
}, true);

/** Kennblock für die Canvas-Karte: das geladene Bild oder null (lädt noch, fehlt) → dann das Symbol.
    Ist ein Bild fertig geladen, wird die Karte neu gezeichnet. */
const kennblockBilder = new Map();
function kennblockBild(kategorie){
  const datei = kennblockDatei(kategorie); if(!datei) return null;
  let img = kennblockBilder.get(datei);
  if(!img){
    img = new Image();
    img.onload = () => { if(aktivesModul === "karte" && st.ansicht === "karte") karte.zeichnen(); };
    img.src = datei;
    kennblockBilder.set(datei, img);
  }
  return img.complete && img.naturalWidth ? img : null;
}

   zahl, umrechnen, entfernung stehen in board-karten.js (auch der Server braucht sie)
   ========================================================================== */
const entfernungText = (m) => m >= 1000 ? `${(m/1000).toLocaleString("de-DE", { maximumFractionDigits:1 })} km` : `${m} m`;

/** Bedrock: /execute in <dim> run tp @s x y z */
function tpBefehl(x, y, z, dim){
  const welt = { overworld:"overworld", nether:"nether", end:"the_end" }[dim];
  return `/execute in ${welt} run tp @s ${x} ${y ?? "~"} ${z}`;
}

/** Erkennt Koordinaten in eingefügtem Text: „X: -1,884 Z: -524“, /tp-Befehle, „100 64 -200“ … */
function koordinatenErkennen(text){
  if(!text || !text.trim()) return null;
  let dim = null;
  if(/the_nether|\bnether\b/i.test(text)) dim = "nether";
  else if(/the_end|\bend\b/i.test(text)) dim = "end";
  else if(/overworld|oberwelt/i.test(text)) dim = "overworld";
  const normal = text.replace(/[—–−]/g, "-");
  const b = normal.match(/X\s*[:=]?\s*(-?\s?\d[\d,.' ]*)\s*(?:Y\s*[:=]?\s*(-?\s?\d[\d,.' ]*)\s*)?Z\s*[:=]?\s*(-?\s?\d[\d,.' ]*)/i);
  if(b){
    const lesen = (roh) => {
      if(!roh || !/\d/.test(roh)) return null;
      const w = Number(roh.replace(/\D/g, ""));
      return roh.trim().startsWith("-") ? -w : w;
    };
    return { x:lesen(b[1]), y:lesen(b[2]), z:lesen(b[3]), dim };
  }
  const tp = normal.match(/tp\s+@\w+\s+(.*)$/i);
  const zahlen = [...(tp ? tp[1] : normal).matchAll(/-?\d+(?:\.\d+)?/g)].map((m) => Math.floor(Number(m[0])));
  if(zahlen.length >= 3) return { x:zahlen[0], y:zahlen[1], z:zahlen[2], dim };
  if(zahlen.length === 2) return { x:zahlen[0], y:null, z:zahlen[1], dim };
  return null;
}

/** Demo-Biome: Kacheln [{ dim, kx, kz, daten (Base64) }] für die Orte der Beispielwelt */
function demoBiome(orte){
  const rauschen = (x, z, s) => {   // weiches Rauschen 0…1 aus Sinuswellen, s = Startwert
    const w = (a, b, c) => Math.sin(x * a + z * b + c);
    return (w(0.11, 0.07, s) + w(-0.05, 0.13, s * 2) + w(0.031, -0.023, s * 3) * 1.5 + 3.5) / 7;
  };
  const LAND = [[0.30, 0], [0.33, 16], [0.42, 1], [0.50, 4], [0.56, 27], [0.62, 35], [0.70, 29], [0.78, 5], [1, 3]];
  const NETHER = [[0.35, 8], [0.5, 178], [0.65, 179], [0.8, 180], [1, 181]];
  const biomVon = (dim, cx, cz) => {
    if(dim === "end") return 9;
    const n = rauschen(cx, cz, dim === "nether" ? 7 : 1);
    if(dim === "nether") return NETHER.find(([g]) => n <= g)[1];
    if(Math.abs(Math.sin(cx * 0.09) * 9 - cz + 4) < 1.2) return 7;   // ein Fluss
    return LAND.find(([g]) => n <= g)[1];
  };
  const kacheln = new Map();
  for(const dim of DIM_ORDER){
    const mitten = orte.filter((i) => i.dimensionId.endsWith(`_${dim}`)).map((i) => [i.x >> 4, i.z >> 4, 28]);
    if(dim === "overworld") mitten.push([0, 0, 48]);
    for(const [mx, mz, r] of mitten) for(let cx = mx - r; cx <= mx + r; cx++) for(let cz = mz - r; cz <= mz + r; cz++){
      if(Math.hypot(cx - mx, cz - mz) > r * (0.8 + 0.25 * rauschen(cx, cz, 5))) continue;
      const kx = Math.floor(cx / CONFIG.kachelChunks), kz = Math.floor(cz / CONFIG.kachelChunks);
      const s = `${dim}:${kx}:${kz}`;
      if(!kacheln.has(s)) kacheln.set(s, { dim, kx, kz, daten:new Uint16Array(CONFIG.kachelChunks ** 2) });
      kacheln.get(s).daten[(cz - kz * CONFIG.kachelChunks) * CONFIG.kachelChunks + (cx - kx * CONFIG.kachelChunks)] = biomVon(dim, cx, cz) + 1;
    }
  }
  return [...kacheln.values()].map((k) => ({ ...k, daten:kachelZuText(k.daten) }));
}

function mockApi(path, opts){
  opts = opts || {};
  const method = (opts.method || "GET").toUpperCase();
  const body = typeof opts.body === "string" ? JSON.parse(opts.body) : null;
  const ok = (data, status) => ({ ok:true, status:status || 200, data });
  const fehler = (status, message) => ({ ok:false, status, data:{ error:"fehler", message } });
  // ID eines neuen Eintrags wie am Board: vom Handy (UUID, geprüft, nicht doppelt), ohne vergibt der Mock eine
  const eintragId = (praefix, liste) => {
    if(body?.id == null) return { id:MOCK.neueId(praefix) };
    if(!idGueltig(body.id)) return { fehler:fehler(400, "Ungültige ID") };
    if(liste.some((x) => x.id === body.id)) return { fehler:fehler(409, "Diesen Eintrag gibt es schon") };
    return { id:body.id };
  };
  const anzahl = (weltId) => MOCK.instanzen.filter((i) => i.dimensionId.startsWith(`d_${weltId}_`)).length;
  let m;

  if(method === "GET" && path === "/orte/welten")
    return ok({ welten:MOCK.welten.map((w) => ({ ...w, anzahl:anzahl(w.id) })) });

  if(method === "POST" && path === "/orte/welten"){
    const seed = String(body?.seed ?? "").trim();
    if(!/^-?\d{1,20}$/.test(seed)) return fehler(400, "Seed muss eine Zahl sein");
    if(MOCK.welten.some((w) => w.seed === seed)) return fehler(409, "Diese Welt gibt es schon");
    const welt = { id:MOCK.neueId("w"), seed };
    MOCK.welten.push(welt);
    DIM_ORDER.forEach((type) => MOCK.dimensionen.push({ id:`d_${welt.id}_${type}`, worldId:welt.id, type }));
    return ok({ welt }, 201);
  }

  if(method === "GET" && (m = path.match(/^\/orte\/welten\/([\w-]+)$/))){
    const welt = MOCK.welten.find((w) => w.id === m[1]);
    if(!welt) return fehler(404, "Welt nicht gefunden");
    const dimensionen = MOCK.dimensionen.filter((d) => d.worldId === welt.id);
    const dimIds = new Set(dimensionen.map((d) => d.id));
    const instanzen = MOCK.instanzen.filter((i) => dimIds.has(i.dimensionId));
    const typIds = new Set(instanzen.map((i) => i.featureTypeId));
    // Alle Typen liefern (sie sind welt-übergreifend), damit Varianten wiederverwendbar sind
    return ok({ welt, dimensionen, typen:MOCK.typen.slice(), instanzen:instanzen.map((i) => ({ ...i })), _benutzt:typIds.size });
  }

  if(path === "/ich") return ok({ id:"demo", name:MOCK.ich });

  if(method === "POST" && path === "/orte/instanzen"){
    const d = MOCK.dimensionen.find((x) => x.id === body?.dimensionId);
    if(!d) return fehler(400, "Dimension unbekannt");
    const variante = body.variante ? String(body.variante).trim().slice(0, 60) : null;
    const vorhanden = MOCK.typFinden(body.kategorie, variante);
    const e = { ...body, variante };
    const problem = instanzPruefen(e, d.type, Boolean(vorhanden));
    if(problem) return fehler(422, problem);
    const neu = eintragId("i", MOCK.instanzen); if(neu.fehler) return neu.fehler;
    let typ = vorhanden;
    if(!typ){ typ = { id:MOCK.neueId("t"), kategorie:body.kategorie, variante }; MOCK.typen.push(typ); }
    const instanz = { id:neu.id, dimensionId:d.id, featureTypeId:typ.id, x:body.x, y:body.y ?? null, z:body.z };
    MOCK.instanzen.push(instanz);
    return ok({ instanz:{ ...instanz }, typ }, 201);
  }

  if(method === "PUT" && (m = path.match(/^\/orte\/instanzen\/([\w-]+)\/angeheftet$/))){
    const i = MOCK.instanzen.find((x) => x.id === m[1]);
    if(!i) return fehler(404, "Ort nicht gefunden");
    i.angeheftet = Boolean(body?.angeheftet);
    return ok({ instanz:{ ...i } });
  }
  if((m = path.match(/^\/orte\/instanzen\/([\w-]+)$/))){
    const i = MOCK.instanzen.find((x) => x.id === m[1]);
    if(!i) return fehler(404, "Ort nicht gefunden");
    if(method === "DELETE"){
      MOCK.instanzen.splice(MOCK.instanzen.indexOf(i), 1);
      return ok({ ok:true });
    }
    if(method === "PATCH"){
      const ganz = (v) => Number.isInteger(v) && Math.abs(v) <= CONFIG.weltGrenze;
      if(!ganz(body.x) || !ganz(body.z) || (body.y != null && !ganz(body.y))) return fehler(400, "Ungültige Koordinaten");
      Object.assign(i, { x:body.x, y:body.y ?? null, z:body.z });
      return ok({ instanz:{ ...i } });
    }
  }

  if((m = path.match(/^\/welten\/([\w-]+)\/biome$/))){
    const welt = MOCK.welten.find((w) => w.id === m[1]);
    if(!welt) return fehler(404, "Welt nicht gefunden");
    if(method === "GET") return ok(structuredClone(MOCK.biome[welt.id] || { import:null, kacheln:[] }));
    if(method === "DELETE"){ delete MOCK.biome[welt.id]; return ok({ ok:true }); }
    if(method === "PUT"){
      const problem = biomImportPruefen(body, welt); if(problem) return fehler(422, problem);
      const sauber = biomImportSauber(body);
      const imp = { id:MOCK.neueId("bi"), weltId:welt.id, ...sauber.import, von:MOCK.ich, importiertAm:new Date().toISOString() };
      MOCK.biome[welt.id] = { import:imp, kacheln:sauber.kacheln };
      return ok({ import:structuredClone(imp) });
    }
  }

  if(method === "GET" && (m = path.match(/^\/sammelobjekte\/welten\/([\w-]+)$/))){
    if(!MOCK.welten.some((w) => w.id === m[1])) return fehler(404, "Welt nicht gefunden");
    return ok({ status:{ ...(MOCK.sammel[m[1]] || {}) } });
  }
  if(method === "PUT" && (m = path.match(/^\/sammelobjekte\/welten\/([\w-]+)\/([\w-]+)$/))){
    if(!SAMMELOBJEKTE.some((o) => o.id === m[2])) return fehler(404, "Unbekanntes Sammelobjekt");
    const status = (MOCK.sammel[m[1]] ||= {});
    if(body?.gefunden) status[m[2]] = { von:MOCK.ich, am:new Date().toISOString().slice(0, 10) };
    else delete status[m[2]];
    return ok({ status:{ ...status } });
  }

  if((m = path.match(/^\/portale\/welten\/([\w-]+)$/))){
    if(!MOCK.welten.some((w) => w.id === m[1])) return fehler(404, "Welt nicht gefunden");
    const liste = (MOCK.portale[m[1]] ||= []);
    if(method === "GET") return ok({ verbindungen:structuredClone(liste) });
    if(method === "POST"){
      const problem = verbindungRegelPruefen(body); if(problem) return fehler(422, problem);
      const neu = eintragId("p", Object.values(MOCK.portale).flat()); if(neu.fehler) return neu.fehler;
      const v = { id:neu.id, ...verbindungSauber(body), von:MOCK.ich, am:new Date().toISOString().slice(0, 10) };
      liste.push(v);
      return ok({ verbindung:structuredClone(v) }, 201);
    }
  }
  if((m = path.match(/^\/portale\/([\w-]+)$/))){
    const liste = Object.values(MOCK.portale).find((l) => l.some((v) => v.id === m[1]));
    const v = liste?.find((x) => x.id === m[1]);
    if(!v) return fehler(404, "Verbindung nicht gefunden");
    if(method === "DELETE"){ liste.splice(liste.indexOf(v), 1); return ok({ ok:true }); }
    if(method === "PUT"){
      const problem = verbindungRegelPruefen(body); if(problem) return fehler(422, problem);
      Object.assign(v, verbindungSauber(body));
      return ok({ verbindung:structuredClone(v) });
    }
  }

  if(path === "/banner"){
    if(method === "GET") return ok({ liste:MOCK.banner.map((b) => structuredClone(b)) });
    if(method === "POST"){
      const problem = bannerPruefen(body); if(problem) return fehler(422, problem);
      const neu = eintragId("b", MOCK.banner); if(neu.fehler) return neu.fehler;
      const b = { id:neu.id, ...bannerSauber(body), von:MOCK.ich, am:new Date().toISOString().slice(0, 10) };
      MOCK.banner.unshift(b);
      return ok({ banner:structuredClone(b) }, 201);
    }
  }
  if((m = path.match(/^\/banner\/([\w-]+)$/))){
    const b = MOCK.banner.find((x) => x.id === m[1]);
    if(!b) return fehler(404, "Banner nicht gefunden");
    if(method === "DELETE"){ MOCK.banner.splice(MOCK.banner.indexOf(b), 1); return ok({ ok:true }); }
    if(method === "PUT"){
      const problem = bannerPruefen(body); if(problem) return fehler(422, problem);
      Object.assign(b, bannerSauber(body));
      return ok({ banner:structuredClone(b) });
    }
  }

  if(path === "/ruestung"){
    if(method === "GET") return ok({ sets:MOCK.ruestung.map((x) => structuredClone(x)) });
    if(method === "POST"){
      const problem = ruestungPruefen(body); if(problem) return fehler(422, problem);
      const neu = eintragId("r", MOCK.ruestung); if(neu.fehler) return neu.fehler;
      const x = { id:neu.id, ...ruestungSauber(body), von:MOCK.ich, am:new Date().toISOString().slice(0, 10) };
      MOCK.ruestung.unshift(x);
      return ok({ set:structuredClone(x) }, 201);
    }
  }
  if((m = path.match(/^\/ruestung\/([\w-]+)$/))){
    const x = MOCK.ruestung.find((y) => y.id === m[1]);
    if(!x) return fehler(404, "Rüstungs-Set nicht gefunden");
    if(method === "DELETE"){ MOCK.ruestung.splice(MOCK.ruestung.indexOf(x), 1); return ok({ ok:true }); }
    if(method === "PUT"){
      const problem = ruestungPruefen(body); if(problem) return fehler(422, problem);
      Object.assign(x, ruestungSauber(body));
      return ok({ set:structuredClone(x) });
    }
  }

  if(method === "POST" && path === "/orte/auslesen"){
    const e = MOCK.auslesen[MOCK.ocr++ % MOCK.auslesen.length];
    return ok({ erkannt:e && !e.banner ? { ...e } : null, banner:e?.banner ? structuredClone(e.banner) : null });
  }
  return fehler(404, "Unbekannter Pfad");
}

function authHeaders(){
  const t = bd.verbindung?.token;
  return t ? { "Authorization":"Bearer " + t } : {};
}
async function api(path, opts){
  opts = opts || {};
  if(DEMO.enabled){
    // Texterkennung dauert real 1–3 s, alles andere ist schnell
    await new Promise((r) => setTimeout(r, path === "/orte/auslesen" ? 900 + Math.random()*700 : 80 + Math.random()*120));
    return mockApi(path, opts);
  }
  const json = opts.body != null && !(opts.body instanceof FormData);
  const headers = Object.assign(json ? { "Content-Type":"application/json" } : {}, authHeaders(), opts.headers || {});
  let res;
  try { res = await fetch(API_BASIS + path, Object.assign({}, opts, { headers })); }
  catch(e){ return { ok:false, status:0, data:{ error:"network", message:"Keine Verbindung" } }; }
  let data = null;
  try { data = await res.json(); } catch {}
  if(res.status === 401) anmeldungAbgelaufen();
  return { ok:res.ok, status:res.status, data };
}
const meldungAus = (r) => r?.data?.message || (r?.status === 0 ? "Keine Verbindung" : `Fehler ${r?.status}`);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
}
function lsLesen(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSchreiben(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }
async function kopieren(text){
  if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return; }
  // Im LAN ohne HTTPS gibt es keine Clipboard-API → klassischer Weg
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  const ok = document.execCommand("copy"); ta.remove();
  if(!ok) throw new Error("Kopieren nicht möglich");
}
/* Biom-Kachel ↔ Base64 (2048 Byte, Uint16 Little Endian) – wie kachelZuBase64/kachelAusBase64 in
   biom-dekoder.js; die Seite ist ein klassisches Script und braucht sie auch als Datei (Mock). */
function kachelAusText(text){
  const b = atob(text), daten = new Uint16Array(b.length >> 1);
  for(let i = 0; i < daten.length; i++) daten[i] = b.charCodeAt(i * 2) | (b.charCodeAt(i * 2 + 1) << 8);
  return daten;
}
function kachelZuText(daten){
  let b = "";
  for(const v of daten) b += String.fromCharCode(v & 255, v >> 8);
  return btoa(b);
}

function duplikat(dim, kategorie, x, z, ohneId){

      && Math.abs(i.x - x) <= CONFIG.duplikatRadius && Math.abs(i.z - z) <= CONFIG.duplikatRadius;
  }) || null;
}

/* Biome der aktuellen Welt aus dem Welt-Import (9h). Je Kachel die Werte, dazu lazy ein
   32 × 32-Bild (1 Pixel = 1 Chunk) und die Anzahl je Biom für die Legende. */
const bm = {
  weltId: null,
  import: null,
  kacheln: new Map(),   // "dim:kx:kz" → { dim, kx, kz, daten:Uint16Array, bild, zaehler }
  an: lsLesen("orte.biome") ?? true,   // Ebene auf der Karte ein/aus – nur auf diesem Gerät
};
const kachelSchluessel = (dim, kx, kz) => `${dim}:${kx}:${kz}`;
function biomeSetzen(weltId, imp, kacheln){
  bm.weltId = weltId; bm.import = imp;
  bm.kacheln = new Map(kacheln.map((k) => [kachelSchluessel(k.dim, k.kx, k.kz),
    { dim:k.dim, kx:k.kx, kz:k.kz, daten:k.daten instanceof Uint16Array ? k.daten : kachelAusText(k.daten), bild:null, zaehler:null }]));
}
/** Biom an einer Blockposition → BIOM_INFO-Eintrag, { unbekannt:id } oder null (unerkundet) */
function biomAnStelle(dim, x, z){
  const cx = Math.floor(x / 16), cz = Math.floor(z / 16), n = CONFIG.kachelChunks;
  const kx = Math.floor(cx / n), kz = Math.floor(cz / n);
  const k = bm.kacheln.get(kachelSchluessel(dim, kx, kz)); if(!k) return null;
  const wert = k.daten[(cz - kz * n) * n + (cx - kx * n)];
  return wert ? BIOM_INFO.get(wert - 1) || { unbekannt:wert - 1 } : null;
}
/** Bild und Zähler einer Kachel (einmal gebaut, bis neue Biome kommen) */
function kachelBild(k){
  if(k.bild) return k.bild;
  const n = CONFIG.kachelChunks, bild = document.createElement("canvas");
  bild.width = bild.height = n;
  const ctx = bild.getContext("2d"), pixel = ctx.createImageData(n, n);
  k.zaehler = new Map();
  k.daten.forEach((wert, i) => {
    const info = wert && BIOM_INFO.get(wert - 1); if(!info) return;   // unerkundet oder unbekannt: durchsichtig
    k.zaehler.set(info.name, (k.zaehler.get(info.name) || 0) + 1);
    const f = parseInt(info.farbe.slice(1), 16);
    pixel.data.set([f >> 16, (f >> 8) & 255, f & 255, 255], i * 4);
  });
  ctx.putImageData(pixel, 0, 0);
  return (k.bild = bild);
}
/** Ausdehnung der Biome einer Dimension in Blöcken → [minX, maxX, minZ, maxZ] oder null */
function biomGrenzen(dim){
  const g = CONFIG.kachelChunks * 16; let r = null;
  for(const k of bm.kacheln.values()) if(k.dim === dim){
    const [x0, z0] = [k.kx * g, k.kz * g];
    r = r ? [Math.min(r[0], x0), Math.max(r[1], x0 + g), Math.min(r[2], z0), Math.max(r[3], z0 + g)] : [x0, x0 + g, z0, z0 + g];
  }
  return r;
}

  }
  if(aktivesModul === "portale"){
    $sub.innerHTML = `Welt ${seed} · <b>${pt.liste.length} ${pt.liste.length === 1 ? "Verbindung" : "Verbindungen"}</b>`;
    return;
  }
  if(aktivesModul === "banner"){
    $sub.innerHTML = `<b>${bn.liste.length} ${bn.liste.length === 1 ? "Bauplan" : "Baupläne"}</b> · für alle Welten`;
    return;
  }
  if(aktivesModul === "ruestung"){
    // Sets gelten für alle Welten, „gefunden“ bezieht sich auf die aktuelle
    $sub.innerHTML = `<b>${rs.sets.length} ${rs.sets.length === 1 ? "Set" : "Sets"}</b> · Besätze aus Welt ${seed}`;
    return;
  }
  $sub.innerHTML = `Welt ${seed} · <b>${dimLabel(st.dim)}</b>`;
  $tabs.querySelectorAll(".tab").forEach((b) => {
    b.classList.toggle("active", b.dataset.dim === st.dim);
    b.querySelector(".zahl").textContent = anzahlIn(b.dataset.dim) || "";
  });
}

function renderHud(){
  const s = st.standort;
  if(!s){
    $hud.innerHTML = `<span class="chip leer" data-aktion="standort">${ZIEL} Standort setzen – sortiert nach Entfernung</span>`;
    return;
  }
  $hud.innerHTML = `<span class="chip" data-aktion="standort">${coordHtml(s.x, s.y, s.z)}</span>`
    + (umrechnen(s.x, s.z, s.dim) ? `<span class="chip portal-chip mono" data-aktion="standort">${portalHtml(s.x, s.z, s.dim, "").replace(/^<span class="">|<\/span>$/g, "")}</span>` : "")
    + (s.dim !== st.dim ? `<span class="chip portal-chip" data-aktion="standort">Du bist ${inDim(s.dim)}</span>` : "");
}

function renderFilter(){
  const dimId = dimIdVon(st.dim);
  const zaehler = new Map();
  for(const i of st.instanzen) if(i.dimensionId === dimId){
    const k = typVon(i)?.kategorie; if(k) zaehler.set(k, (zaehler.get(k) || 0) + 1);
  }
  if(st.filter && !zaehler.has(st.filter)) st.filter = null;
  const reihenfolge = [EIGENE_ORTE, ...FEATURE_KATEGORIEN[st.dim]].filter((k) => zaehler.has(k));
  $filter.hidden = reihenfolge.length < 2;
  $filter.innerHTML = `<button class="seg-btn ${st.filter ? "" : "active"}" data-filter="">Alle</button>`
    + reihenfolge.map((k) => `<button class="seg-btn ${st.filter === k ? "active" : ""}" data-filter="${esc(k)}">${esc(k)}<span class="zahl">${zaehler.get(k)}</span></button>`).join("");
}

function renderListe(){
  const eintraege = sichtbareInstanzen();
  if(!eintraege.length){
    const leer = anzahlIn(st.dim) === 0;
    $liste.innerHTML = `<div class="module-empty" style="padding:40px 12px">
      <div class="me-ico">${ZIEL}</div>
      <div class="me-title">${leer ? `${inDim(st.dim).replace(/^i/, "I")} ist noch nichts erfasst` : "Nichts gefunden"}</div>
      <div class="me-sub">${leer ? "Screenshot vom Seed-Map-Popup machen und unten auf „Screenshot“ tippen." : "Suche oder Filter anpassen."}</div>
    </div>`;
    return;
  }
  // Gruppieren: Kategorie → Variante → Instanzen (Datenmodell-Hierarchie)
  const gruppen = new Map();
  for(const e of eintraege){
    if(!gruppen.has(e.t.kategorie)) gruppen.set(e.t.kategorie, new Map());
    const g = gruppen.get(e.t.kategorie);
    const v = e.t.variante || "";
    if(!g.has(v)) g.set(v, []);
    g.get(v).push(e);
  }
  const reihenfolge = [EIGENE_ORTE, ...FEATURE_KATEGORIEN[st.dim]].filter((k) => gruppen.has(k));
  const weg = (i) => entfernung(st.standort, i.x, i.z, st.dim);
  const sortieren = (a, b) => {
    const wa = weg(a.i), wb = weg(b.i);
    if(wa && wb) return wa.meter - wb.meter;
    return st.instanzen.indexOf(b.i) - st.instanzen.indexOf(a.i);   // neueste zuerst
  };

  $liste.innerHTML = reihenfolge.map((kat) => {
    const g = gruppen.get(kat);
    const summe = [...g.values()].reduce((n, l) => n + l.length, 0);
    const offen = !st.zu.has(`${st.dim}:${kat}`);
    const varianten = [...g.keys()].sort((a, b) => (a === "" ? -1 : b === "" ? 1 : a.localeCompare(b, "de")));
    const items = varianten.map((v) => {
      const zeilen = g.get(v).sort(sortieren).map(({ i }) => {
        const w = weg(i);
        return `<button class="ort-zeile" data-id="${i.id}">
          ${coordHtml(i.x, i.y, i.z)}
          ${portalHtml(i.x, i.z, st.dim, "ort-portal mono")}
          <span class="ort-weg">${w ? `<b>${entfernungText(w.meter)}</b><span>${w.richtung}${w.umgerechnet ? " ⟷" : ""}</span>` : ""}</span>
        </button>`;
      }).join("");
      return (v ? `<div class="ort-typ">${esc(v)}</div>` : "") + zeilen;
    }).join("");
    return `<div class="ort-kat ${offen ? "open" : ""}" data-kat="${esc(kat)}">
      <div class="ort-kat-head">
        <span class="ort-kat-icon">${kennblockHtml(kat)}</span>
        <span class="ort-kat-name">${esc(kat)}</span>
        <span class="ort-kat-count">${summe}</span>
        <span class="ort-kat-chevron">${CHEVRON}</span>
      </div>
      <div class="ort-kat-items">${items}</div>
    </div>`;
  }).join("");
}

function render(){
  renderKopf();
  if(aktivesModul === "sammelobjekte"){ renderSammel(); return; }
  if(aktivesModul === "banner"){ renderBanner(); return; }
  if(aktivesModul === "ruestung"){ renderRuestung(); return; }
  if(aktivesModul === "portale"){ renderPortale(); return; }
  if(st.ansicht === "liste"){ renderHud(); renderFilter(); renderListe(); }
  else karte.zeichnen();
  renderStatus();
}

/* ============================================================================
   8 · KARTE  ·  Canvas; Biome nur rund um bekannte Punkte, Rest bleibt leer
   ========================================================================== */
const karte = (() => {
  const canvas = document.getElementById("ortKarte");
  const ctx = canvas.getContext("2d");
  const $hinweis = document.getElementById("karteHinweis");
  const $legende = document.getElementById("karteLegende");
  const sicht = { cx:0, cz:0, zoom:0.25 };   // Mittelpunkt in Blöcken, Pixel pro Block
  const zeiger = new Map();
  let ziehen = null, pinch = null, bewegt = false, angepasst = null, dpr = 1;
  let marker = [];   // für Tap-Erkennung

  function groesse(){
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  }
  const var_ = (n) => getComputedStyle($device).getPropertyValue(n).trim();
  const zuBild = (x, z) => [(x - sicht.cx) * sicht.zoom + canvas.width / dpr / 2, (z - sicht.cz) * sicht.zoom + canvas.height / dpr / 2];
  const zuWelt = (px, py) => [(px - canvas.width / dpr / 2) / sicht.zoom + sicht.cx, (py - canvas.height / dpr / 2) / sicht.zoom + sicht.cz];

  /** Ausschnitt so wählen, dass alle Orte der Dimension (plus Standort) passen */
  function alles(){
    const punkte = sichtbareInstanzen().map(({ i }) => [i.x, i.z]);
    if(st.standort){
      const s = st.standort.dim === st.dim ? st.standort : null;
      const u = !s && umrechnen(st.standort.x, st.standort.z, st.standort.dim);
      if(s) punkte.push([s.x, s.z]); else if(u && u.dim === st.dim) punkte.push([u.x, u.z]);
    }
    // ohne Orte: die importierten Biome der Dimension
    const g = !punkte.length && bm.weltId === st.weltId ? biomGrenzen(st.dim) : null;
    if(g) punkte.push([g[0], g[2]], [g[1], g[3]]);
    if(!punkte.length){ Object.assign(sicht, { cx:0, cz:0, zoom:0.25 }); return; }
    const xs = punkte.map((p) => p[0]), zs = punkte.map((p) => p[1]);
    const [minX, maxX, minZ, maxZ] = [Math.min(...xs), Math.max(...xs), Math.min(...zs), Math.max(...zs)];
    const w = canvas.width / dpr, h = canvas.height / dpr;
    sicht.cx = (minX + maxX) / 2; sicht.cz = (minZ + maxZ) / 2;
    const noetig = Math.min((w - 90) / Math.max(1, maxX - minX + 96), (h - 120) / Math.max(1, maxZ - minZ + 96));
    sicht.zoom = Math.max(CONFIG.zoomMin, Math.min(1, noetig));
  }

  /** Rasterweite passend zum Zoom: 16 (Chunk), 128, 1024 … Blöcke */
  function rasterweite(){
    for(const s of [16, 64, 128, 512, 1024, 4096, 16384]) if(s * sicht.zoom >= 38) return s;
    return 65536;
  }

  function zeichnen(){
    if(st.ansicht !== "karte") return;
    if(angepasst !== `${st.welt?.id}:${st.dim}`){ groesse(); alles(); angepasst = `${st.welt?.id}:${st.dim}`; }
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = var_("--bg"); ctx.fillRect(0, 0, w, h);
    const [x0, z0] = zuWelt(0, 0), [x1, z1] = zuWelt(w, h);

    // 1) Biome aus dem Welt-Import: je Kachel ein 32 × 32-Bild, unerkundete Fläche bleibt leer
    const legende = new Map();
    if(bm.an && bm.weltId === st.weltId && bm.kacheln.size){
      const g = CONFIG.kachelChunks * 16;
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = .82;
      for(let kx = Math.floor(x0 / g); kx * g <= x1; kx++) for(let kz = Math.floor(z0 / g); kz * g <= z1; kz++){
        const k = bm.kacheln.get(kachelSchluessel(st.dim, kx, kz)); if(!k) continue;
        const [px, py] = zuBild(kx * g, kz * g);
        // auf ganze Pixel runden, sonst bleiben Fugen zwischen den Kacheln
        ctx.drawImage(kachelBild(k), Math.floor(px), Math.floor(py), Math.ceil(px + g * sicht.zoom) - Math.floor(px), Math.ceil(py + g * sicht.zoom) - Math.floor(py));
        for(const [name, n] of k.zaehler) legende.set(name, (legende.get(name) || 0) + n);
      }
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
    }

    // Raster (unbekannte Fläche bleibt genau so: leer)
    const r = rasterweite();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    ctx.beginPath();
    for(let x = Math.floor(x0 / r) * r; x <= x1; x += r){ const [px] = zuBild(x, 0); ctx.moveTo(Math.round(px) + .5, 0); ctx.lineTo(Math.round(px) + .5, h); }
    for(let z = Math.floor(z0 / r) * r; z <= z1; z += r){ const [, py] = zuBild(0, z); ctx.moveTo(0, Math.round(py) + .5); ctx.lineTo(w, Math.round(py) + .5); }
    ctx.stroke();
    // Achsen X=0 / Z=0
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.beginPath();
    const [ax, az] = zuBild(0, 0);
    ctx.moveTo(Math.round(ax) + .5, 0); ctx.lineTo(Math.round(ax) + .5, h);
    ctx.moveTo(0, Math.round(az) + .5); ctx.lineTo(w, Math.round(az) + .5);
    ctx.stroke();

    const eintraege = sichtbareInstanzen();
    marker = [];
    const belegt = [];   // bereits gezeichnete Beschriftungen – keine Überlappung
    const frei = (x, y, w, h) => {
      if(belegt.some((r) => x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y)) return false;
      belegt.push({ x, y, w, h }); return true;
    };

    // 2) Features + eigene Orte als Marker (Stil wie drawStructure in Modul A)
    const akzent = var_("--accent");
    const punkte = eintraege.slice()
      .sort((a, b) => (a.t.kategorie === EIGENE_ORTE) - (b.t.kategorie === EIGENE_ORTE));
    for(const { i, t } of punkte){
      const [px, py] = zuBild(i.x, i.z);
      if(px < -20 || py < -20 || px > w + 20 || py > h + 20) continue;
      const eigen = t.kategorie === EIGENE_ORTE;
      const bild = kennblockBild(t.kategorie), r = bild ? 14 : 11;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
      // heller Grund unter dem Kennblock, sonst gehen dunkle Blöcke (Netherziegel, Sculk) unter
      ctx.fillStyle = eigen ? akzent : bild ? "rgba(214,222,230,.34)" : "rgba(0,0,0,.6)"; ctx.fill();
      ctx.strokeStyle = akzent; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if(bild){
        // Kennblock eingepasst (hohe Bilder wie das Banner bleiben schmal)
        const f = 19 / Math.max(bild.naturalWidth, bild.naturalHeight);
        const bw = bild.naturalWidth * f, bh = bild.naturalHeight * f;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(bild, px - bw / 2, py - bh / 2, bw, bh);
      } else {
        ctx.fillStyle = eigen ? var_("--accent-ink") : akzent;
        ctx.font = "700 12px ui-monospace, monospace";
        ctx.fillText(symbol(t.kategorie), px, py + 1);
      }
      if(sicht.zoom >= 0.12 || eigen){
        const text = t.variante || t.kategorie;
        ctx.font = "600 11px -apple-system, system-ui, sans-serif";
        const tw = ctx.measureText(text).width, ty = py + r + 3;
        if(frei(px - tw / 2 - 5, ty, tw + 10, 17)){
          ctx.fillStyle = "rgba(0,0,0,.55)";
          ctx.fillRect(px - tw / 2 - 5, ty, tw + 10, 17);
          ctx.fillStyle = "#fff"; ctx.fillText(text, px, ty + 9);
        }
      }
      marker.push({ id:i.id, px, py, r:16 });
    }

    // 3) Eigener Standort
    if(st.standort){
      let s = st.standort.dim === st.dim ? st.standort : null;
      if(!s){ const u = umrechnen(st.standort.x, st.standort.z, st.standort.dim); if(u && u.dim === st.dim) s = u; }
      if(s){
        const [px, py] = zuBild(s.x, s.z);
        ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.strokeStyle = akzent; ctx.globalAlpha = .45; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fillStyle = akzent; ctx.fill();
        ctx.font = "700 11px ui-monospace, monospace"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
        ctx.fillText("Du", px, py - 24);
      }
    }

    // Hinweis + Legende (häufigste Biome im Ausschnitt), darüber ggf. das angetippte Biom
    const imp = bm.weltId === st.weltId ? bm.import : null;
    $hinweis.innerHTML = `<span class="chip mono">${rasterweite()} Blöcke · ${imp
      ? `Biome ${datumKurz(imp.importiertAm)} · ${zahl(imp.chunks?.[st.dim] || 0)} Chunks${bm.an ? "" : " · aus"}` : "keine Biome – Welt-Import"}</span>`;
    biomKnopfZeigen();
    const farbe = (name) => [...BIOM_INFO.values()].find((b) => b.name === name)?.farbe;
    $legende.innerHTML = (tipp ? `<span class="chip tipp mono">${esc(tipp)}</span>` : "")
      + [...legende].sort((a, b) => b[1] - a[1]).slice(0, 4)
        .map(([n]) => `<span class="chip"><i style="background:${farbe(n)}"></i>${esc(n)}</span>`).join("");
  }
  let tipp = null;   // „X · Z · Biom“ der zuletzt angetippten Stelle, bis die Karte bewegt wird

  function zoomen(faktor, px, py){
    const w = canvas.width / dpr, h = canvas.height / dpr;
    px = px ?? w / 2; py = py ?? h / 2;
    const [wx, wz] = zuWelt(px, py);
    sicht.zoom = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, sicht.zoom * faktor));
    tipp = null;
    // Punkt unter dem Finger bleibt stehen
    sicht.cx = wx - (px - w / 2) / sicht.zoom;
    sicht.cz = wz - (py - h / 2) / sicht.zoom;
    zeichnen();
  }

  const lokal = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    zeiger.set(e.pointerId, lokal(e));
    bewegt = false;
    if(zeiger.size === 1){ const [px, py] = lokal(e); ziehen = { px, py, cx:sicht.cx, cz:sicht.cz }; }
    if(zeiger.size === 2){
      const [a, b] = [...zeiger.values()];
      pinch = { abstand:Math.hypot(a[0] - b[0], a[1] - b[1]), zoom:sicht.zoom };
      ziehen = null;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    if(!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, lokal(e));
    if(pinch && zeiger.size === 2){
      const [a, b] = [...zeiger.values()];
      const faktor = Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.abstand;
      const ziel = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, pinch.zoom * faktor));
      zoomen(ziel / sicht.zoom, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      bewegt = true;
      return;
    }
    if(ziehen){
      const [px, py] = lokal(e);
      if(Math.hypot(px - ziehen.px, py - ziehen.py) > 5){ bewegt = true; tipp = null; }
      sicht.cx = ziehen.cx - (px - ziehen.px) / sicht.zoom;
      sicht.cz = ziehen.cz - (py - ziehen.py) / sicht.zoom;
      zeichnen();
    }
  });
  const loslassen = (e) => {
    const [px, py] = lokal(e);
    zeiger.delete(e.pointerId);
    if(zeiger.size < 2) pinch = null;
    if(zeiger.size === 0){
      if(!bewegt){
        // Tap: zuerst ein Marker (zuletzt gezeichnet = oben), sonst das Biom an dieser Stelle
        const treffer = marker.slice().reverse().find((m) => Math.hypot(m.px - px, m.py - py) <= m.r);
        if(treffer) detailOeffnen(treffer.id);
        else if(bm.an && bm.weltId === st.weltId && bm.import){
          const [x, z] = zuWelt(px, py).map(Math.floor);
          const b = biomAnStelle(st.dim, x, z);
          tipp = `X ${zahl(x)} · Z ${zahl(z)} · ${b ? b.name || `Biom-ID ${b.unbekannt} (unbekannt)` : "unerkundet"}`;
          zeichnen();
        }
      }
      ziehen = null;
    }
  };
  canvas.addEventListener("pointerup", loslassen);
  canvas.addEventListener("pointercancel", (e) => { zeiger.delete(e.pointerId); ziehen = null; pinch = null; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); const [px, py] = lokal(e); zoomen(e.deltaY < 0 ? 1.15 : 1 / 1.15, px, py); }, { passive:false });
  document.getElementById("karteZoomIn").addEventListener("click", () => zoomen(1.6));
  document.getElementById("karteZoomOut").addEventListener("click", () => zoomen(1 / 1.6));
  document.getElementById("karteFit").addEventListener("click", () => { alles(); zeichnen(); });
  document.getElementById("karteBiome").addEventListener("click", () => {
    bm.an = !bm.an; lsSchreiben("orte.biome", bm.an); tipp = null;
    biomKnopfZeigen(); zeichnen();
  });
  window.addEventListener("resize", () => { if(st.ansicht === "karte"){ groesse(); zeichnen(); } });

  /** Auf einen Punkt springen (z. B. aus den Sammelobjekten) */
  function zentrieren(x, z){
    groesse();
    const zoom = Math.max(sicht.zoom, 0.6);
    // Punkt ins obere Drittel legen – unten öffnet sich das Detail-Sheet
    Object.assign(sicht, { cx:x, cz:z + (canvas.height / dpr) * 0.22 / zoom, zoom });
    angepasst = `${st.welt?.id}:${st.dim}`;
    zeichnen();
  }
  return { zeichnen, zentrieren, neuAnpassen(){ angepasst = null; } };
})();

/* ============================================================================
   9 · SHEETS  ·  Detail, Eintragen, Screenshot-Prüfliste, Welt, Standort
   ========================================================================== */
const $sheet = document.getElementById("orteSheet");
const $sheetInhalt = document.getElementById("orteSheetInhalt");
const $scrim = document.getElementById("scrim");
const $sidebar = document.getElementById("sidebar");
const X_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

function sheetOeffnen(art, html, dim){
  boardScanStoppen();
  st.sheet = art;
  $sheetInhalt.innerHTML = html;
  // Sheet in der Farbe „seiner“ Dimension (z. B. Detail eines Nether-Orts)
  themaSetzen($sheet, dim || st.dim);
  $sheet.scrollTop = 0;
  $sheet.classList.add("open");
  $scrim.classList.add("show");
}
function alleSchliessen(){
  boardScanStoppen();
  st.sheet = null;
  $sheet.classList.remove("open");
  $sidebar.classList.remove("open");
  $scrim.classList.remove("show");
}
const kopfHtml = (titel, sub, bild) => `<div class="sheet-kopf">${bild ? `<span class="sheet-kopf-bild">${bild}</span>` : ""}<div class="titel"><h2>${titel}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
  <button class="icon-btn" data-aktion="schliessen" aria-label="Schließen">${X_ICON}</button></div>`;

function koordFelder(prefix, x, y, z){
  const feld = (achse, wert, optional) => `<label class="field"><span class="field-label">${achse}</span>
    <span class="koord-in"><input type="text" inputmode="numeric" autocomplete="off" data-koord="${prefix}${achse}"
      value="${wert ?? ""}" placeholder="${optional ? "—" : "0"}" aria-label="${achse}-Koordinate">
    <button type="button" class="vz" data-vz="${prefix}${achse}" aria-label="Vorzeichen ${achse}">±</button></span></label>`;
  return `<div class="field-grid g3">${feld("X", x)}${feld("Y", y, true)}${feld("Z", z)}</div>`;
}
function koordLesen(prefix){
  const lies = (a) => {
    const v = $sheet.querySelector(`[data-koord="${prefix}${a}"]`)?.value.trim() ?? "";
    if(v === "" || v === "-") return null;
    const n = Number(v); return Number.isInteger(n) ? n : NaN;
  };
  return { x:lies("X"), y:lies("Y"), z:lies("Z") };
}

async function formularSpeichern(){
  const $b = document.getElementById("formBanner");
  const k = koordLesen("f");
  const eigen = form.kategorie === EIGENE_ORTE;
  const variante = eigen ? (form.variante === "__neu__" ? (document.getElementById("formNeu")?.value || "").trim() : form.variante) : (form.variante || null);
  if(!koordGueltig(k)) return banner($b, "bad", "Bitte X und Z als ganze Zahlen eintragen.");
  if(eigen && !variante) return banner($b, "bad", "Wie heißt der Ort?");
  const d = duplikat(form.dim, form.kategorie, k.x, k.z);
  if(d && !$b.dataset.trotzdem){
    $b.dataset.trotzdem = "1";
    return banner($b, "warn", `Hier gibt es schon „${typLabel(typVon(d))}“. Nochmal tippen, um trotzdem zu speichern.`);
  }
  const r = await api("/orte/instanzen", { method:"POST", body:JSON.stringify({ id:neueEintragId(),
    dimensionId:dimIdVon(form.dim), kategorie:form.kategorie, variante, x:k.x, y:k.y, z:k.z, quelle:"manuell" }) });
  if(!r.ok) return banner($b, "bad", meldungAus(r));
  uebernehmen(r.data);
  alleSchliessen();
  if(st.dim !== form.dim) dimWechseln(form.dim);
  toast(`„${variante || form.kategorie}“ gespeichert`);
  render();
}

let importLaeuft = false;
function importStarten(dateien){
  for(const datei of dateien){
    st.importe.push({ id:Math.random().toString(36).slice(2), url:URL.createObjectURL(datei), datei,
      status:"wartet", erkannt:null, dim:"overworld", x:"", y:"", z:"", an:false, meldungen:[] });
  }
  importRendern();
  importAbarbeiten();
}
async function importAbarbeiten(){
  if(importLaeuft) return;
  importLaeuft = true;
  let e;
  while((e = st.importe.find((x) => x.status === "wartet"))){
    e.status = "lese"; importRendern();
    const fd = new FormData(); fd.append("datei", e.datei);
    const r = await api("/orte/auslesen", { method:"POST", body:fd });
    if(!r.ok){ e.status = "fehler"; e.meldungen = [["bad", meldungAus(r)]]; importRendern(); continue; }
    const k = r.data?.erkannt;
    if(!k && r.data?.banner){ await bannerImport(e, r.data.banner); importRendern(); continue; }
    if(!k){ e.status = "leer"; e.meldungen = [["warn", "Weder ein Seed-Map-Popup noch eine Banner-Anleitung gefunden – ist das Popup aufgeklappt?"]]; importRendern(); continue; }
    if(k.kategorie === BIOMES){
      // Biome kommen nur aus dem Welt-Import – die Karte bleibt ausgegraut stehen
      Object.assign(e, { status:"biom", erkannt:k, dim:k.dimension, an:false, meldungen:[["info", "Biome kommen aus dem Welt-Import"]] });
      importRendern(); continue;
    }
    Object.assign(e, { status:"fertig", erkannt:k, dim:k.dimension, x:String(k.x), y:k.y != null ? String(k.y) : "", z:String(k.z), an:true, meldungen:[] });
    if(!FEATURE_KATEGORIEN[e.dim].includes(k.kategorie)){
      e.an = false; e.meldungen.push(["bad", `„${k.kategorie}“ gibt es ${inDim(e.dim)} nicht`]);
    }
    const d = duplikat(e.dim, k.kategorie, k.x, k.z);
    const imStapel = st.importe.find((o) => o !== e && o.status === "fertig" && o.dim === e.dim && o.erkannt.kategorie === k.kategorie
      && Math.abs(Number(o.x) - k.x) <= CONFIG.duplikatRadius && Math.abs(Number(o.z) - k.z) <= CONFIG.duplikatRadius);
    if(d){ e.an = false; e.meldungen.push(["warn", `Schon erfasst als „${typLabel(typVon(d))}“`]); }
    else if(imStapel){ e.an = false; e.meldungen.push(["warn", "Doppelt in dieser Auswahl"]); }
    importRendern();
  }
  importLaeuft = false;
}
/** Banner aus einer Anleitung (Screenshot) in die Prüfliste: Name vorschlagen, Regeln und Duplikate prüfen */
const bannerSchluessel = (b) => JSON.stringify([b.basis, b.ebenen.map(({ muster, farbe }) => [muster, farbe])]);
async function bannerImport(e, b){
  if(!bn.liste.length) await bannerLaden();   // für den Duplikat-Vergleich
  const vergeben = new Set([...bn.liste.map((x) => x.name), ...st.importe.filter((o) => o.banner).map((o) => o.name)]);
  let name = `Banner vom ${datumKurz(new Date().toISOString())}`;
  for(let n = 2; vergeben.has(name); n++) name = `Banner vom ${datumKurz(new Date().toISOString())} (${n})`;
  Object.assign(e, { status:"fertig", banner:{ basis:b.basis, ebenen:b.ebenen }, name, an:true, meldungen:[] });
  const problem = b.basis ? bannerPruefen({ name, ...e.banner }) : "Grundfarbe nicht erkannt (Schritt 1 „… Base“) – Screenshot mit der ganzen Liste nehmen.";
  if(problem){ e.an = false; e.meldungen.push(["bad", problem]); }
  if(b.unklar?.length) e.meldungen.push(["warn", `Nicht zugeordnet: ${b.unklar.join(" · ")} – nach dem Speichern im Editor prüfen.`]);
  if(!b.basis) return;
  const gleich = bn.liste.find((x) => bannerSchluessel(x) === bannerSchluessel(e.banner));
  const imStapel = st.importe.find((o) => o !== e && o.banner && o.status === "fertig" && bannerSchluessel(o.banner) === bannerSchluessel(e.banner));
  if(gleich){ e.an = false; e.meldungen.push(["warn", `Schon gespeichert als „${gleich.name}“`]); }
  else if(imStapel){ e.an = false; e.meldungen.push(["warn", "Doppelt in dieser Auswahl"]); }
}

function importFelderLesen(){
  for(const e of st.importe){
    if(e.status !== "fertig" || !e.an) continue;
    if(e.banner){
      const $n = $sheet.querySelector(`[data-import-name="${e.id}"]`);
      if($n) e.name = $n.value.trim();
      continue;
    }
    // Karte war vorher noch „Lese …“ → es gibt noch keine Felder, erkannte Werte behalten
    if(!$sheet.querySelector(`[data-koord="i${e.id}X"]`)) continue;
    const k = koordLesen(`i${e.id}`);
    e.x = k.x == null ? "" : String(k.x); e.y = k.y == null ? "" : String(k.y); e.z = k.z == null ? "" : String(k.z);
  }
}
function importRendern(){
  if(st.sheet && st.sheet !== "import") return;
  const scroll = $sheet.scrollTop;
  if(st.sheet === "import") importFelderLesen();
  const laufend = st.importe.some((e) => e.status === "wartet" || e.status === "lese");
  const auswahl = st.importe.filter((e) => e.status === "fertig" && e.an).length;
  const erkannt = st.importe.filter((e) => e.erkannt || e.banner).length;
  const karten = st.importe.map((e) => {
    if(e.banner) return importBannerKarte(e);
    const k = e.erkannt;
    const biom = e.status === "biom";
    const titel = e.status === "wartet" ? "Wartet …"
      : e.status === "lese" ? '<span class="dreher"></span>Lese Text …'
      : e.status === "gespeichert" ? `${esc(k.titel)} ✓`
      : k ? `<span class="imp-kennblock">${kennblockHtml(k.kategorie)}</span>${esc(k.variante ? `${k.kategorie} · ${k.variante}` : k.kategorie)}`
      : "Nicht erkannt";
    const meta = k ? `<span class="pill">${dimLabel(e.dim)}</span>${biom ? '<span class="pill">Biom</span>' : ""}` : "";
    const bearbeitbar = e.status === "fertig";
    return `<div class="card ${(bearbeitbar && !e.an) || biom ? "aus" : ""}" data-import="${e.id}">
      <div class="imp-kopf">
        <img src="${e.url}" alt="">
        <div class="text"><div class="card-title">${titel}</div><div class="card-meta">${meta}</div></div>
        ${bearbeitbar ? `<button class="switch ${e.an ? "on" : ""}" data-aktion="import-an" data-id="${e.id}" role="switch" aria-checked="${e.an}" aria-label="Übernehmen"></button>` : ""}
      </div>
      ${e.meldungen.map(([art, text]) => `<div class="banner ${art}">${esc(text)}</div>`).join("")}
      ${bearbeitbar && e.an ? `
        <div class="tool-segment">${DIM_ORDER.map((d) => `<button class="seg-btn ${e.dim === d ? "active" : ""}" data-import-dim="${d}" data-id="${e.id}">${dimLabel(d)}</button>`).join("")}</div>
        ${koordFelder(`i${e.id}`, e.x, e.y, e.z)}` : ""}
    </div>`;
  }).join("");
  const html = kopfHtml(st.importe.length === 1 ? "Screenshot auslesen" : `${st.importe.length} Screenshots auslesen`,
    laufend ? "Texterkennung läuft …" : `${erkannt} von ${st.importe.length} erkannt`) + `<div class="orte-inhalt">
    ${karten}
    <div class="sheet-fuss">
      <button class="btn-secondary" data-aktion="import-mehr" aria-label="Weitere Screenshots">+ Mehr</button>
      <button class="btn-primary" data-aktion="import-speichern" ${auswahl ? "" : "disabled"}>${laufend && !auswahl ? "Lese …" : importKnopfText()}</button>
    </div>
  </div>`;
  sheetOeffnen("import", html);
  $sheet.scrollTop = scroll;
}
/** „1 Ort speichern“, „2 Orte + 1 Banner speichern“ … */
function importKnopfText(){
  const aus = st.importe.filter((e) => e.status === "fertig" && e.an);
  const orte = aus.filter((e) => !e.banner).length, banner = aus.length - orte;
  const teile = [orte ? `${orte} ${orte === 1 ? "Ort" : "Orte"}` : "", banner ? `${banner} Banner` : ""].filter(Boolean);
  return `${teile.join(" + ") || "0 Orte"} speichern`;
}
function importBannerKarte(e){
  const b = e.banner, bearbeitbar = e.status === "fertig";
  const titel = e.status === "gespeichert" ? `${esc(e.name)} ✓` : `Banner · ${b.ebenen.length} Muster`;
  const schritte = [b.basis ? `Grundfarbe ${farbe(b.basis).de}` : "Grundfarbe ?", ...b.ebenen.map((x) => `${muster(x.muster).de} (${farbe(x.farbe).de})`)];
  return `<div class="card ${bearbeitbar && !e.an ? "aus" : ""}" data-import="${e.id}">
    <div class="imp-kopf">
      <img src="${e.url}" alt="">
      <div class="text"><div class="card-title">${titel}</div><div class="card-meta"><span class="pill">Banner</span><span class="pill">alle Welten</span></div></div>
      ${bearbeitbar ? `<button class="switch ${e.an ? "on" : ""}" data-aktion="import-an" data-id="${e.id}" role="switch" aria-checked="${e.an}" aria-label="Übernehmen"></button>` : ""}
    </div>
    ${e.meldungen.map(([art, text]) => `<div class="banner ${art}">${esc(text)}</div>`).join("")}
    ${b.basis ? `<div class="imp-banner">
      <span class="banner-rahmen">${bannerImg(b, "", "Vorschau")}</span>
      <ol class="imp-schritte">${schritte.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>
    </div>` : ""}
    ${bearbeitbar && e.an ? `<label class="field"><span class="field-label">Name</span>
      <input class="orte-eingabe" data-import-name="${e.id}" maxlength="60" autocomplete="off" value="${esc(e.name)}"></label>` : ""}
  </div>`;
}
async function importSpeichern(){
  importFelderLesen();
  const auswahl = st.importe.filter((e) => e.status === "fertig" && e.an);
  let gespeichert = 0; const dims = new Set();
  for(const e of auswahl){
    if(e.banner){
      const neu = { name:e.name, ...e.banner };
      const problem = bannerPruefen(neu);
      if(problem){ e.meldungen = [["bad", problem]]; continue; }
      const r = await api("/banner", { method:"POST", body:JSON.stringify({ id:neueEintragId(), ...bannerSauber(neu) }) });
      if(r.ok){
        if(!bn.liste.some((x) => x.id === r.data.banner.id)) bn.liste.unshift(r.data.banner);
        e.status = "gespeichert"; e.meldungen = []; gespeichert++;
      } else e.meldungen = [["bad", meldungAus(r)]];
      continue;
    }
    const x = Number(e.x), z = Number(e.z), y = e.y === "" ? null : Number(e.y);
    if(!Number.isInteger(x) || !Number.isInteger(z) || (y !== null && !Number.isInteger(y))){
      e.meldungen = [["bad", "Koordinaten prüfen"]]; continue;
    }
    const r = await api("/orte/instanzen", { method:"POST", body:JSON.stringify({ id:neueEintragId(),
      dimensionId:dimIdVon(e.dim), kategorie:e.erkannt.kategorie, variante:e.erkannt.variante, x, y, z, quelle:"screenshot" }) });
    if(r.ok){ uebernehmen(r.data); e.status = "gespeichert"; e.meldungen = []; gespeichert++; dims.add(e.dim); }
    else e.meldungen = [["bad", meldungAus(r)]];
  }
  if(gespeichert === auswahl.length){
    const banner = auswahl.filter((e) => e.banner).length, orte = gespeichert - banner;
    st.importe.forEach((e) => URL.revokeObjectURL(e.url));
    st.importe = [];
    alleSchliessen();
    if(orte && dims.size === 1 && aktivesModul === "karte") dimWechseln([...dims][0]);
    karte.neuAnpassen();
    toast(`${[orte ? `${orte} ${orte === 1 ? "Ort" : "Orte"}` : "", banner ? `${banner} Banner` : ""].filter(Boolean).join(" + ")} gespeichert`);
    render();
  } else {
    render(); importRendern();
    toast(`${auswahl.length - gespeichert} nicht gespeichert`, true);
  }
}

const $toast = document.getElementById("orteToast");

/* ============================================================================
   9b · BEREICHE  ·  Registry für Sidebar (und später Dashboard-Widgets)

   eigenes Rendering. Modul-Vertrag:
     { key, titel, icon, mount(el), unmount() }

   companion/widgets (widget-register.ts, Bereichs-IDs wie diese keys); ihre

   Portal-Verwaltung, Handbuch, Baupläne, Banner, Rüstung.

   erscheint ein Bereich in der Sidebar als „geplant“.

const ICON = Object.freeze({

  bauplaene:'<path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18M14 14h4v4h-4z"/>',
  banner:'<path d="M4 3h16"/><path d="M6 3v17l6-3 6 3V3"/><path d="M9 8h6M9 12h6"/>',

});
const BEREICHE = [
  { key:"karte",         titel:"Karte",
    mount:() => { applyTheme(st.dim); karte.neuAnpassen(); render(); },
    unmount:() => alleSchliessen() },
  { key:"sammelobjekte", titel:"Sammelobjekte",       // Rüstungs-Modifikationen abhaken + Fundorte
    mount:() => { applyTheme("overworld"); render(); samLaden(); },
    unmount:() => alleSchliessen() },
  { key:"portale",       titel:"Portal-Verwaltung",   // Umrechnen, Verbindungen erfassen + prüfen
    mount:() => { applyTheme("nether"); render(); portaleLaden(); },

    unmount:() => alleSchliessen() },
];
let aktivesModul = "karte";
function modulWechseln(key){
  const bereich = BEREICHE.find((b) => b.key === key);
  alleSchliessen();
  if(!bereich?.mount){ toast(`„${bereich?.titel}“ ist geplant`); return; }
  if(key === aktivesModul) return;
  BEREICHE.find((b) => b.key === aktivesModul)?.unmount?.();
  aktivesModul = key;
  document.querySelectorAll(".module").forEach((el) => el.classList.toggle("is-active", el.dataset.module === key));
  document.getElementById("kopfTitel").textContent = bereich.titel;
  document.getElementById("kopfIcon").innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[key]}</svg>`;
  sidebarBauen(key);
  bereich.mount();
}

/** Bekannte Instanzen einer Fundort-Kategorie in der aktuellen Welt – nächste zuerst */
function bekannteFundorte(kategorie, dim){
  const dimId = dimIdVon(dim);
  return st.instanzen
    .filter((i) => i.dimensionId === dimId && typVon(i)?.kategorie === kategorie)
    .map((i) => ({ i, w:entfernung(st.standort, i.x, i.z, dim) }))
    .sort((a, b) => (a.w && b.w) ? a.w.meter - b.w.meter : 0);
}

async function samLaden(){
  if(!st.weltId) return;
  const r = await api(`/sammelobjekte/welten/${st.weltId}`);
  if(!r.ok){ toast(meldungAus(r), true); return; }
  sam.status = r.data.status || {};
  sam.weltId = st.weltId;
  if(aktivesModul === "sammelobjekte" || aktivesModul === "ruestung") render();

/* ============================================================================
   9d · BANNER  ·  Baupläne für Banner (Grundfarbe + bis zu 6 Muster-Ebenen)
   ----------------------------------------------------------------------------
   Ein Bauplan gilt für alle Welten. Musternamen deutsch wie im Spiel, der
   englische Name steht klein daneben (für Online-Editoren/Videos).
   Vorschau: vereinfachte Pixel-Darstellung auf dem 20×40-Raster des Banners.
   Der Fortschritt der Anleitung (abgehakte Schritte) bleibt auf dem Gerät.
   ========================================================================== */

/** Zeichnet ein Banner auf 20×40 Pixel → Data-URL (mit Cache) */
const bannerCache = new Map();
/** RGBA-Pixel → PNG als Data-URL (Canvas) – auch für die Board-Karten (ctx.pngDaten) */
function pngDaten(breite, hoehe, rgba){
  const c = document.createElement("canvas");
  c.width = breite; c.height = hoehe;
  const g = c.getContext("2d"), bild = g.createImageData(breite, hoehe);
  bild.data.set(rgba);
  g.putImageData(bild, 0, 0);
  return c.toDataURL();
}
function bannerBild(b){
  const schluessel = JSON.stringify([b.basis, b.ebenen]);
  if(bannerCache.has(schluessel)) return bannerCache.get(schluessel);
  const url = pngDaten(20, 40, bannerPixel(b));   // Pixel aus board-karten.js
  bannerCache.set(schluessel, url);
  return url;
}
const bannerImg = (b, klasse, alt) => `<img class="banner-bild ${klasse || ""}" src="${bannerBild(b)}" alt="${esc(alt || "")}">`;
const bn = { liste:[], suche:"", entwurf:null, offen:null };
const $bannerListe = document.getElementById("bannerListe");

async function bannerLaden(){
  const r = await api("/banner");
  if(!r.ok) return toast(meldungAus(r), true);
  bn.liste = r.data.liste;
  if(aktivesModul === "banner") render();
}

function renderBanner(){
  const q = bn.suche.trim().toLowerCase();
  const liste = bn.liste.filter((b) => !q || b.name.toLowerCase().includes(q)

        </button>

          <button class="icon-btn" data-aktion="ebene-hoch" data-n="${n}" aria-label="Eine Ebene früher" ${n ? "" : "disabled"}>↑</button>
          <button class="icon-btn" data-aktion="ebene-runter" data-n="${n}" aria-label="Eine Ebene später" ${n < e.ebenen.length - 1 ? "" : "disabled"}>↓</button>

          <div class="field-group-label">Mit Bannervorlage</div>
          <div class="muster-raster">${musterFelder(l, MUSTER.filter((x) => BANNERVORLAGEN[x.id]))}</div>

  }).join("");

    <div class="banner-editor-kopf">
      <span class="banner-rahmen mittel">${bannerImg(e, "", "Vorschau")}</span>

        : '<button class="btn-secondary" data-aktion="ebene-neu">+ Ebene hinzufügen</button>'}
    </div>
    <div class="banner" id="bannerMeldung" hidden></div>

/** Klicks im Editor. Gibt true zurück, wenn der Klick hier behandelt wurde. */
function bannerEditorKlick(ziel){
  const e = bn.entwurf; if(!e) return false;
  const basis = ziel.closest("[data-basis]");
  if(basis){ e.basis = basis.dataset.basis; bannerEditorRendern(); return true; }
  const wahl = ziel.closest("[data-ebene]");
  const f = ziel.closest("[data-farbe]"), m = ziel.closest("[data-muster]");
  if(wahl && (f || m)){
    const l = e.ebenen[Number(wahl.dataset.ebene)];
    if(f) l.farbe = f.dataset.farbe; else l.muster = m.dataset.muster;
    bannerEditorRendern(); return true;
  }
  const a = ziel.closest("[data-aktion]"); if(!a) return false;
  const n = Number(a.dataset.n);
  const tauschen = (i, j) => { [e.ebenen[i], e.ebenen[j]] = [e.ebenen[j], e.ebenen[i]]; if(bn.offen === i) bn.offen = j; else if(bn.offen === j) bn.offen = i; };
  switch(a.dataset.aktion){
    case "ebene-auf": bn.offen = bn.offen === n ? null : n; break;
    case "ebene-neu":
      if(e.ebenen.length >= MAX_EBENEN) return true;
      e.ebenen.push({ muster:"stripe_bottom", farbe:kontrast(e.basis) });
      bn.offen = e.ebenen.length - 1; break;
    case "ebene-hoch": if(n > 0) tauschen(n, n - 1); break;
    case "ebene-runter": if(n < e.ebenen.length - 1) tauschen(n, n + 1); break;
    case "ebene-weg":
      e.ebenen.splice(n, 1);
      if(bn.offen === n) bn.offen = null; else if(bn.offen > n) bn.offen--;
      break;
    default: return false;
  }
  bannerEditorRendern();
  return true;
}

async function bannerSpeichern(){
  const e = bn.entwurf;
  e.name = document.getElementById("bannerName").value.trim();
  const $m = document.getElementById("bannerMeldung");
  const problem = bannerPruefen(e);
  if(problem) return banner($m, "bad", problem + ".");
  const daten = bannerSauber(e);
  const r = e.id ? await api(`/banner/${e.id}`, { method:"PUT", body:JSON.stringify(daten) })
    : await api("/banner", { method:"POST", body:JSON.stringify({ id:neueEintragId(), ...daten }) });
  if(!r.ok) return banner($m, "bad", meldungAus(r));
  const neu = r.data.banner;
  const i = bn.liste.findIndex((x) => x.id === neu.id);
  // Muster geändert → abgehakte Schritte passen nicht mehr
  if(i >= 0 && JSON.stringify([bn.liste[i].basis, bn.liste[i].ebenen]) !== JSON.stringify([neu.basis, neu.ebenen]))
    lsSchreiben(`banner.schritte.${neu.id}`, null);
  if(i >= 0) bn.liste[i] = neu; else bn.liste.unshift(neu);
  bn.entwurf = null;
  render(); bannerDetailOeffnen(neu.id); toast("Banner gespeichert");
}

async function bannerLoeschen(id){
  const r = await api(`/banner/${id}`, { method:"DELETE" });
  if(!r.ok) return toast(meldungAus(r), true);
  bn.liste = bn.liste.filter((b) => b.id !== id);
  lsSchreiben(`banner.schritte.${id}`, null);
  alleSchliessen(); render(); toast("Banner gelöscht");
}

function bannerSchrittUmschalten(id, n){
  const erledigt = bannerFortschritt(id);
  erledigt.has(n) ? erledigt.delete(n) : erledigt.add(n);
  lsSchreiben(`banner.schritte.${id}`, erledigt.size ? [...erledigt] : null);
  bannerDetailOeffnen(id);
}

/* ============================================================================
   9e · PORTAL-VERWALTUNG  ·  Umrechnen, Verbindungen erfassen + prüfen, Infokarte
   ----------------------------------------------------------------------------
   Verbindung = zwei Portale (Oberwelt + Nether) einer Welt, für alle gemeinsam.
   Die Prüfung spielt nach, was das Spiel beim Durchgehen macht – aber nur mit
   den hier erfassten Portalen:
     1. Position umrechnen: Oberwelt → Nether ÷ 8 (abgerundet), zurück × 8, Y bleibt
     2. Im Suchbereich (Quadrat) um diesen Zielpunkt nach Portalen suchen:
        ±128 in beiden Dimensionen (Bedrock)
     3. Das nächste gewinnt – 3D-Abstand, Y zählt mit. Keins gefunden → neues Portal.
   Quelle: minecraft.wiki/w/Nether_portal („Portal search“)
   Prüfung und Empfehlung (verbindungPruefen, portalEmpfehlung) stehen in board-karten.js.
   ========================================================================== */
const pt = {
  liste: [],
  info: Boolean(lsLesen("portale.info")),
  rechner: Object.assign({ von:"overworld", x:"", y:"", z:"" }, lsLesen("portale.rechner") || {}),
  entwurfId: null,   // Verbindung im Editor (null = neu)
};
const $portalStage = document.getElementById("portalStage");
const andereDim = (d) => d === "overworld" ? "nether" : "overworld";
const dimFarbe = (d) => THEMES[d].ui["--accent"];

function richtungText(s, art){
  if(art === "ok") return `kommt am eigenen Portal an${s.treffer.abstand >= 1 ? ` (${Math.round(s.treffer.abstand)} Blöcke vom Zielpunkt)` : ""}`;
  if(art === "anders") return `landet bei <b>„${esc(s.treffer.portal.name)}“</b> – das liegt näher am Zielpunkt ${zahl(s.ziel.x)} / ${zahl(s.ziel.z)}`;
  return `kein Portal im Suchbereich (±${s.radius}) – das Spiel baut ein neues bei ${zahl(s.ziel.x)} / ${zahl(s.ziel.z)}`;
}
const pruefZeile = (von, s, art) => `<div class="pruef-zeile ${art === "ok" ? "ok" : art === "anders" ? "warn" : "bad"}">
  <span class="ico">${art === "ok" ? "✓" : "!"}</span>
  <span><b>${dimLabel(von)} → ${dimLabel(andereDim(von))}:</b> ${richtungText(s, art)}</span></div>`;
const pruefZeilen = (p) => pruefZeile("overworld", p.hin, p.artHin) + pruefZeile("nether", p.rueck, p.artRueck);

function rechnerWerte(){
  const n = (v) => (v === "" || v === "-" ? null : Number(v));
  const x = n(pt.rechner.x), y = n(pt.rechner.y), z = n(pt.rechner.z);
  if(!Number.isInteger(x) || !Number.isInteger(z) || (y !== null && !Number.isInteger(y))) return null;
  return { x, y, z };
}
function rechnerZiel(){
  const p = rechnerWerte(); if(!p) return null;
  return { p, s:zielSuchen(pt.rechner.von, p, portaleAlle(pt.liste)) };
}
function rechnerErgebnisHtml(){

/* ============================================================================
   9f · BOARD-VERBINDUNG  ·  QR-Code der Anzeige scannen, beitreten, live halten
   ----------------------------------------------------------------------------
   Das Koordinaten-Board zeigt einen QR-Code mit „http://<ip>:<port>/?pin=1234“.
   Die Companion liest ihn (Kamera, Foto oder von Hand), tritt mit Name + PIN
   bei und hält danach die Live-Verbindung offen:
     POST <board>/api/beitreten  { pin, name }  → { token, name }
     WS   <board>/ws?token=…                    → { art:"zustand"|"teilnehmer", … }
   Das Board ist ein eigenes Gerät: Die Verbindung ist auch im DEMO-Modus echt.
   Sie gilt nur für dieses Gerät (localStorage „board.verbindung“, „board.name“).
   Live-Betrieb (das Board liefert diese Seite aus): Beitreten ist die Anmeldung
   für alle Daten. Das Board ist dann immer location.origin – ohne Scanner, die
   PIN kommt aus dem QR-Code (?pin=…), den die Kamera-App geöffnet hat.

   „Aufs Board“ (Inhalte auf die Anzeige werfen), über dieselbe Verbindung:
     → { art:"zeigen", karte, anfrage }       ← { art:"ok"|"fehler", anfrage }
     → { art:"verbergen", id, anfrage }       ← an alle: { art:"gezeigt", karte|null }
     karte = { titel, unter?, bereich?, quelle?, dimension:"oberwelt"|"nether"|"ende"|null,
               bloecke:[ { art:"koordinaten", label?, x, y|null, z, dimension? }
                       | { art:"zeilen", zeilen:[{ label, wert }] } | { art:"text", text } ] }
       Blöcke außerdem { art:"bild", daten:"data:image/png;base64,…", label?, pixelig? },
       optional typ (Seed-Map-Typ) → die Anzeige zeigt den Kennblock neben dem Titel.
   Das Board prüft die Karte (koordinaten-board/server/src/zeigen.js) und zeigt
   sie groß, bis die nächste kommt oder jemand sie wegnimmt.
   ANZEIGESCHEMA: Jeder Inhalt, der aufs Board kann, hat in BOARD_KARTEN
   (board-karten.js) eine Funktion (ctx, id) → Karte; ctx baut boardKontext() aus
   dem Zustand der Seite. Der Board-Server baut mit denselben Funktionen die Karten
   der Dashboard-Widgets. Das Board selbst kennt keine Bereiche; ein neuer Bereich
   trägt dort sein Schema ein und baut boardZeigenKnopf("<art>:<id>") in sein Detail.
   ========================================================================== */
const bd = {
  verbindung: lsLesen("board.verbindung"),  // { adresse, token, name } oder null
  status: "aus",                             // aus · verbindet · verbunden · getrennt
  teilnehmer: [], orte: null,
  socket: null, timer: null, wartezeit: 500,
  scan: null,                                // { stream } solange die Kamera läuft
  gezeigt: null,                             // Karte, die gerade auf der Anzeige liegt
  einstellungen: null,                       // Live: { titel, qrZeigen, aktiveWelt, aktiv } der Anzeige
  anzeigen: null,                            // Live: Geräte mit Anzeige-Link [{ id, name, link }]
  anzeigeQr: null, anzeigeFrage: null, anzeigeUmbenennen: null,   // offener QR-Code, „Neuer Schlüssel?“, Umbenennen
  ich: null,                                 // Live: { id, anzeigename, rolle } aus IDENTITAET.werBistDu()
  konten: [],                                // Beitreten: Accounts zum Auswählen [{ id, name }]
  offen: new Map(), zaehler: 0,              // gesendete Nachrichten, die auf „ok“ warten
};
const adresseKurz = (a) => String(a || "").replace(/^https?:\/\//, "");

/** Inhalt des Board-QR-Codes lesen: „http://192.168.8.184:3000/?pin=1234“ → { adresse, pin } */
function boardQrLesen(text){
  let url;
  try { url = new URL(String(text || "").trim()); } catch { return null; }
  const pin = url.searchParams.get("pin") || "";
  if(!/^https?:$/.test(url.protocol) || !/^\d{4}$/.test(pin)) return null;
  return { adresse:url.origin, pin };
}
/** Adresse von Hand: „192.168.8.184“ oder „192.168.8.184:3000“ → „http://192.168.8.184:3000“ */
function boardAdresseLesen(text){
  let t = String(text || "").trim().replace(/\/+$/, "");
  if(!t) return null;
  if(!/^https?:\/\//i.test(t)) t = "http://" + t;
  let url;
  try { url = new URL(t); } catch { return null; }
  if(!url.port && url.protocol === "http:") url.port = String(CONFIG.boardPort);
  return url.origin;
}

// --- QR-Erkennung: BarcodeDetector (Android-Chrome), sonst jsQR nachladen -----
let qrLeserZusage = null;
function skriptLaden(src){
  return new Promise((ok, fehler) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); fehler(new Error("Skript nicht geladen")); };
    document.head.appendChild(s);
  });
}
/** Liefert eine Funktion (Video, Bild oder ImageBitmap) → Text des QR-Codes oder null */
function qrLeser(){
  if(!qrLeserZusage) qrLeserZusage = (async () => {
    if("BarcodeDetector" in window){
      try {
        if((await BarcodeDetector.getSupportedFormats()).includes("qr_code")){
          const d = new BarcodeDetector({ formats:["qr_code"] });
          return async (quelle) => (await d.detect(quelle))[0]?.rawValue || null;
        }
      } catch {}
    }
    if(!window.jsQR) await skriptLaden(CONFIG.qrBibliothek);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    return async (quelle) => {
      const w0 = quelle.videoWidth || quelle.width, h0 = quelle.videoHeight || quelle.height;
      if(!w0 || !h0) return null;
      const f = Math.min(1, CONFIG.scanMaxPx / Math.max(w0, h0));
      const w = Math.round(w0 * f), h = Math.round(h0 * f);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(quelle, 0, 0, w, h);
      return window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h)?.data || null;
    };
  })();
  qrLeserZusage.catch(() => { qrLeserZusage = null; });  // nächster Versuch lädt neu
  return qrLeserZusage;
}

// --- Kamera ------------------------------------------------------------------
async function boardScanStarten(){
  boardScanStoppen();
  const $box = document.getElementById("boardScanner"), $text = document.getElementById("boardScanText");
  const $video = document.getElementById("boardVideo");
  if(!$box) return;
  $box.classList.remove("aus", "erkannt");
  const aus = (text) => { $box.classList.add("aus"); $text.textContent = text; };
  if(!navigator.mediaDevices?.getUserMedia)
    return aus(window.isSecureContext ? "Keine Kamera gefunden – Foto oder Adresse nutzen"
                                      : "Kamera nur über https – Foto oder Adresse nutzen");
  const scan = { stream:null };
  bd.scan = scan;
  $text.textContent = "Kamera startet …";
  try {
    scan.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
  } catch(e){
    if(bd.scan !== scan) return;
    bd.scan = null;
    return aus(e?.name === "NotAllowedError" ? "Kamera nicht erlaubt – Foto oder Adresse nutzen"
                                             : "Keine Kamera gefunden – Foto oder Adresse nutzen");
  }
  // Sheet inzwischen geschlossen → Kamera gleich wieder aus
  if(bd.scan !== scan){ scan.stream.getTracks().forEach((t) => t.stop()); return; }
  $video.srcObject = scan.stream;
  try { await $video.play(); } catch {}
  let lesen;
  try { lesen = await qrLeser(); }
  catch { boardScanStoppen(); return aus("QR-Erkennung nicht geladen – Foto oder Adresse nutzen"); }
  if(bd.scan !== scan) return;
  $text.textContent = "QR-Code der Anzeige in den Rahmen halten";
  const runde = async () => {
    if(bd.scan !== scan) return;
    if($video.readyState >= 2){
      const text = await lesen($video).catch(() => null);
      if(bd.scan !== scan) return;
      if(text && boardTreffer(text)) return;
    }
    setTimeout(runde, CONFIG.scanTaktMs);
  };
  runde();
}
function boardScanStoppen(){
  const s = bd.scan; bd.scan = null;
  s?.stream?.getTracks().forEach((t) => t.stop());
}

/** Gelesener QR-Text – true, wenn es der Code eines Boards war */
function boardTreffer(text){
  const qr = boardQrLesen(text);
  const $text = document.getElementById("boardScanText");
  if(!qr){
    if(bd.scan && $text) $text.textContent = "Das ist kein QR-Code vom Board";
    return false;
  }
  boardScanStoppen();
  document.getElementById("boardScanner")?.classList.add("erkannt");
  if($text) $text.textContent = "Erkannt";
  document.getElementById("boardAdresse").value = adresseKurz(qr.adresse);
  document.getElementById("boardPin").value = qr.pin;
  banner(document.getElementById("boardBanner"), "ok", `QR-Code erkannt · ${adresseKurz(qr.adresse)}`);
  boardKontenLaden(qr.adresse, qr.pin);
  // Name und eigene PIN schon da → gleich beitreten, sonst ins fehlende Feld
  const $name = document.getElementById("boardName"), $kontoPin = document.getElementById("boardKontoPin");
  if($name.value.trim() && /^\d{4,8}$/.test($kontoPin.value)) boardBeitretenKlick();
  else ($name.value.trim() ? $kontoPin : $name).focus();
  return true;
}
async function boardFotoLesen(datei){
  const $b = document.getElementById("boardBanner");
  let text = null;
  try {
    const bild = await createImageBitmap(datei);
    text = await (await qrLeser())(bild);
    bild.close?.();
  } catch { return banner($b, "bad", "Foto konnte nicht gelesen werden – Adresse und PIN von Hand eintragen."); }
  if(!text) return banner($b, "bad", "Auf dem Foto ist kein QR-Code zu erkennen.");
  if(!boardTreffer(text)) banner($b, "bad", "Das ist kein QR-Code vom Koordinaten-Board.");
}

// --- Identität (Strang B) --------------------------------------------------------
/* Wer bin ich? Gekapselt hinter werBistDu(), damit später ein richtiges Login dahinter
   stehen kann, ohne die Daten anzufassen – alle Einträge hängen an der Benutzer-ID
   (erstellerId). Heute: Account + eigene PIN beim Beitreten, das Token ist der
   Geräteschlüssel. Der Server prüft mit derselben Schnittstelle (identitaet.js). */
const IDENTITAET = Object.freeze({
  /** → { id, anzeigename, rolle:"Besitzer" } oder null (nicht angemeldet, Account oder Gerät unbekannt) */
  async werBistDu(){
    const r = await api("/ich");
    return r.ok ? { id:r.data.id, anzeigename:r.data.name, rolle:"Besitzer" } : null;
  },
});

// --- Beitreten + Live-Verbindung -----------------------------------------------
function boardNetzFehler(adresse){
  if(location.protocol === "https:" && adresse.startsWith("http:"))
    return "Der Browser blockiert die Verbindung: Die Companion läuft über https, das Board über http.";
  return "Board nicht erreichbar – gleiches WLAN? Läuft das Board noch?";
}
/** Beitreten (Strang B): Board-PIN, dann Account wählen oder anlegen – Name + eigene PIN.
    Gibt es den Namen schon, meldet die PIN dort an; sonst entsteht ein neuer Account. */
async function boardBeitreten(adresse, pin, name, kontoPin){
  let res, data = null;
  try {
    res = await fetch(`${adresse}/api/beitreten`, { method:"POST",
      headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ pin, name, kontoPin }) });
    data = await res.json().catch(() => null);
  } catch { return { fehler:boardNetzFehler(adresse) }; }
  if(!res.ok) return { fehler:data?.fehler || `Fehler ${res.status}` };
  return { verbindung:{ adresse, token:data.token, name:data.name }, neu:data.neu };
}
/** Accounts des Boards zum Auswählen (nur mit der Board-PIN) → Knöpfe über dem Namen */
async function boardKontenLaden(adresse, pin){
  bd.konten = [];
  try {
    const res = await fetch(`${adresse}/api/beitreten/konten`, { method:"POST",
      headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ pin }) });
    if(res.ok) bd.konten = (await res.json()).konten || [];
  } catch { /* Board nicht erreichbar – der Knopf „Beitreten“ meldet das */ }
