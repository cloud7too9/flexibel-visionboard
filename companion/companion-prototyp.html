/** Live: Ein Handy hat etwas geändert (auch dieses) → nur den betroffenen Bereich neu laden */
async function liveAktualisieren({ bereich, weltId }){
  if(DEMO.enabled) return;
  if(bereich === "banner") return bannerLaden();
  if(bereich === "ruestung") return ruestungLaden();
  if(bereich === "einstellungen") return boardEinstellungenLaden();
  if(bereich === "anzeigen") return boardAnzeigenLaden();
  if(bereich === "welten"){ await weltenAuffrischen(); return boardEinstellungenLaden(); }
  if(weltId && weltId !== st.weltId) return weltenAuffrischen();
  if(bereich === "orte") return orteAuffrischen();
  if(bereich === "sammelobjekte") return samLaden();
  if(bereich === "portale") return portaleLaden();
  if(bereich === "biome") return biomeLaden();
}
async function weltenAuffrischen(){
  const r = await api("/orte/welten"); if(!r.ok) return;
  st.welten = r.data.welten;
  if(!st.weltId && st.welten[0]) return weltLaden(st.welten[0].id);
  if(st.sheet === "welt") weltOeffnen();
  render();

/** Orte der aktuellen Welt neu holen, ohne Ansicht, Filter oder Kartenausschnitt zu verändern */
async function orteAuffrischen(){
  if(!st.weltId) return;
  const r = await api(`/orte/welten/${st.weltId}`); if(!r.ok) return;
  Object.assign(st, { typen:r.data.typen, instanzen:r.data.instanzen });

}

function boardVerbinden(){
  boardSocketZu();
  const v = bd.verbindung; if(!v) return;
  bd.status = "verbindet"; boardAnzeigen();
  let ws;
  try { ws = new WebSocket(`${v.adresse.replace(/^http/, "ws")}/ws?token=${encodeURIComponent(v.token)}`); }
  catch { bd.status = "getrennt"; boardAnzeigen(); return; }   // z. B. ws:// von einer https-Seite
  bd.socket = ws;
  ws.onopen = () => { if(bd.socket !== ws) return; bd.status = "verbunden"; bd.wartezeit = 500; boardAnzeigen(); };
  ws.onmessage = (e) => {
    let n; try { n = JSON.parse(e.data); } catch { return; }
    if((n.art === "ok" || n.art === "fehler") && n.anfrage){
      const w = bd.offen.get(n.anfrage); bd.offen.delete(n.anfrage);
      return n.art === "ok" ? w?.ok() : w?.fehler(n.text || "Board hat abgelehnt");
    }
    if(n.art === "geaendert") return liveAktualisieren(n);
    if(n.art === "teilnehmer") bd.teilnehmer = n.namen || [];
    else if(n.art === "zustand") bd.orte = n.zustand?.orte?.length ?? null;
    else if(n.art === "gezeigt") bd.gezeigt = n.karte || null;
    else return;
    boardAnzeigen();
  };
  ws.onclose = (e) => {
    if(bd.socket !== ws) return;             // absichtlich geschlossen oder ersetzt
    bd.socket = null;
    boardOffeneAbbrechen();
    if(e.code === 4001){                     // Token abgelehnt, z. B. Board neu eingerichtet
      if(!DEMO.enabled) return anmeldungAbgelaufen();
      boardTrennen();
      return toast("Das Board kennt dieses Gerät nicht mehr – bitte neu scannen", true);
    }
    bd.status = "getrennt"; boardAnzeigen();
    bd.timer = setTimeout(boardVerbinden, bd.wartezeit);
    bd.wartezeit = Math.min(bd.wartezeit * 2, 8000);
  };
}
function boardSocketZu(){
  clearTimeout(bd.timer);
  const s = bd.socket; bd.socket = null;
  s?.close();
  boardOffeneAbbrechen();
}
function boardOffeneAbbrechen(){
  for(const w of bd.offen.values()) w.fehler("Verbindung zum Board unterbrochen");
  bd.offen.clear();
  bd.gezeigt = null;                          // nach dem Neuverbinden schickt das Board den Stand
}
/** Nachricht ans Board, wartet auf dessen „ok“ (sonst Fehlertext) */
function boardSenden(op){
  return new Promise((ok, fehler) => {
    const s = bd.socket;
    if(!s || s.readyState !== WebSocket.OPEN) return fehler("Keine Verbindung zum Board");
    const anfrage = ++bd.zaehler;
    bd.offen.set(anfrage, { ok, fehler });
    s.send(JSON.stringify({ ...op, anfrage }));
    setTimeout(() => { if(bd.offen.delete(anfrage)) fehler("Board antwortet nicht"); }, 8000);
  });
}

                    Figur auf dem Rüstungsständer, Besätze der aktuellen Welt
   ----------------------------------------------------------------------------
   Sets gelten für alle Welten (wie Banner), „gefunden“ kommt aus den
   Sammelobjekten der aktuellen Welt. Grafik aus ruestungs-baukasten/:
   · Icons: fertig/items/<ruestung>_<teil>[_<farbe|standard>][__<material>].png
     als <img> – geht überall, auch als Datei.
   · Figur: baukasten.js färbt die Texturen um (Canvas-Pixel), figur3d.js baut
     daraus mit three.js (CDN) die drehbare 3D-Figur. Canvas-Pixel gibt es nur
     über http (Board-Server). Ohne three.js → flache 2D-Figur, als Datei → Icons.
   ========================================================================== */
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
const rs = { sets:[], geladen:false, detail:null, entwurf:null, teil:"helmet", slot:"vorlage", offen:null };
const $ruestungListe = document.getElementById("ruestungListe");
const PFEIL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14M13 6l6 6-6 6"/></svg>';
const BUEHNE_DIMS = Object.freeze([
  { id:"oberwelt", name:"Oberwelt", hintergrund:"bloecke/deepslate.png" },
  { id:"nether",   name:"Nether",   hintergrund:"bloecke/netherrack.png" },
  { id:"end",      name:"End",      hintergrund:"bloecke/obsidian.png" },
]);

/** Name im Spiel, z. B. „Netherithelm“ */
const zutatDatei = (m) => `${BAUKASTEN}zutaten/${m.icon}.png`;
/** Leerer Slot am Schmiedetisch: blasser Platzhalter wie im Spiel */
const GEIST = { vorlage:`${BAUKASTEN}vorlagen/sentry_armor_trim_smithing_template.png`, material:`${BAUKASTEN}zutaten/iron_ingot.png` };
const geistBild = (art) => `<span class="geist">${itemBild(GEIST[art])}</span>`;
const ohneBesatz = (t) => t && { ...t, muster:null, material:null, verzaubert:false };
function teilIconDatei(teilId, t){
  if(!t) return `${BAUKASTEN}slots/empty_armor_slot_${teilId}.png`;
  const farbe = ruestungsArt(t.ruestung)?.faerbbar ? `_${t.farbe || "standard"}` : "";
  return `${BAUKASTEN}fertig/items/${t.ruestung}_${teilId}${farbe}${t.muster && t.material ? `__${t.material}` : ""}.png`;
}
/** Item-Icon eines Teils; verzauberte Teile schimmern. Über http mit dem Icon als Maske,
    als Datei nur mit violettem Schein (Masken-Bilder brauchen CORS, file:// hat keins). */
const MASKE_GEHT = location.protocol.startsWith("http");
function teilIcon(teilId, t){
  const datei = teilIconDatei(teilId, t);
  return `<span class="item-rahmen ${t ? "" : "leer"} ${t?.verzaubert ? "glanz" : ""}">${itemBild(datei, t ? itemName(teilId, t) : teilName(teilId))}${t?.verzaubert && MASKE_GEHT
    ? `<span class="glanz-schicht" style="--maske:url('${datei}')"></span>` : ""}</span>`;
}

/** Welche Rüstungsbesätze braucht das Set, welche sind in dieser Welt schon gefunden? */
const besatzStand = (s) => besatzStandVon(s, sam.status);   // board-karten.js
const zaehlen = (liste) => [...liste.reduce((m, x) => m.set(x, (m.get(x) || 0) + 1), new Map())];

async function ruestungLaden(){
  const r = await api("/ruestung");
  if(!r.ok){ toast(meldungAus(r), true); return; }
  rs.sets = r.data.sets;
  rs.geladen = true;
  if(aktivesModul === "ruestung") render();
  if(st.sheet === "ruestung") rs.sets.some((x) => x.id === rs.detail) ? ruestungDetailOeffnen(rs.detail) : alleSchliessen();
}

function renderRuestung(){
  if(!rs.geladen){ $ruestungListe.innerHTML = '<div class="empty-list"><span class="dreher"></span>Sets werden geladen …</div>'; return; }
  const hintergrund = (BUEHNE_DIMS.find((x) => x.id === fig.dim) || BUEHNE_DIMS[0]).hintergrund;
  $ruestungListe.innerHTML = rs.sets.map((s) => {
    const b = besatzStand(s);
    const teile = RUESTUNGS_TEILE.filter(({ id }) => s.teile[id]);
    const arten = [...new Set(teile.map(({ id }) => ruestungsArt(s.teile[id].ruestung).name))].join(", ");
    return `<button class="card ruestung-karte" data-set="${s.id}">
      <span class="ruestung-staender" data-staender="${s.id}" style="--hintergrund:url('${BAUKASTEN}${hintergrund}')">${staenderInhalt(s)}</span>
      <span class="ruestung-text">
        <span class="card-title">${esc(s.name)}</span>
        <span class="card-meta">${esc(arten)} · ${teile.length} ${teile.length === 1 ? "Teil" : "Teile"}${s.von ? ` · von ${esc(s.von)}` : ""}</span>
        <span class="teil-chips">${RUESTUNGS_TEILE.map(({ id }) => teilChipHtml(id, s.teile[id])).join("")}</span>
        ${b.verschieden.length
          ? `<span class="pill ${b.gefunden.length === b.verschieden.length ? "ok" : "warn"}">${b.gefunden.length}/${b.verschieden.length} gefunden</span>`
          : '<span class="card-meta">Ohne Besatz</span>'}
      </span>
    </button>`;
  }).join("") || '<div class="empty-list">Noch keine Rüstungs-Sets. Unten „Neues Set“ antippen.</div>';
  staenderFotosLaden();
}

/* ---------- Liste: Set auf dem Ständer + je Teil Rüstung, Vorlage, Rohstoff (Wunsch von Max, 05.10.2026) ----------
   Die Figur wird je Set einmal als Bild aufgenommen (3D auf dem Ständer, ohne three.js die 2D-Figur)
   und nach Teilen + Dimension zwischengespeichert. Als Datei gibt es keine Figur → die vier Icons. */
const staenderFotos = new Map();
const staenderSchluessel = (s) => JSON.stringify([fig.dim, s.teile]);
const staenderIcons = (s) => `<span class="staender-icons">${RUESTUNGS_TEILE.map(({ id }) => teilIcon(id, s.teile[id])).join("")}</span>`;
function staenderInhalt(s){
  const foto = staenderFotos.get(staenderSchluessel(s));
  if(foto) return `<img class="staender-bild" src="${foto}" alt="${esc(s.name)} auf dem Rüstungsständer" draggable="false">`;
  return fig.art === "icons" ? staenderIcons(s) : '<span class="dreher"></span>';
}
async function staenderFoto(s){
  const modus = await figurModus();
  if(modus === "icons") return null;
  if(modus === "3d"){
    fig.staender3d ??= fig.erstelle3D(document.createElement("canvas"), 180, 260, 96);   // näher dran: Figur füllt die Kachel
    const lauf = fig.kette.then(async () => {
      await fig.staender3d.setzen({ ausruestung:ausruestungVon(s.teile), traeger:"staender", sockel:sockelVon(fig.dim) });
      fig.staender3d.drehen(-0.55, 0.16);   // wie die Bühne im Detail
      return fig.staender3d.canvas.toDataURL("image/png");
    });
    fig.kette = lauf.catch(() => {});   // die Kette darf nie abgelehnt bleiben
    return lauf;
  }
  const c = await fig.bk.figur({ ausruestung:ausruestungVon(s.teile), ansicht:"vorn", massstab:4, skin:false });
  return c.toDataURL("image/png");
}
/** Fehlende Ständer-Bilder nacheinander aufnehmen und an Ort und Stelle einsetzen */
async function staenderFotosLaden(){
  const lauf = (fig.staenderLauf = (fig.staenderLauf || 0) + 1);
  for(const s of rs.sets){
    const schluessel = staenderSchluessel(s);
    if(!staenderFotos.has(schluessel)){
      try {
        const foto = await staenderFoto(s);
        if(foto) staenderFotos.set(schluessel, foto);
      } catch(f){ console.warn("Ständer-Bild:", f); }
    }
    if(lauf !== fig.staenderLauf) return;   // Liste wurde inzwischen neu gezeichnet
    const el = $ruestungListe.querySelector(`[data-staender="${s.id}"]`);
    if(el && staenderSchluessel(s) === schluessel) el.innerHTML = staenderInhalt(s);
  }
}
/** Ein Teil wie am Schmiedetisch, klein: Rüstungsteil (fertig) · Ziervorlage · Rohstoff */
function teilChipHtml(teilId, t){
  const o = t?.muster ? besatzMuster(t.muster) : null, m = o ? besatzMaterial(t.material) : null;
  const gefunden = o && sam.status[o.id];
  return `<span class="teil-chip ${t ? "" : "leer"}" title="${esc(t ? itemName(teilId, t) : teilName(teilId))}">
    <span class="chip-slot chip-ruestung">${teilIcon(teilId, t)}</span>
    <span class="chip-slot chip-vorlage ${o ? (gefunden ? "gefunden" : "fehlt") : "frei"}" title="${o ? `${esc(o.name)}${gefunden ? " – gefunden" : " – fehlt noch"}` : "Keine Vorlage"}">${o ? itemBild(vorlageDatei(o), o.name) : ""}</span>
    <span class="chip-slot chip-rohstoff ${m ? "" : "frei"}" title="${m ? esc(m.zutat) : "Kein Rohstoff"}">${m ? itemBild(zutatDatei(m), m.zutat) : ""}</span>
  </span>`;
}

// ---------- Detail ----------

/** Eine Zeile am Schmiedetisch: Vorlage + Rüstung + Material → Ergebnis */
function rezeptHtml(teilId, t){
  const o = t.muster ? besatzMuster(t.muster) : null, m = o ? besatzMaterial(t.material) : null;
  const slot = (inhalt, titel, klasse = "") => `<span class="slot ${klasse}" title="${esc(titel)}">${inhalt}</span>`;
  const gefunden = o && sam.status[o.id];
  const leder = ruestungsArt(t.ruestung)?.faerbbar
    ? ` · <i class="farbpunkt klein" style="background:${t.farbe ? farbe(t.farbe).hex : LEDER_STANDARD}"></i> ${t.farbe ? farbe(t.farbe).de : "ungefärbt"}` : "";
  return `<div class="card rezept">
    <div class="rezept-zeile">
      ${slot(o ? itemBild(vorlageDatei(o), o.name) : geistBild("vorlage"), o ? `Vorlage: ${o.name}` : "Keine Vorlage", o ? "" : "leer")}
      ${slot(teilIcon(teilId, ohneBesatz(t)), itemName(teilId, t))}
      ${slot(m ? itemBild(zutatDatei(m), m.zutat) : geistBild("material"), m ? m.zutat : "Kein Material", m ? "" : "leer")}
      <span class="rezept-pfeil">${PFEIL}</span>
      ${slot(teilIcon(teilId, t), "Ergebnis", "ergebnis")}
    </div>
    <div class="rezept-text">
      <b>${esc(itemName(teilId, t))}</b>
      <small>${o ? `${esc(o.name)}<span class="en">${esc(o.en)}</span> · ${esc(m.name)}` : "Ohne Besatz"}${leder}${t.verzaubert ? ' · <span class="verz">verzaubert</span>' : ""}</small>
    </div>
    ${!o ? "" : gefunden
      ? `<div class="besatz-status ok">✓ In dieser Welt gefunden · ${esc(gefunden.von)}</div>`
      : `<button class="besatz-status fehlt" data-aktion="zum-sammelobjekt" data-id="${o.id}">
          <span class="kb">${kennblockHtml(o.kategorie)}</span><span>Fehlt noch · ${esc(strukturName(o.kategorie))}${o.dim !== "overworld" ? ` (${dimLabel(o.dim)})` : ""}</span><span class="weiter">›</span></button>`}
  </div>`;
}

function bedarfHtml(s, b){
  const aufwertung = SAMMELOBJEKTE.find((o) => o.aufwertung);
  const zeile = (bild, text, status) => `<div class="bedarf-zeile">${bild}<span>${text}</span>${status ?? ""}</div>`;
  const status = (id) => sam.status[id] ? '<span class="pill ok">gefunden</span>' : '<span class="pill warn">fehlt</span>';
  const vorlagen = zaehlen(b.muster);
  const materialien = zaehlen(RUESTUNGS_TEILE.map(({ id }) => s.teile[id]?.muster && s.teile[id].material).filter(Boolean));
  const zeilen = [
    ...vorlagen.map(([m, n]) => { const o = besatzMuster(m); return zeile(itemBild(vorlageDatei(o)), `<b>${n} ×</b> ${esc(o.name)}`, status(m)); }),
    ...(b.netherit ? [zeile(itemBild(vorlageDatei(aufwertung)), `<b>${b.netherit} ×</b> Netheritaufwertung <small>+ Diamant-Teil + Netheritbarren</small>`, status(aufwertung.id))] : []),
    ...materialien.map(([m, n]) => zeile(itemBild(zutatDatei(besatzMaterial(m))), `<b>${n} ×</b> ${esc(besatzMaterial(m).zutat)}`)),
  ];
  if(!zeilen.length) return "";
  const mehrfach = vorlagen.some(([, n]) => n > 1) || b.netherit > 1;
  return `<div class="result-card bedarf">
    <div class="result-label">Du brauchst</div>
    ${zeilen.join("")}
    ${mehrfach ? '<p class="result-hint">Schmiedevorlagen werden verbraucht. Vervielfältigen an der Werkbank: Vorlage + 7 Diamanten + der Block, aus dem sie besteht (z. B. Netherrack bei Rippenzier).</p>' : ""}
  </div>`;
}

/* Verzauberungs-Pläne je Teil – beste Verzauberung mit wenig XP (Vorlage: lighthousepng).
   XP-Werte sind Richtwerte und können im Spiel leicht abweichen.
   Schritt = [links, rechts, xp]; links/rechts: { teil:true|false, v:[Verzauberungen] } */
const T = (...v) => ({ teil:true, v }), B = (...v) => ({ teil:false, v });
const VERZAUBERUNG = Object.freeze({
  helmet:     { ziel:["Schutz IV", "Haltbarkeit III", "Atmung III", "Wasseraffinität", "Reparatur"], schritte:[
    [T(), B("Atmung III"), 6], [B("Schutz IV"), B("Reparatur"), 2], [T("Atmung III"), B("Schutz IV", "Reparatur"), 8],
    [B("Haltbarkeit III"), B("Wasseraffinität"), 2], [T("Atmung III", "Schutz IV", "Reparatur"), B("Haltbarkeit III", "Wasseraffinität"), 9]] },
  chestplate: { ziel:["Schutz IV", "Haltbarkeit III", "Reparatur"], schritte:[
    [T(), B("Schutz IV"), 4], [B("Haltbarkeit III"), B("Reparatur"), 4], [T("Schutz IV"), B("Haltbarkeit III", "Reparatur"), 5]] },
  leggings:   { ziel:["Schutz IV", "Haltbarkeit III", "Reparatur", "Huschen III"], schritte:[
    [T(), B("Huschen III"), 12], [B("Haltbarkeit III"), B("Reparatur"), 2], [T("Huschen III"), B("Haltbarkeit III", "Reparatur"), 7],
    [T("Huschen III", "Haltbarkeit III", "Reparatur"), B("Schutz IV"), 7]] },
  boots:      { ziel:["Schutz IV", "Haltbarkeit III", "Reparatur", "Wasserläufer III", "Seelenläufer III", "Federfall IV"], schritte:[
    [T(), B("Seelenläufer III"), 12], [B("Wasserläufer III"), B("Federfall IV"), 3], [T("Seelenläufer III"), B("Wasserläufer III", "Federfall IV"), 11],
    [B("Schutz IV"), B("Haltbarkeit III"), 2], [B("Schutz IV", "Haltbarkeit III"), B("Reparatur"), 10],
    [T("Seelenläufer III", "Wasserläufer III", "Federfall IV"), B("Schutz IV", "Haltbarkeit III", "Reparatur"), 11]] },
});
const xpSumme = (teilId) => VERZAUBERUNG[teilId].schritte.reduce((n, s) => n + s[2], 0);
const verzSchritte = (setId, teilId) => new Set(lsLesen(`ruestung.schritte.${setId}.${teilId}`) || []);
const ambossSeite = (seite, name) => seite.teil
  ? `<b>${esc(name)}</b>${seite.v.length ? `<small>${seite.v.map(esc).join(", ")}</small>` : ""}`
  : `<b>Buch</b><small>${seite.v.map(esc).join(", ")}</small>`;

function verzauberungHtml(s){
  const teile = RUESTUNGS_TEILE.filter(({ id }) => s.teile[id]?.verzaubert);
  if(!teile.length) return "";
  return `<div class="field-group"><div class="field-group-label">Verzaubern am Amboss</div><div class="list-stack">${teile.map(({ id }) => {
    const plan = VERZAUBERUNG[id], erledigt = verzSchritte(s.id, id), offen = rs.offen === id, name = itemName(id, s.teile[id]);
    return `<div class="card verz ${offen ? "offen" : ""}">
      <button class="verz-kopf" data-aktion="verz-auf" data-teil-id="${id}" aria-expanded="${offen}">
        ${teilIcon(id, s.teile[id])}
        <span class="verz-text"><b>${esc(name)}</b><small>${erledigt.size}/${plan.schritte.length} Schritte · ${xpSumme(id)} XP · ${plan.ziel.map(esc).join(" · ")}</small></span>
        <span class="ach-cat-chevron">${CHEVRON}</span>
      </button>
      ${offen ? `<div class="list-stack verz-schritte">${plan.schritte.map(([l, r, xp], n) => `<button class="card schritt amboss ${erledigt.has(n) ? "erledigt" : ""}" data-aktion="verz-schritt" data-id="${s.id}" data-teil-id="${id}" data-n="${n}">
          <span class="schritt-nr">${erledigt.has(n) ? "✓" : n + 1}</span>
          <span class="amboss-seite">${ambossSeite(l, name)}</span><span class="plus">+</span><span class="amboss-seite">${ambossSeite(r, name)}</span>
          <span class="xp">${xp}<small>XP</small></span></button>`).join("")}
        <p class="result-hint">Reihenfolge mit wenig XP (Vorlage: lighthousepng) · XP-Werte sind Richtwerte, im Spiel leicht abweichend. Abhaken gilt nur auf diesem Gerät.</p></div>` : ""}
    </div>`;
  }).join("")}</div></div>`;
}
function verzSchrittUmschalten(setId, teilId, n){
  const erledigt = verzSchritte(setId, teilId);
  erledigt.has(n) ? erledigt.delete(n) : erledigt.add(n);
  lsSchreiben(`ruestung.schritte.${setId}.${teilId}`, erledigt.size ? [...erledigt] : null);
  ruestungDetailOeffnen(setId);
}

function ruestungDetailOeffnen(id){
  const s = rs.sets.find((x) => x.id === id); if(!s) return;
  const scroll = st.sheet === "ruestung" && rs.detail === id ? $sheet.scrollTop : 0;
  rs.detail = id;
  const b = besatzStand(s);
  const rezepte = RUESTUNGS_TEILE.filter(({ id:t }) => s.teile[t]).map(({ id:t }) => rezeptHtml(t, s.teile[t])).join("");
  const html = kopfHtml(esc(s.name), `Rüstungs-Set · für alle Welten${s.von ? ` · von ${esc(s.von)}` : ""}`) + `<div class="orte-inhalt">
    ${buehneHtml()}
    ${b.verschieden.length ? `<div class="banner ${b.gefunden.length === b.verschieden.length ? "ok" : "warn"}">${b.gefunden.length === b.verschieden.length
        ? "Alle Rüstungsbesätze sind in dieser Welt gefunden."
        : `${b.gefunden.length} von ${b.verschieden.length} Rüstungsbesätzen in dieser Welt gefunden.`}</div>` : ""}
    <div class="field-group"><div class="field-group-label">Am Schmiedetisch</div><div class="list-stack">${rezepte}</div></div>
    ${bedarfHtml(s, b)}
    ${verzauberungHtml(s)}
    ${boardZeigenKnopf(`ruestung:${s.id}`)}
    <div class="knopf-raster">
      <button class="btn-primary" data-aktion="set-bearbeiten" data-id="${s.id}">Bearbeiten</button>
      <button class="btn-danger" data-aktion="set-loeschen" data-id="${s.id}">Löschen</button>
    </div>
  </div>`;
  sheetOeffnen("ruestung", html, "overworld");
  $sheet.scrollTop = scroll;
  boardZeigenKnoepfe();
  buehneZeigen(s.teile);
}

async function ruestungLoeschen(id){
  const r = await api(`/ruestung/${id}`, { method:"DELETE" });
  if(!r.ok) return toast(meldungAus(r), true);
  rs.sets = rs.sets.filter((x) => x.id !== id);
  alleSchliessen(); render(); toast("Set gelöscht");
}

// ---------- Editor: der Schmiedetisch ----------

const neuesTeil = (ruestung = "netherite") => ({ ruestung, muster:null, material:null, farbe:null, verzaubert:false });
function ruestungEditorOeffnen(id){
  const s = id ? rs.sets.find((x) => x.id === id) : null;
  rs.entwurf = s ? structuredClone(s)
    : { id:null, name:"", teile:Object.fromEntries(RUESTUNGS_TEILE.map(({ id:t }) => [t, { ...neuesTeil(), verzaubert:true }])) };
  rs.teil = "helmet"; rs.slot = "vorlage";
  ruestungEditorRendern();
}

function auswahlHtml(t){
  const knopf = (attr, wert, aktiv, bild, name, extra = "") =>
    `<button class="wahl ${aktiv ? "aktiv" : ""}" ${attr}="${wert}" aria-pressed="${aktiv}">${bild}<span>${esc(name)}</span>${extra}</button>`;
  if(rs.slot === "ruestung"){
    const arten = RUESTUNGEN.filter((r) => r.teile[rs.teil]);
    return `<div class="field-group-label">Rüstung · ${esc(t ? itemName(rs.teil, t) : `kein ${teilName(rs.teil)}`)}</div>
      <div class="wahl-raster">${knopf("data-wahl-ruestung", "", !t, itemBild(teilIconDatei(rs.teil, null)), "Ohne")}
      ${arten.map((r) => knopf("data-wahl-ruestung", r.id, t?.ruestung === r.id, itemBild(teilIconDatei(rs.teil, neuesTeil(r.id)), r.teile[rs.teil]), r.name)).join("")}</div>`;
  }
  if(!t) return '<div class="banner info">Dieses Teil gehört nicht zum Set. Im Slot „Rüstung“ eine Rüstung wählen.</div>';
  if(rs.slot === "material"){
    if(!t.muster) return '<div class="banner info">Erst eine Vorlage wählen – ohne Besatz braucht es kein Material.</div>';
    return `<div class="field-group-label">Material · ${esc(besatzMaterial(t.material)?.zutat || "noch keins")}</div>
      <div class="wahl-raster drei">${BESATZ_MATERIALIEN.map((m) => knopf("data-wahl-material", m.id, t.material === m.id, itemBild(zutatDatei(m), m.zutat), m.name)).join("")}</div>`;
  }
  const gefunden = SAM_ZAEHLT.filter((o) => sam.status[o.id]).length;
  return `<div class="field-group-label">Vorlage · ✓ in dieser Welt gefunden (${gefunden}/${SAM_ZAEHLT.length})</div>
    <div class="wahl-raster drei">${knopf("data-wahl-muster", "", !t.muster, '<span class="wahl-leer">–</span>', "Ohne Besatz")}
    ${SAM_ZAEHLT.map((o) => knopf("data-wahl-muster", o.id, t.muster === o.id, itemBild(vorlageDatei(o)), o.name,
        sam.status[o.id] ? '<i class="haken" aria-label="gefunden">✓</i>' : "")).join("")}</div>`;
}

function ruestungEditorRendern(){
  const e = rs.entwurf;
  const name = document.getElementById("setName");
  if(name && st.sheet === "ruestung-editor") e.name = name.value;
  const scroll = st.sheet === "ruestung-editor" ? $sheet.scrollTop : 0;
  const t = e.teile[rs.teil];

function ruestungEditorKlick(ziel){
  const e = rs.entwurf; if(!e) return false;
  const k = ziel.closest("[data-teil-wahl],[data-slot],[data-wahl-ruestung],[data-wahl-muster],[data-wahl-material],[data-wahl-farbe],[data-wahl-verzaubert]");
  if(!k || k.disabled) return false;
  const d = k.dataset, t = e.teile[rs.teil];
  if(d.teilWahl){ rs.teil = d.teilWahl; if(!e.teile[rs.teil]) rs.slot = "ruestung"; }
  else if(d.slot) rs.slot = d.slot;
  else if("wahlRuestung" in d){
    if(!d.wahlRuestung) e.teile[rs.teil] = null;
    else {
      const neu = t ? { ...t, ruestung:d.wahlRuestung } : neuesTeil(d.wahlRuestung);
      if(!ruestungsArt(neu.ruestung).faerbbar) neu.farbe = null;
      e.teile[rs.teil] = neu;
      if(!t) rs.slot = "vorlage";
    }
  }
  else if("wahlMuster" in d){
    t.muster = d.wahlMuster || null;
    if(!t.muster) t.material = null;
    else if(!t.material) rs.slot = "material";   // gleich weiter zum Material
  }
  else if("wahlMaterial" in d) t.material = d.wahlMaterial;
  else if("wahlFarbe" in d) t.farbe = d.wahlFarbe || null;
  else if("wahlVerzaubert" in d) t.verzaubert = !t.verzaubert;
  ruestungEditorRendern();
  return true;
}

};

/** Set-Teile → Ausrüstung für den Baukasten (Lederfarbe als Hex aus dem Manifest) */
function ausruestungVon(teile){
  return Object.fromEntries(RUESTUNGS_TEILE.flatMap(({ id }) => {
    const t = teile[id]; if(!t) return [];
    const farbe = t.farbe && ruestungsArt(t.ruestung)?.faerbbar ? fig.bk.manifest.farbstoffe.find((f) => f.id === t.farbe)?.hex : null;
    return [[id, { ruestung:t.ruestung, muster:t.muster, material:t.material, farbe, glanz:t.verzaubert }]];
  }));
}

function threeLaden(){
  if(window.THREE) return Promise.resolve(window.THREE);
  return new Promise((fertig) => {
    const s = document.createElement("script");
    s.src = THREE_URL; s.crossOrigin = "anonymous"; s.referrerPolicy = "no-referrer";
    const zeit = setTimeout(() => fertig(null), 8000);   // kein Internet → 2D
    s.onload = () => { clearTimeout(zeit); fertig(window.THREE || null); };
    s.onerror = () => { clearTimeout(zeit); fertig(null); };
    document.head.append(s);
  });
}

/** Was die Figur kann: "3d" | "2d" | "icons" – wird einmal ermittelt (fig.art) */
function figurModus(){
  fig.modus ??= (async () => {
    if(!location.protocol.startsWith("http")) return "icons";   // als Datei: Canvas-Pixel gesperrt
    try {
      const [{ erstelleBaukasten }, manifest] = await Promise.all([
        import(`./${BAUKASTEN}baukasten.js`),
        fetch(`${BAUKASTEN}manifest.json`).then((r) => { if(!r.ok) throw new Error(`manifest.json: ${r.status}`); return r.json(); }),
      ]);
      fig.bk = erstelleBaukasten({ manifest, basisPfad:BAUKASTEN });
      await fig.bk.itemIcon({ ruestung:"leather", teil:"helmet", material:"gold" });   // Probe: Pixel lesbar?
    } catch(f){ console.warn("Rüstungs-Baukasten nicht verfügbar:", f); return "icons"; }
    try {
      const THREE = await threeLaden();
      if(!THREE) return "2d";
      const { erstelleFigur3D } = await import(`./${BAUKASTEN}figur3d.js`);
      fig.erstelle3D = (canvas, breite, hoehe, abstand = 118) => erstelleFigur3D({ THREE, baukasten:fig.bk, canvas, breite, hoehe, abstand });
      fig.canvas3d = document.createElement("canvas");
      fig.canvas3d.className = "figur-3d";
      fig.f3d = fig.erstelle3D(fig.canvas3d, 320, 320);
      drehenEinrichten(fig.canvas3d);
      return "3d";
    } catch(f){ console.warn("3D-Figur nicht verfügbar:", f); return "2d"; }
  })().then((art) => (fig.art = art));
  return fig.modus;
}

/** Figur in die Bühne des offenen Sheets setzen (Aufträge laufen nacheinander, veraltete fallen weg) */
async function buehneZeigen(teile){
  const auftrag = ++fig.auftrag;
  fig.teile = teile;
  const modus = await figurModus();
  const flaeche = document.getElementById("buehneFlaeche"), hinweis = document.getElementById("buehneHinweis");
  if(auftrag !== fig.auftrag || !flaeche) return;
  const traeger = flaeche.parentElement.querySelector("[data-buehne-traeger]");
  if(modus === "icons"){
    flaeche.innerHTML = `<div class="buehne-icons">${RUESTUNGS_TEILE.map(({ id }) => teilIcon(id, teile[id])).join("")}</div>`;
    hinweis.textContent = "3D-Figur nur über das Board";
    return;
  }
  fig.kette = fig.kette.then(async () => {
    if(auftrag !== fig.auftrag || !flaeche.isConnected) return;
    if(modus === "3d"){
      if(fig.canvas3d.parentElement !== flaeche) flaeche.replaceChildren(fig.canvas3d);
      const b = Math.round(flaeche.clientWidth), h = Math.round(flaeche.clientHeight);
      if(b && h && (fig.groesse?.[0] !== b || fig.groesse?.[1] !== h)){ fig.f3d.groesseSetzen(b, h); fig.groesse = [b, h]; }
      await fig.f3d.setzen({ ausruestung:ausruestungVon(teile), traeger:fig.traeger, sockel:sockelVon(fig.dim) });
      traeger.hidden = false;
      hinweis.textContent = "Zum Drehen ziehen";
    } else {
      const c = await fig.bk.figur({ ausruestung:ausruestungVon(teile), ansicht:fig.ansicht, massstab:8 });
      c.className = "figur-2d";
      if(auftrag !== fig.auftrag || !flaeche.isConnected) return;
      flaeche.replaceChildren(c);
      hinweis.textContent = `${fig.ansicht === "vorn" ? "Vorderseite" : "Rückseite"} · antippen zum Umdrehen`;
    }
    glanzStarten();
  }).catch((f) => { console.warn("Figur:", f); hinweis.textContent = "Figur konnte nicht gezeichnet werden"; });
}

/** Verzauberte Teile schimmern – nur solange die 3D-Figur zu sehen ist */
function glanzStarten(){
  clearInterval(fig.glanzTimer); fig.glanzTimer = null;
  if(fig.art !== "3d" || !fig.f3d.hatGlanz() || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let phase = 0, laeuft = false;
  fig.glanzTimer = setInterval(async () => {
    // Das Sheet bleibt nach dem Schließen im DOM – deshalb am offenen Sheet festmachen
    if(!fig.canvas3d.isConnected || (st.sheet !== "ruestung" && st.sheet !== "ruestung-editor")){ clearInterval(fig.glanzTimer); fig.glanzTimer = null; return; }
    if(laeuft || document.hidden) return;
    laeuft = true; phase = (phase + 0.02) % 1;
    fig.kette = fig.kette.then(() => fig.f3d.glanzTick(phase)).catch(() => {}).finally(() => { laeuft = false; });
  }, 110);
}

/** Ziehen dreht die Figur (waagerecht: Blickwinkel, senkrecht: Neigung) */
function drehenEinrichten(canvas){
  let start = null;
  canvas.addEventListener("pointerdown", (e) => {
    start = { x:e.clientX, y:e.clientY, d:fig.f3d.drehung, n:fig.f3d.neigung };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if(!start) return;
    fig.f3d.drehen(start.d - (e.clientX - start.x) * 0.012, start.n + (e.clientY - start.y) * 0.006);
  });
  const ende = () => { start = null; };
  canvas.addEventListener("pointerup", ende);
  canvas.addEventListener("pointercancel", ende);
}

const BILD_GRENZE = Math.floor(200 * 1024 * 4 / 3);   // wie zeigen.js im Board: 200 KB als Base64
/** Bild der Figur für die Anzeige: 3D-Aufnahme, sonst 2D-Figur, als Datei null */
async function ruestungFoto(s){
  const modus = await figurModus();
  if(modus === "icons") return null;

    fig.foto3d ??= fig.erstelle3D(document.createElement("canvas"), 300, 400);

    fig.kette = lauf.catch(() => {});   // die Kette darf nie abgelehnt bleiben
    await lauf;
    fig.foto3d.drehen(-0.5, 0.14);

}

const datumLang = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE"); };
const chunkSumme = (c) => DIM_ORDER.reduce((n, d) => n + (c?.[d] || 0), 0);

function weltImportOeffnen(){

function weltImportZuruecksetzen(){

  return (wi.worker = w);
}
function weltImportDatei(datei){

    return weltImportFehler("Der Welt-Import geht nur, wenn die Companion vom Board kommt (http) – nicht als Datei geöffnet.");

function weltImportLesen(){

  weltImportRendern(true);

    hoehen:{ netherBiomY:CONFIG.netherBiomY, endBiomY:CONFIG.endBiomY } });

function weltImportAbbrechen(){

function weltImportFehler(text){

function weltImportNachricht(m){
  if(m.typ === "fortschritt"){ wi.fortschritt = m; return weltImportFortschritt(); }
  if(m.typ === "fehler") return weltImportFehler(m.text);
  wi.worker?.terminate(); wi.worker = null;
  if(m.typ === "geprueft") Object.assign(wi, { schritt:"bestaetigen", welt:m.welt });
  if(m.typ === "fertig"){
    Object.assign(wi, { schritt:"pruefliste", ergebnis:{ meta:m.meta, kacheln:m.kacheln, auswertung:null } });
    wi.dim = DIM_ORDER.find((d) => m.meta.chunks[d]) || "overworld";
  }
  weltImportRendern();
}

/** Prüfliste je Dimension: Vorschaubild (1 Pixel = 1 Chunk), häufigste Biome, Anzahl – einmal berechnet */
function wiAuswertung(){
  const e = wi.ergebnis;
  if(e.auswertung) return e.auswertung;
  const n = CONFIG.kachelChunks, je = {};
  for(const dim of DIM_ORDER){
    // erkundete Chunks [cx, cz, wert] – das Bild zeigt genau ihre Ausdehnung
    const chunks = [];
    for(const k of e.kacheln) if(k.dim === dim) kachelAusText(k.daten).forEach((wert, i) => {
      if(wert) chunks.push([k.kx * n + (i % n), k.kz * n + Math.floor(i / n), wert]);
    });
    if(!chunks.length) continue;
    let cx0 = Infinity, cx1 = -Infinity, cz0 = Infinity, cz1 = -Infinity;
    for(const [cx, cz] of chunks){ cx0 = Math.min(cx0, cx); cx1 = Math.max(cx1, cx); cz0 = Math.min(cz0, cz); cz1 = Math.max(cz1, cz); }
    const breite = cx1 - cx0 + 1, hoehe = cz1 - cz0 + 1;
    const bild = document.createElement("canvas");
    bild.width = breite; bild.height = hoehe;
    const ctx = bild.getContext("2d"), pixel = ctx.createImageData(breite, hoehe);
    const zaehler = new Map();
    for(const [cx, cz, wert] of chunks){
      const info = BIOM_INFO.get(wert - 1), name = info?.name ?? "unbekannt";
      zaehler.set(name, (zaehler.get(name) || 0) + 1);
      const f = info ? parseInt(info.farbe.slice(1), 16) : 0xe0413c;   // unbekannt: rot wie im Prüfskript
      pixel.data.set([f >> 16, (f >> 8) & 255, f & 255, 255], ((cz - cz0) * breite + (cx - cx0)) * 4);
    }
    ctx.putImageData(pixel, 0, 0);
    je[dim] = { bild:bild.toDataURL(), breite, hoehe, zaehler:[...zaehler].sort((a, b) => b[1] - a[1]),
      ausschnitt:`X ${zahl(cx0 * 16)} … ${zahl((cx1 + 1) * 16)} · Z ${zahl(cz0 * 16)} … ${zahl((cz1 + 1) * 16)}` };
  }
  return (e.auswertung = je);
}

function wiProzent(f){
  if(!f) return 0;
  const anteil = f.gesamt ? f.aktuell / f.gesamt : 0;
  return Math.round(f.phase === "oeffnen" ? 3 : f.phase === "lesen" ? 5 + anteil * 85 : 90 + anteil * 10);
}
const wiPhaseText = (f) => f?.phase === "lesen" && f.gesamt > 1
  ? `${WI_PHASEN.lesen} · Datei ${Math.min(f.aktuell + 1, f.gesamt)} von ${f.gesamt}` : WI_PHASEN[f?.phase] || WI_PHASEN.oeffnen;

function weltImportFortschritt(){

}

async function weltImportUebernehmen(){
  if(wi.sendet || !wi.ergebnis) return;
  const { meta, kacheln } = wi.ergebnis, weltId = st.weltId;
  wi.sendet = true; wi.fehler = null; weltImportRendern();
  const imp = { dateiname:wi.datei?.name || "", weltname:meta.weltname, seed:meta.seed, spielversion:meta.spielversion,
                chunks:meta.chunks, unbekannt:meta.unbekannt };
  const r = await api(`/welten/${weltId}/biome`, { method:"PUT", body:JSON.stringify({ import:imp, kacheln }) });
  wi.sendet = false;
  if(!r.ok){ wi.fehler = meldungAus(r); return weltImportRendern(); }
  biomeSetzen(weltId, r.data.import, kacheln);
  weltImportZuruecksetzen();

  toast(`Biome übernommen · ${zahl(chunkSumme(meta.chunks))} Chunks`);
}

function uebernehmen({ instanz, typ }){
  if(typ && !st.typen.some((t) => t.id === typ.id)) st.typen.push(typ);
  if(instanz){
    const alt = st.instanzen.findIndex((i) => i.id === instanz.id);
    if(alt >= 0) st.instanzen[alt] = instanz; else st.instanzen.push(instanz);
    const w = st.welten.find((x) => x.id === st.weltId); if(w && alt < 0) w.anzahl = (w.anzahl || 0) + 1;
  }
}
/** Welten holen und die zuletzt gewählte laden – false, wenn das nicht ging (z. B. abgemeldet) */
async function weltenLaden(){
  const r = await api("/orte/welten");
  if(!r.ok){ if(r.status !== 401) toast(meldungAus(r), true); return false; }
  st.welten = r.data.welten;
  if(!st.welten.some((w) => w.id === st.weltId)) st.weltId = st.welten[0]?.id || null;
  if(st.weltId) await weltLaden(st.weltId);
  return true;
}

  const r = await api(`/orte/welten/${id}`);
  if(!r.ok){ toast(meldungAus(r), true); return; }
  Object.assign(st, { weltId:id, welt:r.data.welt, dimensionen:r.data.dimensionen, typen:r.data.typen, instanzen:r.data.instanzen, filter:null });
  lsSchreiben("orte.welt", id);
  karte.neuAnpassen();
  render();
  samLaden();
  portaleLaden();
  biomeLaden();
}

$sheet.addEventListener("click", async (e) => {

  if(sd){
    standortDim = sd.dataset.standortDim;

  }
  const widim = e.target.closest("[data-wi-dim]");
  if(widim){ wi.dim = widim.dataset.wiDim; return weltImportRendern(); }
  const idim = e.target.closest("[data-import-dim]");
  if(idim){
    importFelderLesen();
    const imp = st.importe.find((x) => x.id === idim.dataset.id);
    imp.dim = idim.dataset.importDim;
    return importRendern();
  }
  if(st.sheet === "banner-editor" && bannerEditorKlick(e.target)) return;
  if((st.sheet === "ruestung" || st.sheet === "ruestung-editor") && buehneKlick(e.target)) return;
  if(st.sheet === "ruestung-editor" && ruestungEditorKlick(e.target)) return;
  const a = e.target.closest("[data-aktion]"); if(!a) return;
  const id = a.dataset.id;
  switch(a.dataset.aktion){
    case "schliessen": alleSchliessen(); break;
    case "detail": detailOeffnen(id); break;
    case "kopieren":
      try { await kopieren(a.dataset.text); toast("Kopiert"); } catch { toast("Kopieren nicht möglich", true); }
      break;
    case "loeschen-fragen": detailOeffnen(id, true); break;
    case "loeschen": {
      const r = await api(`/orte/instanzen/${id}`, { method:"DELETE" });
      if(!r.ok) return toast(meldungAus(r), true);
      st.instanzen = st.instanzen.filter((i) => i.id !== id);
      const w = st.welten.find((x) => x.id === st.weltId); if(w) w.anzahl = Math.max(0, (w.anzahl || 1) - 1);
      alleSchliessen(); toast("Gelöscht"); render();
      break;

    case "bearbeiten": bearbeitenOeffnen(id); break;
    case "bearbeiten-speichern": {
      const k = koordLesen("b"), $b = document.getElementById("bearbeitenBanner");

      const r = await api(`/orte/instanzen/${id}`, { method:"PATCH", body:JSON.stringify(k) });
      if(!r.ok) return banner($b, "bad", meldungAus(r));
      uebernehmen(r.data); render(); detailOeffnen(id); toast("Gespeichert");
      break;
    }
    case "formular-speichern": formularSpeichern(); break;
    case "import-an": {
      importFelderLesen();
      const imp = st.importe.find((x) => x.id === id); imp.an = !imp.an;
      importRendern(); break;
    }
    case "import-mehr": importFelderLesen(); $datei.click(); break;
    case "import-speichern": importSpeichern(); break;
    // Welt-Import
    case "wi-datei": $weltDatei.click(); break;
    case "wi-lesen": weltImportLesen(); break;
    case "wi-abbrechen": wi.schritt === "pruefe" ? (weltImportZuruecksetzen(), weltImportRendern()) : weltImportAbbrechen(); break;

    case "wi-uebernehmen": weltImportUebernehmen(); break;
    case "wi-loeschen":
      if(!wi.loeschen){ wi.loeschen = true; a.textContent = "Wirklich löschen?"; return; }
      weltImportLoeschen(); break;
    case "wi-welt-wechseln": await weltLaden(id); weltImportRendern(); break;
    case "wi-welt-anlegen": {
      const r = await api("/orte/welten", { method:"POST", body:JSON.stringify({ seed:wi.welt.seed }) });
      if(!r.ok){ wi.fehler = meldungAus(r); return weltImportRendern(); }

      await weltLaden(r.data.welt.id);

      if(!r.ok) return weltOeffnen(["bad", meldungAus(r)]);

    case "banner-schritt": bannerSchrittUmschalten(id, Number(a.dataset.n)); break;
    case "banner-schritte-weg": lsSchreiben(`banner.schritte.${id}`, null); bannerDetailOeffnen(id); break;
    case "banner-bearbeiten": bannerEditorOeffnen(id); break;
    case "banner-speichern": bannerSpeichern(); break;
    case "banner-abbrechen": {
      const zurueck = bn.entwurf?.id; bn.entwurf = null;
      zurueck ? bannerDetailOeffnen(zurueck) : alleSchliessen();
      break;
    }
    // Rüstung
    case "set-bearbeiten": ruestungEditorOeffnen(id); break;
    case "set-speichern": ruestungSpeichern(); break;
    case "set-abbrechen": {
      const zurueck = rs.entwurf?.id; rs.entwurf = null;
      zurueck ? ruestungDetailOeffnen(zurueck) : alleSchliessen();
      break;
    }
    case "set-loeschen":
      if(a.dataset.sicher !== "1"){ a.dataset.sicher = "1"; a.textContent = "Wirklich löschen?"; return; }
      ruestungLoeschen(id); break;
    case "zum-sammelobjekt": samDetailOeffnen(id); break;
    case "verz-auf": rs.offen = rs.offen === a.dataset.teilId ? null : a.dataset.teilId; ruestungDetailOeffnen(rs.detail); break;
    case "verz-schritt": verzSchrittUmschalten(id, a.dataset.teilId, Number(a.dataset.n)); break;
    // Board-Verbindung
    case "board-beitreten": boardBeitretenKlick(); break;
    case "board-kamera": boardScanStarten(); break;
    case "board-foto": document.getElementById("boardFoto").click(); break;
    case "board-trennen":
      boardTrennen();
      if(!DEMO.enabled) return location.replace(location.pathname);   // abgemeldet → neu beitreten
      alleSchliessen(); toast("Vom Board getrennt"); break;
    case "board-zeigen": boardZeigen(a.dataset.boardQuelle); break;
    case "board-qr": boardEinstellungenAendern({ qrZeigen:!bd.einstellungen?.qrZeigen }); break;
    case "anheften": {
      const i = st.instanzen.find((x) => x.id === id); if(!i) break;
      const r = await api(`/orte/instanzen/${id}/angeheftet`, { method:"PUT", body:JSON.stringify({ angeheftet:!i.angeheftet }) });
      if(!r.ok){ toast(meldungAus(r), true); break; }
      uebernehmen({ instanz:r.data.instanz });
      detailOeffnen(id);
      toast(r.data.instanz.angeheftet ? "Liegt groß auf der Anzeige" : "Nicht mehr angeheftet");
      break;
    }
    case "board-wegnehmen": boardWegnehmen(); break;
    // Anzeigen (Anzeige-Link für andere Geräte)
    case "anzeige-kopieren": {
      const anz = bd.anzeigen?.find((x) => x.id === id); if(!anz) break;
      try { await kopieren(anz.link); toast("Anzeige-Link kopiert"); } catch { toast("Kopieren nicht möglich", true); }
      break;
    }
    case "board-konto": {
      // Account gewählt → Name übernehmen, weiter mit der eigenen PIN
      document.getElementById("boardName").value = a.dataset.name;
      boardKontoHinweis();
      document.getElementById("boardKontoPin").focus();
      break;
    }
    case "anzeige-anordnen":
      // Widget-Dashboard vom selben Board (A6): dort Widgets dieser Anzeige anordnen, „Fertig“ führt zurück
      location.href = `/dashboard/anordnen?anzeige=${encodeURIComponent(id)}`; break;
    case "anzeige-qr":
      if(bd.anzeigeQr?.id === id) bd.anzeigeQr = null; else await anzeigeQrHolen(id);
      boardSheetRendern(); break;
    case "anzeige-umbenennen":
      bd.anzeigeUmbenennen = id; boardSheetRendern();
      document.getElementById("anzeigeName")?.focus(); break;
    case "anzeige-name-speichern": {
      const name = document.getElementById("anzeigeName").value;
      bd.anzeigeUmbenennen = null;
      await anzeigeUebernehmen(await api(`/anzeigen/${id}`, { method:"PUT", body:JSON.stringify({ name }) }));
      break;
    }
    case "anzeige-schluessel":
      // Zweimal tippen – alte Links (TV, Tablet) gehen danach nicht mehr
      if(bd.anzeigeFrage !== id){ bd.anzeigeFrage = id; a.textContent = "Alte Links ungültig?"; return; }
      bd.anzeigeFrage = null;
      await anzeigeUebernehmen(await api(`/anzeigen/${id}/schluessel`, { method:"POST" }), "Neuer Schlüssel – alte Links gelten nicht mehr");
      break;
    case "anzeige-anlegen": {
      const $n = document.getElementById("anzeigeNeu");
      await anzeigeUebernehmen(await api("/anzeigen", { method:"POST", body:JSON.stringify({ name:$n.value }) }), "Anzeige angelegt");
      break;
    }
    case "banner-loeschen":
      // Zweimal tippen – ein Bauplan ist schnell weg und für alle
      if(a.dataset.sicher !== "1"){ a.dataset.sicher = "1"; a.textContent = "Wirklich löschen?"; return; }
      bannerLoeschen(id); break;
  }
});

// Sheet: Eingaben
$sheet.addEventListener("input", (e) => {
  const t = e.target;
  if(t.dataset.koord){
    t.value = t.value.replace(/[^\d-]/g, "").replace(/(?!^)-/g, "");
    if(st.sheet === "portal-editor") portalEditorPruefen();
    return;
  }
  if(t.id === "formNeu"){ form.neu = t.value; return; }
  if(t.id === "boardPin"){
    t.value = t.value.replace(/\D/g, "").slice(0, 4);
    // Mit vollständiger Board-PIN die Accounts zum Auswählen holen
    const adresse = DEMO.enabled ? (boardQrLesen(document.getElementById("boardAdresse").value)?.adresse || boardAdresseLesen(document.getElementById("boardAdresse").value)) : location.origin;
    if(t.value.length === 4 && adresse) boardKontenLaden(adresse, t.value);
    return;
  }
  if(t.id === "boardKontoPin"){ t.value = t.value.replace(/\D/g, "").slice(0, 8); return; }
  if(t.id === "boardName"){ boardKontoHinweis(); return; }
  if(t.id === "boardAdresse"){
    // Ganze Beitritts-Adresse eingefügt („…/?pin=1234“) → in Adresse und PIN aufteilen
    const qr = boardQrLesen(t.value);
    if(qr){ t.value = adresseKurz(qr.adresse); document.getElementById("boardPin").value = qr.pin; }
    return;
  }
  if(t.id === "formEinfuegen" || t.id === "standortEinfuegen"){
    const k = koordinatenErkennen(t.value); if(!k) return;
    const p = t.id === "formEinfuegen" ? "f" : "s";
    const setze = (a, v) => { const el = $sheet.querySelector(`[data-koord="${p}${a}"]`); if(el) el.value = v ?? ""; };
    setze("X", k.x); setze("Y", k.y); setze("Z", k.z);
    if(k.dim){
      if(p === "f" && k.dim !== form.dim){ form.dim = k.dim; formularRendern(true); }
      if(p === "s"){ standortDim = k.dim; $sheet.querySelectorAll("[data-standort-dim]").forEach((b) => b.classList.toggle("active", b.dataset.standortDim === k.dim)); themaSetzen($sheet, k.dim); }
    }
  }
});
$sheet.addEventListener("change", (e) => {
  if(e.target.id === "boardFoto"){ const d = e.target.files[0]; e.target.value = ""; if(d) boardFotoLesen(d); return; }
  if(e.target.id === "boardWelt") return boardEinstellungenAendern({ aktiveWelt:e.target.value });
  if(e.target.id === "boardTitel") return boardEinstellungenAendern({ titel:e.target.value });
  if(e.target.id === "formKategorie"){ form.kategorie = e.target.value; form.variante = ""; formularRendern(true); }
  if(e.target.id === "formTyp"){ form.variante = e.target.value; formularRendern(true); }
});

// Statusleiste: echte Uhrzeit
function uhr(){ document.getElementById("uhr").textContent = new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }); }

/** Daten laden und in den gewünschten Bereich springen (?modul=…) */
async function datenStarten(){
  // Live: Gilt das Token noch? Tokens von vor den Accounts nicht – dann öffnet api() das Beitreten
  if(!DEMO.enabled && !(bd.ich = await IDENTITAET.werBistDu())) return;
  if(!(await weltenLaden())) return;
  const start = new URLSearchParams(location.search).get("modul");
  if(start && start !== "karte") modulWechseln(start);
  // Live und noch keine Welt: gleich eine anlegen lassen
  if(!DEMO.enabled && !st.welten.length) weltOeffnen(["info", "Noch keine Welt auf dem Board – leg die erste mit ihrem Seed an."]);
}
async function init(){
  sidebarBauen("karte");
  document.getElementById("kopfIcon").innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.karte}</svg>`;
  applyTheme(st.dim);
  ansichtWechseln(st.ansicht);
  uhr(); setInterval(uhr, 30000);
  DEMO.enabled = !(await betriebErkennen());
  if(!DEMO.enabled){
    // Live: Das Board ist dieser Server – eine Verbindung zu einem anderen gilt hier nicht
    if(bd.verbindung && bd.verbindung.adresse !== location.origin) bd.verbindung = null;
    renderStatus();
  }
  boardKnopfRendern();
  if(bd.verbindung) boardVerbinden();
  if(!DEMO.enabled && !bd.verbindung) return boardSheetRendern();   // erst beitreten, dann Daten
  datenStarten();
}
init();
</script>
