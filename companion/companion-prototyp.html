<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Companion · Prototyp (Karte + Sammelobjekte)</title>
<style>
/* ---- Basis: 1:1 aus modul-a-live-karte.html ---------------------------- */
/* ============================================================================
   PROTOTYP · Minecraft Companion PWA · Modul A (Live-Karte)
   ----------------------------------------------------------------------------
   Aufbau dieser Datei (zum Springen):
     CSS  :  Tokens (per JS gesetzt) → Shell-Layout → Komponenten → Karte
     JS   :  0 Konfig · 1 THEMES · 2 Welt · 3 Spieler · 4 State · 5 Theme
             6 Renderer · 7 Simulation · 8 UI/Input · 9 Init
   Bewusst eine Datei, keine Build-Tools: direkt am Handy im Browser lauffähig.
   ========================================================================== */

/* ---- Reset ---------------------------------------------------------------- */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  background:#000; color:var(--text);
  display:flex; align-items:center; justify-content:center;
  overscroll-behavior:none;
}
/* Monospace nur für Telemetrie/Koordinaten (HUD-Charakter, wie "Glance-UI"). */
.mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace; font-variant-numeric:tabular-nums; letter-spacing:.02em; }

/* ---- Geräte-Rahmen (nur Vorschau am Desktop; am Handy Vollbild) ----------- */
.device {
  position:relative; width:100%; max-width:430px; height:100dvh; max-height:932px;
  background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6);
  transition: background .45s ease;
}
@media (min-width:520px){ .device{ border-radius:42px; box-shadow:0 0 0 10px #16181d, 0 0 0 12px #2a2d34, 0 40px 90px rgba(0,0,0,.7);} }

/* ---- Status-Strip (kosmetisch, Prototyp-Chrome – beim Einbetten entfernbar) */
.statusbar { display:flex; justify-content:space-between; align-items:center;
  padding:10px 22px 2px; font-size:13px; font-weight:600; color:var(--text);
  padding-top: max(10px, env(safe-area-inset-top)); flex:0 0 auto; }
.statusbar .glyphs { display:flex; gap:6px; align-items:center; opacity:.95; }
.statusbar .batt { width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; position:relative; opacity:.9; }
.statusbar .batt::after{ content:""; position:absolute; inset:1.5px; right:7px; background:var(--text); border-radius:1px;}
.statusbar .batt::before{ content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:var(--text); border-radius:1px;}

/* ===========================================================================
   EBENE-übergreifende Shell
   ======================================================================== */

/* ---- Header --------------------------------------------------------------- */
.header { position:relative; flex:0 0 auto; padding:6px 16px 12px; display:flex; align-items:center; justify-content:center; }
.icon-btn { position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:40px; height:40px; display:grid; place-items:center; border-radius:12px;
  background:transparent; border:none; color:var(--text); cursor:pointer; transition:background .2s; }
.icon-btn:active { background:var(--surface-2); }
.burger { width:20px; height:14px; position:relative; }
.burger span, .burger::before, .burger::after { content:""; position:absolute; left:0; right:0; height:2px; background:var(--text); border-radius:2px; }
.burger span { top:6px; } .burger::before{ top:0;} .burger::after{ bottom:0;}
.title-block { text-align:center; line-height:1.15; }
.title-row { display:flex; align-items:center; gap:8px; justify-content:center; }
.title-row .compass { color:var(--accent); display:flex; transition:color .45s ease; }
.title-row h1 { font-size:21px; font-weight:700; letter-spacing:.2px; }
.subtitle { font-size:12.5px; color:var(--text-dim); margin-top:1px; }
.subtitle b { color:var(--accent); font-weight:600; transition:color .45s ease; }

/* ---- Module-Stack  ·  Container für umschaltbare Bereiche -----------------
   Alle Module liegen im DOM, aber nur das aktive (.is-active) ist sichtbar.
   Inaktive Module sind display:none → keine Render-Schleife, keine Listener
   feuern; das ist die akkuschonende Kernidee dieses Skeletts.
   Jedes Modul ist eine Flex-Column und liefert seine eigene Top Bar
   (oder lässt den Slot leer), seine Bühne und seine eigene Bottom Bar.
   ----------------------------------------------------------------------- */
.module-stack { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.module { flex:1 1 auto; display:none; flex-direction:column; min-height:0; }
.module.is-active { display:flex; }

/* Platzhalter für noch leere Module (Toolbox/Erfolge/Backups in dieser Phase). */
.module-empty { flex:1 1 auto; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; padding:24px;
  text-align:center; color:var(--text-dim); }
.module-empty .me-ico { width:54px; height:54px; border-radius:18px;
  background:var(--surface-2); border:1px solid var(--border-soft);
  display:grid; place-items:center; color:var(--accent);
  transition:background .45s ease, border-color .45s ease, color .45s ease; }
.module-empty .me-title { font-size:17px; font-weight:700; color:var(--text); margin-top:4px; }
.module-empty .me-sub { font-size:13px; max-width:280px; line-height:1.45; }

/* Bottom-Bar-Platzhalter für Module ohne eigene Aktionen (vorerst leer).
   Hält die gleiche Höhe wie .bb-item, damit das Layout beim Modul-Wechsel
   nicht springt. Die Safe-Area-Polsterung sitzt am .bottombar-Parent. */
.bb-placeholder { flex:1; display:flex; align-items:center; justify-content:center;
  min-height:62px; padding:11px 4px 14px;
  color:var(--text-faint); font-size:11.5px; }

/* ---- Toolbox-Werkzeuge  ·  generische Tool-Patterns ----------------------
   Die Toolbox enthält mehrere Werkzeuge unter Tabs. Gleiche „Stack"-Idee
   wie der Module-Stack, nur eine Ebene tiefer: alle Tools liegen im DOM,
   nur das aktive (.is-active) ist sichtbar.
   ----------------------------------------------------------------------- */
.tool-stage { flex:1 1 auto; min-height:0; overflow-y:auto;
  padding:14px 16px 22px; }
.tool { display:none; flex-direction:column; gap:18px; }
.tool.is-active { display:flex; }
.tool-head h2 { font-size:18px; font-weight:800; }
.tool-head p  { font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.45; }

/* Segment-Buttons (z. B. Richtung beim Portal-Linker). */
.tool-segment { display:flex; gap:4px; background:var(--surface-2);
  border:1px solid var(--border-soft); border-radius:14px; padding:4px;
  transition:background .45s ease, border-color .45s ease; }
.seg-btn { flex:1; border:none; background:transparent; color:var(--text-dim);
  padding:10px 4px; border-radius:11px; font-size:13px; font-weight:700;
  cursor:pointer; transition:color .2s, background .25s ease, box-shadow .25s; }
.seg-btn.active { background:var(--accent); color:var(--accent-ink);
  box-shadow:0 4px 12px var(--accent-soft); }

/* Gruppen + Inputs. Mobile-First: große Touch-Targets, Monospace für Zahlen. */
.field-group { display:flex; flex-direction:column; gap:8px; }
.field-group-label { font-size:10.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-faint); padding-left:2px; }
.field-grid    { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.field-grid.g3 { grid-template-columns:1fr 1fr 1fr; }
.field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.field-label { font-size:10px; font-weight:700; letter-spacing:.14em;
  color:var(--text-faint); padding-left:4px; }
.field input { font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums; font-size:16px; font-weight:600;
  padding:12px 12px; border-radius:12px;
  background:var(--surface-2); border:1px solid var(--border-soft);
  color:var(--text); width:100%; box-sizing:border-box;
  transition:border-color .2s, background .45s ease;
  /* iOS: kein Zoom beim Fokus, Anhebung des Inputs unterdrücken */
  -webkit-appearance:none; appearance:none; }
.field input:focus { outline:none; border-color:var(--accent); }
/* Spinner-Pfeile auf Desktop verstecken – am Handy gibt’s sie sowieso nicht. */
.field input::-webkit-outer-spin-button,
.field input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.field input[type=number] { -moz-appearance:textfield; }

/* Ergebnis-Karten. */
.result-card { background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:16px; padding:14px 16px; display:flex; flex-direction:column;
  gap:10px; transition:background .45s ease, border-color .45s ease; }
.result-label { font-size:10.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-faint); }
.result-label b { color:var(--accent); font-weight:700; transition:color .45s ease; }
.result-coords { display:flex; gap:22px; font-size:19px; font-weight:600; }
.result-coords .lbl { color:var(--text-faint); margin-right:4px; font-weight:700; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
.result-coords b { color:var(--accent); transition:color .45s ease; }
.result-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.result-row .rname { font-size:13px; color:var(--text-dim); }
.result-row .rval  { font-size:22px; font-weight:700; color:var(--accent); transition:color .45s ease; }
.result-row .runit { font-size:13px; color:var(--text-faint); margin-left:4px; font-weight:600; }
.result-hint { font-size:12px; color:var(--text-faint); line-height:1.45; }

/* Ampel-Status (Ideal / Grenzwertig / Zu nah / Zu weit). Festfarben –
   bleiben auch bei Theme-Wechsel intuitiv lesbar. */
.result-status { font-size:12.5px; font-weight:700; padding:6px 11px;
  border-radius:10px; display:inline-block; align-self:flex-start;
  letter-spacing:.02em; }
.result-status.ok   { background:rgba(58,209,122,.16); color:#5fe09a; }
.result-status.warn { background:rgba(232,180,68,.16); color:#f0c468; }
.result-status.bad  { background:rgba(232,68,60,.16);  color:#ff8278; }

/* ---- Welt-Verwaltung  ·  Backups + Restore-Tickets ----------------------
   Eigene Klassen-Familie, weil das Backups-Modul ein eigenes Sub-Tab-System
   bekommt (Backups | Tickets) und Listen mit Aktionen rendert. Die Stack-
   Idee ist dieselbe wie bei den Toolbox-Werkzeugen: alle Panes im DOM, nur
   das aktive ist sichtbar.
   ----------------------------------------------------------------------- */
.bk-stage { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 22px; }
.bk-pane  { display:none; flex-direction:column; gap:14px; }
.bk-pane.is-active { display:flex; }

/* Erstellen-Zeile (Label-Input + Button) */
.create-row    { display:flex; flex-direction:column; gap:8px; }
.create-row .input-line { display:flex; gap:8px; align-items:stretch; }
.create-row input { flex:1 1 auto; min-width:0;
  font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  font-size:15px; padding:11px 12px; border-radius:12px;
  background:var(--surface-2); border:1px solid var(--border-soft);
  color:var(--text); -webkit-appearance:none; appearance:none;
  transition:border-color .2s, background .45s ease; }
.create-row input:focus { outline:none; border-color:var(--accent); }

/* Buttons – einheitliche Familie. */
.btn-primary, .btn-secondary, .btn-danger {
  border:none; border-radius:12px; font-weight:700; font-size:13.5px;
  cursor:pointer; padding:11px 14px; flex:0 0 auto;
  transition:opacity .2s, transform .1s, background .25s ease, color .25s ease; }
.btn-primary { background:var(--accent); color:var(--accent-ink);
  box-shadow:0 3px 10px var(--accent-soft); }
.btn-secondary { background:var(--surface-2); color:var(--text);
  border:1px solid var(--border-soft); font-weight:600; padding:10px 13px; border-radius:11px; }
.btn-danger { background:rgba(232,68,60,.16); color:#ff8278; font-weight:700; padding:10px 13px; border-radius:11px; }
.btn-primary:active, .btn-secondary:active, .btn-danger:active { transform:translateY(1px); }
.btn-primary:disabled, .btn-secondary:disabled, .btn-danger:disabled {
  opacity:.55; cursor:not-allowed; box-shadow:none; }

/* Status-Banner (Inline-Feedback). Festfarben für klare Ampel-Lesbarkeit. */
.banner { padding:10px 13px; border-radius:12px; font-size:12.5px; line-height:1.45; }
.banner[hidden] { display:none; }
.banner.ok   { background:rgba(58,209,122,.14); color:#5fe09a; }
.banner.warn { background:rgba(232,180,68,.14); color:#f0c468; }
.banner.bad  { background:rgba(232,68,60,.14);  color:#ff8278; }
.banner.info { background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border-soft); }

/* Listen-Karten (Backups + Tickets teilen sich die Basis). */
.list-stack { display:flex; flex-direction:column; gap:10px; }
.card { background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:14px; padding:13px 14px; display:flex; flex-direction:column; gap:8px;
  transition:background .45s ease, border-color .45s ease; }
.card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card-title { font-size:14.5px; font-weight:700; word-break:break-word; line-height:1.3; }
.card-meta  { font-size:11.5px; color:var(--text-faint); font-weight:600; margin-top:2px; }
.card-actions { display:flex; gap:8px; flex-wrap:wrap; }
.card-quote { font-size:13px; color:var(--text-dim); padding:6px 10px;
  border-left:3px solid var(--border-soft); line-height:1.4; word-break:break-word; }

/* Restore-Eingabeformular klappt unter der Backup-Karte auf. */
.restore-form { display:none; flex-direction:column; gap:8px;
  padding-top:10px; border-top:1px solid var(--border-soft); margin-top:2px; }
.card.expanded .restore-form { display:flex; }
.restore-form textarea { width:100%; min-height:64px; resize:vertical;
  font-family:inherit; font-size:14px; padding:10px 12px; border-radius:11px;
  background:var(--bg); border:1px solid var(--border-soft); color:var(--text);
  box-sizing:border-box; transition:border-color .2s; }
.restore-form textarea:focus { outline:none; border-color:var(--accent); }
.restore-form .row { display:flex; gap:8px; justify-content:flex-end; }

/* Ticket-Status-Pille. */
.tk-pill { font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:8px;
  text-transform:uppercase; letter-spacing:.1em; flex:0 0 auto; align-self:flex-start; }
.tk-pill.open     { background:rgba(232,180,68,.18); color:#f0c468; }
.tk-pill.approved { background:rgba(58,209,122,.18); color:#5fe09a; }
.tk-pill.rejected { background:rgba(232,68,60,.18);  color:#ff8278; }

/* Leere Listen */
.empty-list { padding:32px 16px; text-align:center; color:var(--text-faint);
  font-size:13px; line-height:1.5; }

/* ---- Zugänge  ·  Admin-only Rollen-Verwaltung ----------------------------
   Liste der bekannten User aus users.json + Rollen-Selektor pro Reihe.
   Rolle wird per POST /admin/users/:id/role gesetzt und überschreibt die
   Anfangsrolle aus users.json (Override liegt in data/store.json).
   ----------------------------------------------------------------------- */
.ax-stage { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 22px; }
.ax-pane  { display:none; flex-direction:column; gap:10px; }
.ax-pane.is-active { display:flex; }

.ax-row { background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:14px; padding:12px 14px; display:flex; flex-direction:column;
  gap:10px; transition:background .45s ease, border-color .45s ease; }
.ax-row.is-self { border-color:var(--accent); }
.ax-row .ax-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.ax-row .ax-name { font-size:15px; font-weight:700; color:var(--text); }
.ax-row .ax-id   { font-size:11px; color:var(--text-faint);
  font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; }
.ax-row .ax-base { margin-left:auto; font-size:11px; color:var(--text-faint); }
.ax-row .ax-base b { color:var(--text-dim); font-weight:600; }

/* Vier-Wege-Segment für die Rollen-Wahl (kompakt, Daumen-freundlich). */
.ax-roles { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px;
  background:var(--surface-3); border:1px solid var(--border-soft);
  border-radius:11px; padding:4px;
  transition:background .45s ease, border-color .45s ease; }
.ax-role { border:none; background:transparent; color:var(--text-dim);
  font-size:12px; font-weight:700; padding:8px 4px; border-radius:8px;
  cursor:pointer; transition:color .2s, background .25s ease; }
.ax-role:hover:not(.active):not(:disabled) { color:var(--text); }
.ax-role.active { background:var(--accent); color:var(--accent-ink); }
.ax-role:disabled { opacity:.4; cursor:not-allowed; }

.ax-row .ax-foot { display:flex; align-items:center; gap:10px;
  font-size:11.5px; color:var(--text-faint); min-height:14px; }
.ax-row .ax-foot .ax-reset {
  margin-left:auto; border:none; background:transparent; color:var(--text-dim);
  font-size:11.5px; font-weight:600; cursor:pointer; padding:2px 4px; }
.ax-row .ax-foot .ax-reset:hover { color:var(--accent); }
.ax-row.is-overridden .ax-foot::before { content:"●"; color:var(--accent); }

/* Audit-Log */
.ax-log-item { padding:9px 12px; background:var(--surface-2);
  border:1px solid var(--border-soft); border-radius:11px;
  display:flex; flex-direction:column; gap:4px;
  transition:background .45s ease, border-color .45s ease; }
.ax-log-when { font-size:10.5px; color:var(--text-faint);
  font-family:ui-monospace,"SF Mono",monospace; }
.ax-log-text { font-size:12.5px; color:var(--text-dim); line-height:1.4; }
.ax-log-text b { color:var(--text); font-weight:700; }
.ax-log-text .ax-arrow { color:var(--accent); margin:0 4px; }

/* ---- EBENE 2 · Top-Bar (Dimensions-Reiter als Segment-Pills) -------------- */
.tabs-wrap { flex:0 0 auto; padding:2px 16px 12px; }
.tabs { display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:16px; padding:5px; transition:background .45s ease, border-color .45s ease; }
.tab { flex:1; border:none; background:transparent; color:var(--text-dim);
  font-size:15px; font-weight:700; padding:11px 6px; border-radius:12px; cursor:pointer;
  transition:color .2s, background .25s ease, box-shadow .25s; }
.tab.active { background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px var(--accent-soft); }

/* ---- Karten-Bühne (Canvas füllt den Inhaltsbereich) ---------------------- */
.stage { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
#map { display:block; width:100%; height:100%; touch-action:none; }
/* Sanfte Vignette für Tiefe; rein dekorativ, blockiert keine Eingaben. */
.vignette { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 42%, transparent 55%, rgba(0,0,0,.42) 100%); }

/* ---- HUD-Chips (Layout-Sprache aus dem Screenshot: Karten/Badges) -------- */
.hud { position:absolute; inset:0; pointer-events:none; padding:14px; }
.chip { display:inline-flex; align-items:center; gap:8px; pointer-events:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:9px 12px; box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:background .45s ease, border-color .45s ease; }
.hud-tl { position:absolute; top:14px; left:14px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.coord { font-size:13px; }
.coord .lbl { color:var(--text-faint); font-weight:700; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; margin-right:2px; }
.coord .v { color:var(--text); font-weight:600; }
.coord .v + .lbl { margin-left:8px; }
.portal-chip .pico { color:var(--accent); transition:color .45s ease; }
.portal-chip { font-size:12.5px; color:var(--text-dim); }
.portal-chip b { color:var(--text); }

.hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 18px; max-width:78%; text-align:center; font-size:13.5px; color:var(--text-dim);
  box-shadow:0 10px 30px rgba(0,0,0,.45); display:none; }
.hint.show { display:block; }
.hint b { color:var(--accent); }

.recenter { position:absolute; right:14px; bottom:14px; pointer-events:auto;
  display:none; align-items:center; gap:7px; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:11px 14px; font-weight:700; font-size:13px; box-shadow:0 6px 20px var(--accent-soft); }
.recenter.show { display:inline-flex; }

/* Struktur-Tooltip ·  beim Tap auf einen Strukturen-Marker auf der Karte.
   Position wird per JS gesetzt; verschwindet bei Re-Tap oder nach 2s. */
.struct-tip { position:absolute; pointer-events:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:11px;
  padding:7px 11px; font-size:12px; color:var(--text); font-weight:600;
  white-space:nowrap; transform:translate(-50%, -120%); display:none;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
  transition:background .45s ease, border-color .45s ease; }
.struct-tip.show { display:inline-flex; align-items:center; gap:7px; }
.struct-tip .stype { color:var(--accent); font-weight:700; }
.struct-tip .scoord { color:var(--text-faint); font-family:ui-monospace,"SF Mono",monospace; }

/* ---- EBENE 3 · Bottom-Bar (App-Globals) ---------------------------------- */
.bottombar { flex:0 0 auto; display:flex; background:var(--surface);
  border-top:1px solid var(--border-soft); transition:background .45s ease, border-color .45s ease;
  padding-bottom: env(safe-area-inset-bottom); position:relative; z-index:5; }
.bb-item { flex:1; border:none; background:transparent; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:11px 4px 14px;
  color:var(--text-faint); position:relative; transition:color .2s; }
.bb-item .ico { display:flex; }
.bb-item .lab { font-size:11px; font-weight:600; }
.bb-item.active { color:var(--accent); }
.bb-item.active::before { content:""; position:absolute; top:0; left:22%; right:22%; height:2px;
  background:var(--accent); border-radius:2px; box-shadow:0 0 10px 1px var(--accent); }
.status-dot { width:7px; height:7px; border-radius:50%; background:#3ad17a; box-shadow:0 0 8px #3ad17a; }
.status-dot.off { background:#e0413c; box-shadow:0 0 8px #e0413c; }

/* ---- EBENE 1 · Sidebar (Haupt-Bereiche) ---------------------------------- */
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; visibility:hidden;
  transition:opacity .28s ease, visibility .28s; z-index:20; }
.scrim.show { opacity:1; visibility:visible; }
.sidebar { position:absolute; top:0; bottom:0; left:0; width:78%; max-width:320px; z-index:21;
  background:var(--surface); border-right:1px solid var(--border); transform:translateX(-103%);
  transition:transform .3s cubic-bezier(.22,.61,.36,1), background .45s ease;
  display:flex; flex-direction:column; padding-top: env(safe-area-inset-top); }
.sidebar.open { transform:translateX(0); box-shadow:24px 0 60px rgba(0,0,0,.5); }
.sb-head { padding:24px 22px 18px; border-bottom:1px solid var(--border-soft); }
.sb-head .kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-faint); font-weight:700; }
.sb-head .name { font-size:19px; font-weight:800; margin-top:3px; }
.sb-nav { padding:12px; display:flex; flex-direction:column; gap:4px; }
.nav-item { display:flex; align-items:center; gap:13px; padding:14px 14px; border-radius:14px;
  background:transparent; border:none; color:var(--text-dim); cursor:pointer; text-align:left; font-size:15.5px; font-weight:600; }
.nav-item .ico { color:var(--text-faint); display:flex; }
.nav-item.active { background:var(--surface-2); color:var(--text); }
.nav-item.active .ico { color:var(--accent); }
.nav-item.soon { opacity:.5; cursor:default; }
.nav-item .soon-tag { margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.08em;
  background:var(--surface-3); color:var(--text-dim); padding:3px 7px; border-radius:7px; }

/* ---- Bottom-Sheets (Spieler & Optionen) ---------------------------------- */
.sheet { position:absolute; left:0; right:0; bottom:0; z-index:21;
  background:var(--surface); border-top:1px solid var(--border);
  border-radius:22px 22px 0 0; transform:translateY(103%);
  transition:transform .3s cubic-bezier(.22,.61,.36,1), background .45s ease;
  padding:8px 18px max(20px, env(safe-area-inset-bottom)); max-height:74%; overflow-y:auto; }
.sheet.open { transform:translateY(0); box-shadow:0 -20px 60px rgba(0,0,0,.5); }
.sheet .grabber { width:38px; height:4px; border-radius:3px; background:var(--border); margin:8px auto 14px; }
.sheet h2 { font-size:17px; font-weight:800; margin-bottom:2px; }
.sheet .sub { font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }

/* Spieler-Reihe */
.prow { display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:14px;
  background:var(--surface-2); border:1px solid transparent; margin-bottom:8px; cursor:pointer; }
.prow.tracked { border-color:var(--accent); }
.pdot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px currentColor; }
.prow .pname { font-weight:700; font-size:15px; }
.prow .pmeta { font-size:11.5px; color:var(--text-dim); margin-top:1px; }
.prow .dim-chip { margin-left:auto; font-size:11px; font-weight:700; padding:5px 9px; border-radius:9px;
  background:var(--surface-3); color:var(--text-dim); white-space:nowrap; }
.prow .pcoord { font-size:11.5px; color:var(--text-faint); }

/* Optionen-Schalter */
.opt { display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--border-soft); }
.opt:last-child { border-bottom:none; }
.opt .otext { flex:1; }
.opt .oname { font-size:15px; font-weight:600; }
.opt .odesc { font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.switch { width:46px; height:28px; border-radius:16px; background:var(--surface-3);
  border:1px solid var(--border); position:relative; cursor:pointer; flex:0 0 auto; transition:background .2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
  background:var(--text-dim); transition:transform .2s, background .2s; }
.switch.on { background:var(--accent-soft); border-color:var(--accent); }
.switch.on::after { transform:translateX(18px); background:var(--accent); }

/* ---- Portal-/Morph-Schleier ---------------------------------------------- */
.veil { position:absolute; inset:0; z-index:30; pointer-events:none; opacity:0; }

/* ============================================================================
   ERFOLGE  ·  Xbox-Live-Matrix pro Spieler
   ----------------------------------------------------------------------------
   Header-Meter (errungen / Gamerscore / Prozent), Fortschritts-Balken,
   Filter-Pillen, Kategorien-Akkordion mit Achievement-Reihen.
   ========================================================================== */
.ach-stage { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 14px 4px;
  display:flex; flex-direction:column; gap:14px; }

/* Spieler-Reiter (horizontal scrollbar bei vielen Spielern) */
.tabs.scroll { overflow-x:auto; scroll-snap-type:x mandatory; flex-wrap:nowrap; }
.tabs.scroll::-webkit-scrollbar { display:none; }
.tabs.scroll .tab { flex:0 0 auto; padding:11px 14px; scroll-snap-align:start;
  font-size:14px; white-space:nowrap; }
.tabs.scroll .tab .pdot { width:8px; height:8px; border-radius:50%; display:inline-block;
  margin-right:7px; vertical-align:middle; }

/* Header mit drei Zahlen-Metern */
.ach-header { background:var(--surface); border:1px solid var(--border-soft);
  border-radius:16px; padding:14px 14px 12px; }
.ach-header-row { display:flex; justify-content:space-between; align-items:flex-end;
  gap:10px; margin-bottom:12px; }
.ach-meter { text-align:center; flex:1; }
.ach-meter-num { font-size:13px; color:var(--text-dim); font-weight:600; }
.ach-meter-num b { font-size:26px; color:var(--text); font-weight:800; line-height:1; letter-spacing:-.02em; }
.ach-meter-num span { margin-left:2px; }
.ach-meter-lbl { font-size:10.5px; color:var(--text-faint); text-transform:uppercase;
  letter-spacing:.12em; font-weight:700; margin-top:4px; }
.ach-bar { height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; }
.ach-bar span { display:block; height:100%; background:var(--accent);
  border-radius:3px; transition:width .4s ease, background .45s ease;
  box-shadow:0 0 12px var(--accent-soft); }

/* Filter-Pillen (gleiche Optik wie das Toolbox-Segment) */
.ach-filter { display:flex; gap:6px; background:var(--surface-2);
  border:1px solid var(--border-soft); border-radius:14px; padding:4px; }
.ach-filter .seg-btn { flex:1; border:none; background:transparent; color:var(--text-dim);
  font-size:13px; font-weight:700; padding:9px 4px; border-radius:10px; cursor:pointer;
  transition:background .2s, color .2s; }
.ach-filter .seg-btn.active { background:var(--accent); color:var(--accent-ink); }

/* Achievement-Liste – Kategorien als Akkordion */
.ach-list { display:flex; flex-direction:column; gap:10px; padding-bottom:14px; }
.ach-cat { background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:14px; overflow:hidden; }
.ach-cat-head { display:flex; align-items:center; gap:10px; padding:12px 14px;
  cursor:pointer; user-select:none; }
.ach-cat-icon { width:30px; height:30px; border-radius:9px;
  display:grid; place-items:center; background:var(--surface-3); font-size:16px; flex:0 0 auto; }
.ach-cat-name { flex:1; font-size:14.5px; font-weight:700; }
.ach-cat-count { font-size:12px; color:var(--text-dim); font-weight:700; font-variant-numeric:tabular-nums; margin-right:6px; }
.ach-cat-chevron { color:var(--text-faint); transition:transform .25s; display:flex; }
.ach-cat.open .ach-cat-chevron { transform:rotate(180deg); }
.ach-cat-items { display:none; border-top:1px solid var(--border-soft); }
.ach-cat.open .ach-cat-items { display:block; }

/* Einzelnes Achievement */
.ach-item { display:flex; gap:11px; padding:11px 14px;
  border-top:1px solid var(--border-soft); align-items:flex-start; }
.ach-item:first-child { border-top:none; }
.ach-item .ach-icon { width:34px; height:34px; border-radius:9px; flex:0 0 auto;
  display:grid; place-items:center; font-size:17px;
  background:var(--surface-3); color:var(--text-faint);
  border:1px solid var(--border-soft); }
.ach-item.earned .ach-icon { background:var(--accent-soft); color:var(--accent);
  border-color:var(--accent); }
/* Pixel-Icons aus dem Rüstungs-Baukasten (16×16) – scharf vergrößert */
.item-bild { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
.ach-item .ach-icon .item-bild { width:26px; height:26px; }
.ach-item:not(.earned) .ach-icon .item-bild { opacity:.5; filter:grayscale(.7); }
.sheet-kopf-bild .item-bild { width:34px; height:34px; }
.ach-item .ach-body { flex:1; min-width:0; }
.ach-item .ach-name { font-size:14px; font-weight:700; color:var(--text-dim);
  line-height:1.3; }
.ach-item.earned .ach-name { color:var(--text); }
.ach-item .ach-desc { font-size:12px; color:var(--text-faint); line-height:1.4; margin-top:2px; }
.ach-item .ach-foot { display:flex; align-items:center; gap:8px; margin-top:5px;
  font-size:11px; color:var(--text-faint); }
.ach-item .ach-score { font-weight:800; font-family:ui-monospace, monospace;
  color:var(--text-dim); }
.ach-item.earned .ach-score { color:var(--accent); }
.ach-item .ach-date { font-variant-numeric:tabular-nums; }

/* ============================================================================
   KARTE · KOORDINATEN-SAMMLUNG  ·  eigene Klassen (Rest aus der Basis oben)
   ----------------------------------------------------------------------------
   Aufbau:  Umschalter Liste/Karte → Bühne (Liste) → Karte → Kategorie-
            Akkordion → Sheets (Detail, Eintragen, Import, Welt, Standort)
   ========================================================================== */

/* ---- Umschalter Liste | Karte (unter den Dimensions-Reitern) ------------ */
.ansicht-wrap { flex:0 0 auto; padding:0 16px 12px; display:flex; gap:8px; align-items:center; }
.ansicht-wrap .tool-segment { flex:1; }
.ansicht-wrap .seg-btn { padding:8px 4px; display:flex; align-items:center; justify-content:center; gap:6px; }

/* ---- Bühne: Liste ---------------------------------------------------------- */
.orte-stage { flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 16px 22px;
  display:flex; flex-direction:column; gap:12px; }
.orte-stage > * { flex-shrink:0; }
.orte-stage[hidden], .karte-stage[hidden] { display:none; }

.orte-hud { display:flex; flex-wrap:wrap; gap:8px; }
.orte-hud .chip { cursor:pointer; box-shadow:none; background:var(--surface-2); border-color:var(--border-soft); }
.chip.leer { border-style:dashed; color:var(--text-dim); font-size:12.5px; font-weight:600; }
.chip.leer svg { color:var(--accent); }

.orte-suche { position:relative; }
.orte-suche svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-faint); pointer-events:none; }
.orte-eingabe { width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px;
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text);
  -webkit-appearance:none; appearance:none; outline:none;
  transition:border-color .2s, background .45s ease; }
.orte-eingabe:focus { border-color:var(--accent); }
.orte-eingabe::placeholder { color:var(--text-faint); }
.orte-suche .orte-eingabe { padding-left:40px; }
select.orte-eingabe { padding-right:34px;
  background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
.orte-eingabe.mono { font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; font-size:14px; }

.orte-filter { overflow-x:auto; scrollbar-width:none; }
.orte-filter::-webkit-scrollbar { display:none; }
.orte-filter .seg-btn { flex:0 0 auto; padding:9px 12px; white-space:nowrap; }
.orte-filter .zahl { font-family:ui-monospace,monospace; font-size:11px; opacity:.7; margin-left:4px; }
.tab .zahl { font-family:ui-monospace,monospace; font-size:12px; opacity:.7; margin-left:6px; }

/* ---- Kategorie-Akkordion (Muster wie .ach-cat im Erfolge-Modul) ---------- */
.orte-liste { display:flex; flex-direction:column; gap:10px; }
.ort-kat { background:var(--surface-2); border:1px solid var(--border-soft); border-radius:14px; overflow:hidden;
  transition:background .45s ease, border-color .45s ease; }
.ort-kat-head { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none; }
.ort-kat-icon { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
  background:var(--accent-soft); color:var(--accent); font-family:ui-monospace,monospace; font-weight:700; font-size:15px;
  transition:background .45s ease, color .45s ease; }
/* Kennblock der Struktur (PNG, STRUKTUREN); ohne Bild steht das Symbol im selben Kasten */
.kennblock { width:30px; height:30px; object-fit:contain; display:block;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
.ort-kat-icon .kennblock { width:24px; height:24px; }
.ort-kat-name { flex:1; font-size:14.5px; font-weight:700; }
.ort-kat-count { font-size:12px; color:var(--text-dim); font-weight:700; font-variant-numeric:tabular-nums; margin-right:6px; }
.ort-kat-chevron { color:var(--text-faint); transition:transform .25s; display:flex; }
.ort-kat.open .ort-kat-chevron { transform:rotate(180deg); }
.ort-kat-items { display:none; border-top:1px solid var(--border-soft); }
.ort-kat.open .ort-kat-items { display:block; }
.ort-typ { padding:10px 14px 2px; font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.ort-typ ~ .ort-typ { border-top:1px solid var(--border-soft); margin-top:4px; }
.ort-zeile { display:grid; grid-template-columns:1fr auto; gap:3px 10px; width:100%; text-align:left;
  padding:10px 14px; background:transparent; border:none; color:var(--text); cursor:pointer; font:inherit; }
.ort-zeile + .ort-zeile { border-top:1px solid var(--border-soft); }
.ort-zeile:active { background:var(--surface-3); }
.ort-zeile .coord { font-size:13px; }
.ort-zeile .ort-portal { font-size:11px; color:var(--text-faint); }
.ort-zeile .ort-portal .pico { color:var(--accent); }
.ort-weg { grid-row:1 / 3; grid-column:2; text-align:right; align-self:center; }
.ort-weg b { display:block; color:var(--accent); font-size:14px; font-family:ui-monospace,monospace; transition:color .45s ease; }
.ort-weg span { font-size:11px; color:var(--text-faint); font-weight:700; }

/* ---- Karte ----------------------------------------------------------------- */
.karte-stage { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
#ortKarte { display:block; width:100%; height:100%; touch-action:none; }
.karte-knoepfe { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; }
.karte-knoepfe button { width:44px; height:44px; border-radius:14px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:20px; font-weight:700; display:grid; place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35); cursor:pointer; }
.karte-legende { position:absolute; left:14px; bottom:14px; right:74px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
.karte-legende .chip { padding:6px 9px; font-size:11px; font-weight:600; gap:6px; box-shadow:none; }
.karte-legende i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.karte-hinweis { position:absolute; left:14px; top:14px; right:14px; pointer-events:none; }
.karte-hinweis .chip { font-size:12px; color:var(--text-dim); box-shadow:none; }
.karte-legende .chip.tipp { flex-basis:100%; width:max-content; max-width:100%; color:var(--text); border-color:var(--accent); }
.karte-knoepfe button[hidden] { display:none; }
.karte-knoepfe button[aria-pressed="false"] { color:var(--text-faint); }
.karte-knoepfe button[aria-pressed="true"] svg { color:var(--accent); }
/* Welt-Import */
.wi-anleitung ol { margin:6px 0 0; padding-left:20px; display:grid; gap:6px; font-size:14px; line-height:1.4; }
.wi-anleitung .pfad { font-family:ui-monospace, monospace; font-size:12.5px; color:var(--text-dim); }
.wi-balken { height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
.wi-balken span { display:block; height:100%; background:var(--accent); transition:width .2s; }
.wi-vorschau { display:block; width:100%; max-height:260px; object-fit:contain; image-rendering:pixelated;
  background:var(--surface-2); border-radius:12px; border:1px solid var(--border-soft); }
.wi-biome { display:grid; gap:5px; font-size:13px; }
.wi-biome div { display:flex; align-items:center; gap:8px; }
.wi-biome i { width:11px; height:11px; border-radius:3px; flex:0 0 auto; }
.wi-biome b { margin-left:auto; font-weight:600; color:var(--text-dim); }

/* ---- Sheets ---------------------------------------------------------------- */
.orte-sheet { max-height:88%; padding-bottom:0; color:var(--text); }
.sheet-kopf { display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.sheet-kopf .titel { flex:1; min-width:0; }
.sheet-kopf h2 { margin-bottom:2px; word-break:break-word; }
.sheet-kopf .sub { margin-bottom:0; }
.sheet-kopf .icon-btn { position:static; transform:none; margin:-8px -10px 0 0; }
.sheet-kopf-bild { width:44px; height:44px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); font:700 19px ui-monospace,monospace; }
.sheet-kopf-bild .kennblock { width:34px; height:34px; }
.orte-inhalt { display:flex; flex-direction:column; gap:16px; padding-bottom:16px; }
.sheet-fuss { position:sticky; bottom:0; display:flex; gap:8px; align-items:stretch;
  padding:12px 0 max(16px, env(safe-area-inset-bottom)); background:var(--surface);
  border-top:1px solid var(--border-soft); transition:background .45s ease; }
.sheet-fuss .btn-primary { flex:1; }
.knopf-raster { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.anzeige-anordnen { width:100%; margin-bottom:8px; }
.konto-liste { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip.konto { cursor:pointer; background:var(--surface-2); border-color:var(--border-soft); font-weight:600; }
.knopf-raster button { display:flex; align-items:center; justify-content:center; gap:7px; min-height:44px; }
.btn-primary, .btn-secondary, .btn-danger { min-height:44px; }

/* Koordinaten-Eingabe mit ±-Taste (iOS-Zifferntastatur hat kein Minus) */
.koord-in { position:relative; display:block; }
.field .koord-in input { padding-right:36px; }
.koord-in .vz { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:28px; height:34px;
  border:none; border-radius:9px; background:var(--surface-3); color:var(--text-dim);
  font-family:ui-monospace,monospace; font-weight:700; font-size:15px; cursor:pointer; }
.koord-in .vz:active { color:var(--accent); }
.card .field input, .card .orte-eingabe, .card .tool-segment { background:var(--surface); }
.card .koord-in .vz { background:var(--surface-2); }

/* Screenshot-Prüfliste */
.card.aus { opacity:.55; }
.imp-kopf { display:flex; gap:11px; align-items:center; }
.imp-kopf > img { width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--surface-3);
  border:1px solid var(--border-soft); flex:0 0 auto; }
.imp-kopf .text { flex:1; min-width:0; }
.imp-kennblock { display:inline-grid; place-items:center; width:20px; height:20px; margin-right:6px; vertical-align:-4px;
  color:var(--accent); font:700 13px ui-monospace,monospace; }
.imp-kennblock .kennblock { width:20px; height:20px; }
.imp-banner { display:flex; gap:14px; align-items:flex-start; }
.imp-banner .banner-rahmen { flex:0 0 auto; }
.imp-schritte { margin:0; padding-left:20px; font-size:13px; line-height:1.55; color:var(--text-dim); }
.imp-schritte li:first-child { color:var(--text); font-weight:600; }
.imp-kopf .card-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
.pill { font-size:10px; font-weight:800; padding:3px 8px; border-radius:7px; text-transform:uppercase; letter-spacing:.1em;
  background:var(--accent-soft); color:var(--accent); }
.dreher { width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%;
  animation:drehen .8s linear infinite; display:inline-block; vertical-align:-2px; margin-right:6px; }
@keyframes drehen { to { transform:rotate(360deg); } }
button.switch { padding:0; }

/* Welt-Auswahl */
.welt-zeile { display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; font:inherit; color:var(--text); }
.welt-zeile.aktiv { border-color:var(--accent); }
.welt-zeile .seed { font-family:ui-monospace,monospace; font-size:13.5px; font-weight:600; word-break:break-all; }

/* ---- Sammelobjekte (nutzt .ach-* aus dem Erfolge-Modul) ------------------ */
.ach-cat .ach-cat-icon { width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-family:ui-monospace,monospace; font-weight:700; }
.ach-cat .ach-cat-dim { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-left:8px; }
.ach-cat .ach-cat-name .en { display:block; font-size:11.5px; font-weight:600; color:var(--text-faint); margin-top:1px; }
.sam-fundort-bild .kennblock { width:40px; height:40px; }
.sam-fundort-kopf { display:flex; align-items:center; gap:12px; }
.sam-fundort-kopf .card-title { font-size:17px; }
.sam-fundort-bild { width:52px; height:52px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); font:700 22px ui-monospace,monospace; }
.sam-item { cursor:pointer; align-items:center; }
.sam-item:active { background:var(--surface-3); }
.sam-item .en { font-weight:600; color:var(--text-faint); font-size:11.5px; margin-left:6px; }
.sam-item .ach-foot .weg { color:var(--accent); font-family:ui-monospace,monospace; font-weight:700; }
.sam-item .ach-foot .von { color:var(--text-dim); }
.sam-check { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--border); background:transparent;
  color:transparent; display:grid; place-items:center; flex:0 0 auto; cursor:pointer; padding:0;
  transition:background .2s, border-color .2s, color .2s; }
.sam-check svg { width:18px; height:18px; }
.ach-item.earned .sam-check { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
/* Reiter der Sammelobjekte; Bereiche ohne Inhalt zeigen „Bald verfügbar“ */
#moduleSammel [hidden] { display:none !important; }
.sam-reiter-wrap { padding-top:12px; padding-bottom:0; }
.sam-reiter-wrap + .ach-stage { padding-top:12px; }
.sam-reiter .tab { font-size:14px; padding:10px 2px; white-space:nowrap; min-width:0; }
.sam-bald { padding:48px 16px; }
.sam-bald .en { color:var(--text-faint); font-size:12px; }
/* Zier-Übersicht im Kopf: alle Besätze, je 2 untereinander, Haken über dem Symbol */
.sam-uebersicht { display:grid; grid-template-rows:repeat(2, auto); grid-auto-flow:column; grid-auto-columns:1fr;
  gap:7px 6px; margin-top:14px; padding-top:6px; }
.sam-zier { position:relative; aspect-ratio:1; min-width:0; padding:0; border-radius:9px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--border-soft); display:grid; place-items:center;
  transition:background .2s, border-color .2s; }
.sam-zier:active { transform:scale(.94); }
.sam-zier .item-bild { width:72%; height:72%; opacity:.45; filter:grayscale(.8); transition:opacity .2s, filter .2s; }
.sam-zier.gefunden { background:var(--accent-soft); border-color:var(--accent); }
.sam-zier.gefunden .item-bild { opacity:1; filter:none; }
.sam-zier-haken { position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
  box-shadow:0 0 0 2px var(--surface); }
.sam-zier-haken svg { width:10px; height:10px; }
.fund-zeile { display:flex; align-items:center; gap:10px; flex-direction:row; }
.fund-zeile .coord { flex:1; font-size:13px; }
.fund-zeile .weg { font-family:ui-monospace,monospace; font-weight:700; color:var(--accent); font-size:13px; }
.fund-zeile .btn-secondary { min-height:36px; padding:7px 12px; }

/* ---- Banner  ·  Baupläne (Liste, Detail, Editor) -------------------------- */
.banner-stage { padding-top:2px; }
.banner-raster { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
.banner-karte { background:var(--surface-2); border:1px solid var(--border-soft); border-radius:14px;
  padding:10px 12px 12px; display:flex; flex-direction:column; gap:2px; align-items:stretch; text-align:left;
  cursor:pointer; font:inherit; color:var(--text); transition:background .45s ease, border-color .45s ease; }
.banner-karte:active { background:var(--surface-3); }
.banner-karte .card-meta { margin-top:0; }
.banner-karte .pill { align-self:flex-start; margin-top:6px; }
/* Banner hängt an einer Querstange – wie im Spiel an der Wand */
.banner-rahmen { align-self:center; display:flex; flex-direction:column; align-items:center; padding:6px 0 10px; }
.banner-rahmen::before { content:""; width:60px; height:4px; border-radius:2px; background:#7a5a3a;
  box-shadow:0 1px 0 rgba(0,0,0,.4); margin-bottom:-1px; position:relative; z-index:1; }
.banner-bild { display:block; width:48px; height:96px; image-rendering:pixelated; image-rendering:crisp-edges;
  box-shadow:0 8px 18px rgba(0,0,0,.4); }
.banner-rahmen.gross .banner-bild { width:72px; height:144px; }
.banner-rahmen.gross::before { width:88px; height:5px; }
.banner-rahmen.mittel { padding:2px 0 4px; }
.banner-rahmen.mittel .banner-bild { width:52px; height:104px; }
.banner-rahmen.mittel::before { width:66px; }
.banner-bild.mini { width:18px; height:36px; box-shadow:none; border-radius:2px; flex:0 0 auto; }

.banner-detail-kopf { display:flex; gap:14px; align-items:flex-start; }
.banner-detail-kopf .result-card { flex:1; min-width:0; gap:8px; }
.mat { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
.mat b { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
.farbpunkt { width:14px; height:14px; border-radius:4px; flex:0 0 auto; display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.vorlage-zeile { display:flex; flex-direction:column; gap:1px; padding-top:8px; border-top:1px solid var(--border-soft); }
.vorlage-zeile:first-of-type { border-top:none; padding-top:0; }
.vorlage-zeile b { font-size:13.5px; }
.vorlage-zeile span { font-size:12px; color:var(--text-faint); }

/* Anleitung: jeder Schritt zeigt, wie das Banner danach aussieht */
.schritt { flex-direction:row; align-items:center; gap:12px; text-align:left; cursor:pointer; font:inherit; color:var(--text); padding:10px 12px; }
.schritt:active { background:var(--surface-3); }
.schritt-nr { width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
  background:var(--surface-3); color:var(--text-dim); font-size:12px; font-weight:800; font-family:ui-monospace,monospace; }
.schritt.erledigt .schritt-nr { background:var(--accent); color:var(--accent-ink); }
.schritt.erledigt .schritt-text { opacity:.55; }
.schritt-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.schritt-text b { font-size:14px; }
.schritt-text small { font-size:12px; color:var(--text-faint); line-height:1.35; }
.schritt-text .en, .ebene-text .en { font-weight:600; color:var(--text-faint); font-size:11px; margin-left:5px; }

/* Editor */
.banner-editor-kopf { position:sticky; top:-1px; z-index:2; display:flex; gap:14px; align-items:center;
  background:var(--surface); padding:4px 0 10px; margin-bottom:-6px; border-bottom:1px solid var(--border-soft);
  transition:background .45s ease; }
.banner-editor-kopf .field-group { flex:1; min-width:0; }
.farbraster { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
.farbfeld { aspect-ratio:1; border-radius:10px; border:2px solid transparent; cursor:pointer; padding:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); transition:transform .1s, border-color .2s; }
.farbfeld.aktiv { border-color:var(--text); transform:scale(1.08); box-shadow:0 0 0 2px var(--accent), inset 0 0 0 1px rgba(0,0,0,.35); }
.ebene { padding:0; gap:0; overflow:hidden; }
.ebene.offen { border-color:var(--accent); }
.ebene-zeile { display:flex; align-items:center; gap:4px; padding:6px 6px 6px 10px; }
.ebene-kopf { flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:none; border:none;
  color:var(--text); font:inherit; text-align:left; cursor:pointer; padding:4px 0; }
.ebene-text { display:flex; flex-direction:column; gap:1px; min-width:0; }
.ebene-text b { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ebene-text small { font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:6px; }
.ebene-knoepfe { display:flex; gap:2px; flex:0 0 auto; }
.ebene-knoepfe .icon-btn { position:static; transform:none; width:36px; height:36px; color:var(--text-dim); font-size:16px; }
.ebene-knoepfe .icon-btn:disabled { opacity:.3; cursor:default; }
.ebene-wahl { display:flex; flex-direction:column; gap:8px; padding:10px 12px 14px; border-top:1px solid var(--border-soft); background:var(--surface); }
.ebene-wahl .field-group-label { margin-top:4px; }
.muster-raster { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; }
.muster-feld { background:var(--surface-2); border:1.5px solid var(--border-soft); border-radius:10px; padding:6px 0;
  display:grid; place-items:center; cursor:pointer; transition:border-color .2s, background .2s; }
.muster-feld img { width:20px; height:40px; image-rendering:pixelated; display:block; }
.muster-feld.aktiv { border-color:var(--accent); background:var(--accent-soft); }

/* ---- Rüstung  ·  Sets am Schmiedetisch (Liste, Detail, Editor, Bühne) ------ */
.ruestung-stage { padding-top:2px; }
/* Item-Rahmen: Icon + Verzauberungs-Schimmer (das Icon ist die Maske) */
.item-rahmen { position:relative; display:inline-block; line-height:0; flex:0 0 auto; }
.item-rahmen.leer .item-bild { opacity:.35; }
.glanz-schicht { position:absolute; inset:0; pointer-events:none;
  -webkit-mask:var(--maske) center / 100% 100% no-repeat; mask:var(--maske) center / 100% 100% no-repeat;
  background:linear-gradient(120deg, transparent 22%, rgba(196,130,255,.85) 34%, transparent 46%, transparent 58%, rgba(160,96,255,.6) 68%, transparent 80%) 0 0 / 300% 300%;
  mix-blend-mode:screen; animation:glanz 3.4s linear infinite; }
@keyframes glanz { from { background-position:100% 100%; } to { background-position:0 0; } }
@media (prefers-reduced-motion: reduce) { .glanz-schicht { animation:none; background-position:50% 50%; } }
.item-rahmen.glanz:not(:has(.glanz-schicht)) .item-bild { filter:drop-shadow(0 0 2px rgba(186,120,255,.95)); }

.ruestung-karte { flex-direction:row; align-items:stretch; gap:12px; text-align:left; cursor:pointer; font:inherit; color:var(--text); width:100%; }
.ruestung-karte:active { background:var(--surface-3); }
/* Set auf dem Ständer: Figur vor dem Block der Dimension, wie die Bühne im Detail */
.ruestung-staender { flex:0 0 88px; min-height:128px; border-radius:12px; overflow:hidden; border:1px solid var(--border-soft);
  background:linear-gradient(rgba(10,12,16,.35), rgba(10,12,16,.72)), var(--hintergrund) 0 0 / 32px 32px;
  image-rendering:pixelated; display:grid; place-items:center; }
.ruestung-staender .dreher { width:18px; height:18px; margin:0; }
.staender-bild { width:100%; height:100%; object-fit:contain; object-position:center bottom; image-rendering:auto; }
.staender-icons { display:grid; grid-template-columns:repeat(2, 30px); gap:4px; }
.staender-icons .item-bild { width:30px; height:30px; }
.ruestung-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; align-items:flex-start; justify-content:center; }
.ruestung-text .card-meta { margin-top:0; }
/* Je Teil: Rüstungsteil · Ziervorlage · Rohstoff (wie am Schmiedetisch, klein) */
.teil-chips { display:grid; grid-template-columns:repeat(2, max-content); gap:5px 6px; margin:3px 0 2px; }
.teil-chip { display:flex; gap:2px; padding:2px; border-radius:8px; background:var(--surface-3); border:1px solid var(--border-soft); }
.chip-slot { width:24px; height:24px; border-radius:5px; display:grid; place-items:center; background:rgba(0,0,0,.18); }
.chip-slot .item-bild { width:20px; height:20px; }
.chip-slot.frei { background:transparent; border:1px dashed var(--border-soft); }
.chip-vorlage.gefunden { box-shadow:inset 0 0 0 1.5px var(--accent); background:var(--accent-soft); }
.chip-vorlage.fehlt .item-bild { opacity:.45; filter:grayscale(.8); }
.teil-chip.leer .chip-ruestung .item-bild { opacity:.35; }

/* Bühne: Figur vor dem Block der Dimension */
.buehne { position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--border-soft);
  background:linear-gradient(rgba(10,12,16,.35), rgba(10,12,16,.72)), var(--hintergrund) 0 0 / 48px 48px;
  image-rendering:pixelated; }
.buehne-flaeche { height:300px; display:grid; place-items:center; }
.buehne.klein .buehne-flaeche { height:180px; }
.buehne-flaeche .dreher { width:22px; height:22px; margin:0; }
.figur-3d { width:100%; height:100%; display:block; touch-action:pan-y; cursor:grab; }
.figur-3d:active { cursor:grabbing; }
.figur-2d { height:92%; width:auto; image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.55)); }
.buehne-icons { display:grid; grid-template-columns:repeat(2, 64px); gap:12px; }
.buehne.klein .buehne-icons { grid-template-columns:repeat(4, 48px); }
.buehne-icons .item-bild { width:64px; height:64px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.buehne.klein .buehne-icons .item-bild { width:48px; height:48px; }
.buehne-leiste { display:flex; gap:5px; flex-wrap:wrap; padding:7px 8px; background:rgba(8,10,13,.55);
  border-top:1px solid rgba(255,255,255,.08); }
.buehne-knopf { border:1px solid rgba(255,255,255,.14); background:rgba(12,14,18,.62); color:rgba(255,255,255,.78);
  border-radius:9px; padding:5px 9px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; backdrop-filter:blur(6px); }
.buehne-knopf.aktiv { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.buehne-knopf.traeger { margin-left:auto; }
.buehne-hinweis { position:absolute; top:8px; left:10px; right:10px; text-align:right; font-size:11px; font-weight:600;
  color:rgba(255,255,255,.62); pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.8); }
.buehne-hinweis:empty { display:none; }

/* Schmiedetisch: Vorlage + Rüstung + Material → Ergebnis */
.slot { width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; padding:0;
  background:#8b8b8b; border:2px solid; border-color:#373737 #fff #fff #373737; border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); font:inherit; color:inherit; }
.slot .item-bild { width:32px; height:32px; }
.slot .geist { line-height:0; opacity:.22; filter:grayscale(1) brightness(1.6); }
.slot.ergebnis { width:50px; height:50px; }
.slot.ergebnis .item-bild { width:38px; height:38px; }
.rezept-pfeil { color:var(--text-faint); display:grid; place-items:center; flex:0 0 auto; }
.rezept { gap:10px; }
.rezept-zeile { display:flex; align-items:center; gap:6px; }
.rezept-text { display:flex; flex-direction:column; gap:2px; }
.rezept-text b { font-size:14.5px; }
.rezept-text small { font-size:12px; color:var(--text-faint); line-height:1.4; display:flex; align-items:center; flex-wrap:wrap; gap:0 5px; }
.rezept-text .en { font-weight:600; font-size:11px; margin-left:4px; }
.rezept-text .verz, .schmiede-text .verz { color:#c49bff; font-weight:700; }
.farbpunkt.klein { width:11px; height:11px; border-radius:3px; }
.besatz-status { display:flex; align-items:center; gap:8px; border-radius:10px; padding:8px 10px; font:inherit; font-size:12.5px;
  font-weight:600; text-align:left; border:none; width:100%; }
.besatz-status.ok { background:rgba(58,209,122,.14); color:#5fe09a; }
.besatz-status.fehlt { background:rgba(232,180,68,.14); color:#f0c468; cursor:pointer; }
.besatz-status .kb { width:22px; height:22px; display:grid; place-items:center; flex:0 0 auto; font-family:ui-monospace,monospace; }
.besatz-status .kb .kennblock { width:22px; height:22px; }
.besatz-status .weiter { margin-left:auto; font-size:16px; }
.bedarf { gap:8px; }
.bedarf-zeile { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); }
.bedarf-zeile .item-bild { width:24px; height:24px; }
.bedarf-zeile > span:not(.pill) { flex:1; min-width:0; }
.bedarf-zeile b { color:var(--text); font-variant-numeric:tabular-nums; }
.bedarf-zeile small { display:block; font-size:11px; color:var(--text-faint); }

/* Verzauberung am Amboss */
.verz { padding:0; gap:0; overflow:hidden; }
.verz.offen { border-color:var(--accent); }
.verz-kopf { display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color:var(--text);
  font:inherit; text-align:left; cursor:pointer; padding:10px 12px; }
.verz-kopf .item-bild { width:28px; height:28px; }
.verz-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.verz-text b { font-size:14px; }
.verz-text small { font-size:11.5px; color:var(--text-faint); line-height:1.4; }
.verz.offen .ach-cat-chevron { transform:rotate(180deg); }
.verz-schritte { padding:0 10px 12px; }
.amboss { gap:8px; }
.amboss-seite { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; font-size:12.5px; }
.amboss-seite small { font-size:11px; color:var(--text-faint); line-height:1.3; }
.amboss .plus { color:var(--text-faint); font-weight:800; }
.amboss .xp { font:800 14px ui-monospace,monospace; color:#9be36a; text-align:right; flex:0 0 auto; }
.amboss .xp small { font-size:9px; margin-left:1px; }
.amboss.erledigt .amboss-seite, .amboss.erledigt .xp { opacity:.5; }

/* Editor */
.ruestung-editor-kopf { position:sticky; top:-1px; z-index:2; background:var(--surface); padding:2px 0 8px; margin-bottom:-8px; }
.teil-reiter { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.teil-knopf { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px 7px; border-radius:12px;
  background:var(--surface-2); border:1.5px solid var(--border-soft); color:var(--text-dim); font:inherit; font-size:11px; font-weight:700; cursor:pointer; }
.teil-knopf .item-bild { width:30px; height:30px; }
.teil-knopf.aktiv { border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
.schmiede { gap:12px; }
.schmiedetisch { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 6px; border-radius:6px;
  background:#c6c6c6; border:2px solid; border-color:#fff #555 #555 #fff; }
.schmiedetisch .slot { cursor:pointer; }
.schmiedetisch .slot.aktiv { outline:3px solid var(--accent); outline-offset:1px; }
.schmiedetisch .slot:disabled { cursor:default; opacity:.55; }
.schmiedetisch .rezept-pfeil { color:#555; }
.schmiede-text { display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
.schmiede-text b { font-size:15px; }
.schmiede-text small { font-size:12px; color:var(--text-faint); }
.wahl-bereich { display:flex; flex-direction:column; gap:8px; }
.wahl-raster { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.wahl { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px 6px; border-radius:10px;
  background:var(--surface); border:1.5px solid var(--border-soft); color:var(--text-dim); font:inherit; font-size:10.5px;
  font-weight:600; line-height:1.2; text-align:center; cursor:pointer; min-width:0; }
.wahl span { overflow-wrap:break-word; hyphens:auto; max-width:100%; }
.wahl-raster.drei { grid-template-columns:repeat(3, 1fr); }
.wahl .item-bild { width:30px; height:30px; }
.wahl.aktiv { border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
.wahl .haken { position:absolute; top:3px; right:5px; font-style:normal; font-size:11px; font-weight:800; color:#5fe09a; }
.wahl-leer { width:30px; height:30px; display:grid; place-items:center; font-size:18px; color:var(--text-faint); }
.schmiede .farbraster { grid-template-columns:repeat(9, 1fr); }
.schmiede .farbraster .farbfeld:first-child { box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.18); }
.verz-schalter { padding:6px 2px 2px; border-bottom:none; }
.verz-schalter .oname { font-size:14px; }
.verz-schalter .oname, .verz-schalter .odesc { display:block; }

/* ---- Portal-Verwaltung  ·  Umrechner, Verbindungen, Infokarte ------------- */
.portal-stage { padding-top:2px; }
.rechner { gap:12px; }
.rechner-kopf { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:30px; }
.chip-knopf { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-soft); background:var(--surface-3);
  color:var(--text-dim); border-radius:10px; padding:6px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.chip-knopf svg { color:var(--accent); }
.rechner .tool-segment { background:var(--surface); }
.rechner .seg-btn { font-size:12.5px; padding:9px 4px; }
.rechner .field input { background:var(--surface); }
.rechner .koord-in .vz { background:var(--surface-2); }
.rechner-ziel { display:flex; flex-direction:column; gap:6px; padding:12px 14px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border-soft); transition:background .45s ease; }
.rechner-ziel .result-label b, .rechner-ziel .result-coords b { color:var(--ziel); }
.rechner-ziel .result-coords { flex-wrap:wrap; gap:4px 18px; font-size:21px; }
.rechner-ergebnis { display:flex; flex-direction:column; gap:10px; }
.rechner-knoepfe { display:flex; gap:8px; flex-wrap:wrap; }
.rechner .btn-secondary, .seite-karte .btn-secondary { background:var(--surface); border-color:var(--border); }
.rechner-knoepfe .btn-secondary { flex:1; }
.rechner-knoepfe .btn-primary { flex:1 1 100%; }
.pruef-zeile { display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.45; color:var(--text-dim); }
.pruef-zeile b { color:var(--text); }
.pruef-zeile .ico { flex:0 0 auto; width:20px; height:20px; margin-top:1px; border-radius:50%; display:grid; place-items:center;
  font-size:11px; font-weight:800; background:var(--surface-3); color:var(--text-dim); }
.pruef-zeile.ok .ico   { background:rgba(58,209,122,.16); color:#5fe09a; }
.pruef-zeile.warn .ico { background:rgba(232,180,68,.16); color:#f0c468; }
.pruef-zeile.bad .ico  { background:rgba(232,68,60,.18); color:#ff8278; }
.pill.ok   { background:rgba(58,209,122,.16); color:#5fe09a; }
.pill.warn { background:rgba(232,180,68,.16); color:#f0c468; }
.pill.bad  { background:rgba(232,68,60,.18); color:#ff8278; }
.verbindung { text-align:left; font:inherit; color:var(--text); cursor:pointer; gap:6px; }
.verbindung:active { background:var(--surface-3); }
.verbindung .card-head { align-items:center; margin-bottom:2px; }
.verbindung .pill { flex:0 0 auto; }
.seite { display:flex; align-items:baseline; gap:10px; }
.seite-dim { flex:0 0 66px; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.card-meta.warn { color:#f0c468; }
.card-meta.bad { color:#ff8278; }
.seite-karte { gap:8px; }
.seite-karte .coord { font-size:16px; }
.seite-karte .card-actions .btn-secondary { flex:1; }
.info-karte { background:var(--surface-2); border:1px solid var(--accent); border-radius:16px; padding:14px 16px;
  display:flex; flex-direction:column; gap:12px; box-shadow:0 0 0 3px var(--accent-soft); }
.info-kopf { display:flex; align-items:center; gap:10px; }
.info-kopf h2 { flex:1; font-size:16px; font-weight:800; }
.info-kopf .icon-btn { position:static; transform:none; width:34px; height:34px; margin:-6px -8px -6px 0; color:var(--text-dim); }
.info-karte .tool-segment { background:var(--surface); }
.info-liste { list-style:none; counter-reset:info; display:flex; flex-direction:column; gap:11px; padding:0; margin:0; }
.info-liste li { counter-increment:info; display:grid; grid-template-columns:22px 1fr; gap:9px;
  font-size:13px; line-height:1.5; color:var(--text-dim); }
.info-liste li::before { content:counter(info); width:22px; height:22px; border-radius:50%; margin-top:1px;
  background:var(--accent-soft); color:var(--accent); font:800 11px/22px ui-monospace,monospace; text-align:center; }
.info-liste b { color:var(--text); }

/* ---- Board-Verbindung ---- */
.anzeige-qr svg { display:block; width:100%; max-width:220px; margin:8px auto 2px; background:#fff; border-radius:10px; padding:6px; }
.sb-fuss { margin-top:auto; padding:12px 12px max(14px, env(safe-area-inset-bottom)); border-top:1px solid var(--border-soft); }
.board-knopf { width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px;
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); cursor:pointer; text-align:left; font:inherit; }
.board-knopf:active { background:var(--surface-3); }
.board-knopf .ico { color:var(--accent); display:flex; }
.board-knopf .text { flex:1; min-width:0; display:flex; flex-direction:column; }
.board-knopf .titel { font-size:15px; font-weight:700; }
.board-knopf .card-meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.status-dot { flex:0 0 auto; }
.status-dot.warte { background:#e8b444; box-shadow:0 0 8px #e8b444; }
.status-dot.aus { background:var(--text-faint); box-shadow:none; }
.scanner { position:relative; width:min(100%, 44vh); aspect-ratio:1; margin:0 auto; border-radius:18px; overflow:hidden;
  background:#000; border:1px solid var(--border-soft); }
.scanner video { width:100%; height:100%; object-fit:cover; display:block; }
.scanner .rahmen { position:absolute; inset:17%; border-radius:16px; border:2px solid var(--accent);
  box-shadow:0 0 0 999px rgba(0,0,0,.38), 0 0 18px var(--accent-soft); transition:inset .25s ease; }
.scanner .scan-text { position:absolute; left:10px; right:10px; bottom:12px; text-align:center; font-size:12.5px; font-weight:600;
  color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); }
.scanner.aus { background:var(--surface-2); }
.scanner.aus .rahmen { box-shadow:none; border-style:dashed; border-color:var(--border); }
.scanner.aus .scan-text { top:50%; bottom:auto; transform:translateY(-50%); color:var(--text-dim); text-shadow:none; padding:0 14%; }
.scanner.erkannt .rahmen { inset:6%; background:var(--accent-soft); }
.board-zeilen { display:flex; flex-direction:column; gap:10px; }
.board-zeile { display:flex; justify-content:space-between; gap:12px; font-size:13.5px; }
.board-zeile span:first-child { color:var(--text-dim); }
.board-zeile b { text-align:right; word-break:break-word; }
.board-einstellungen { gap:12px; }
.anheften.aktiv { border-color:var(--accent); color:var(--accent); }
.sam-board { flex:1; margin:8px 14px; }
.board-schalter { align-items:center; }
.board-status { display:flex; align-items:center; gap:9px; font-size:16px; }
.board-zeigen, .sam-board { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
.board-zeigen svg, .sam-board svg { color:var(--accent); }
.board-zeigen.aktiv, .sam-board.aktiv { border-color:var(--accent); color:var(--accent); }
.board-gezeigt { display:flex; align-items:center; gap:12px; }
.board-gezeigt .text { flex:1; min-width:0; }
.board-gezeigt .btn-secondary { min-height:38px; padding:8px 14px; }

/* Toast */
.orte-toast { position:absolute; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:30; font-size:13px; font-weight:600; white-space:nowrap; max-width:calc(100% - 32px); overflow:hidden; text-overflow:ellipsis; }
.orte-toast[hidden] { display:none; }
.orte-toast.fehler { color:#ff8278; border-color:rgba(232,68,60,.5); }
</style>
</head>
<body>
<div class="device" id="device">

  <!-- Prototyp-Chrome: kosmetische Status-Leiste -->
  <div class="statusbar">
    <span class="mono" id="uhr">14:32</span>
    <span class="glyphs"><span style="font-size:11px">●●●○</span><span class="batt"></span></span>
  </div>

  <!-- Header: Hamburger + zentrierter Titel -->
  <header class="header">
    <button class="icon-btn" id="burgerBtn" aria-label="Bereiche"><span class="burger"><span></span></span></button>
    <div class="title-block">
      <div class="title-row">
        <span class="compass" id="kopfIcon"></span>
        <h1 id="kopfTitel">Karte</h1>
      </div>
      <div class="subtitle" id="orteSub">Welt · <b>Oberwelt</b></div>
    </div>
  </header>

  <main class="module-stack">
    <!-- === Modul: Karte · Koordinaten-Sammlung ============================== -->
    <section class="module is-active" data-module="karte" id="moduleKarte">

      <!-- EBENE 2 · Dimensions-Reiter -->
      <div class="tabs-wrap">
        <div class="tabs" id="orteTabs">
          <button class="tab active" data-dim="overworld">Oberwelt<span class="zahl"></span></button>
          <button class="tab" data-dim="nether">Nether<span class="zahl"></span></button>
          <button class="tab" data-dim="end">End<span class="zahl"></span></button>
        </div>
      </div>

      <!-- Ansicht: Liste | Karte -->
      <div class="ansicht-wrap">
        <div class="tool-segment" id="orteAnsicht">
          <button class="seg-btn active" data-ansicht="karte">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Karte</button>
          <button class="seg-btn" data-ansicht="liste">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Liste</button>
        </div>
      </div>

      <!-- Bühne: Liste -->
      <div class="orte-stage" id="orteStage">
        <div class="orte-hud" id="orteHud"></div>
        <div class="orte-suche">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="orte-eingabe" id="orteSuche" type="search" placeholder="Suchen …" autocomplete="off">
        </div>
        <div class="ach-filter orte-filter" id="orteFilter"></div>
        <div class="orte-liste" id="orteListe"></div>
      </div>

      <!-- Bühne: Karte – Biome aus dem Welt-Import als Fläche, unerkundet bleibt leer -->
      <div class="karte-stage" id="karteStage" hidden>
        <canvas id="ortKarte"></canvas>
        <div class="vignette"></div>
        <div class="karte-hinweis" id="karteHinweis"></div>
        <div class="karte-legende" id="karteLegende"></div>
        <div class="karte-knoepfe">
          <button id="karteBiome" aria-label="Biome zeigen" aria-pressed="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3z"/><path d="M13 13h8v8h-8z" fill="currentColor"/></svg>
          </button>
          <button id="karteZoomIn" aria-label="Hineinzoomen">+</button>
          <button id="karteZoomOut" aria-label="Herauszoomen">−</button>
          <button id="karteFit" aria-label="Alles zeigen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>

      <!-- EBENE 3 · Bottom Bar -->
      <nav class="bottombar">
        <button class="bb-item" id="orteStatusBtn">
          <span class="ico"><span class="status-dot" id="orteStatusDot"></span></span>
          <span class="lab" id="orteStatusLab">Verbunden</span>
        </button>
        <button class="bb-item active" id="orteScreenshotBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
          <span class="lab">Screenshot</span>
        </button>
        <button class="bb-item" id="orteEintragenBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="lab">Eintragen</span>
        </button>
        <button class="bb-item" id="orteImportBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>
          <span class="lab">Welt-Import</span>
        </button>
        <button class="bb-item" id="orteWeltBtn">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <span class="lab">Welt</span>
        </button>
      </nav>
      <input type="file" id="orteDatei" accept="image/*" multiple hidden>
      <!-- Welt-Import: .zip aus der Dateien-App, .mcworld geht auch -->
      <input type="file" id="weltDatei" accept=".zip,.mcworld,application/zip" hidden>
    </section>
    <!-- === Modul: Sammelobjekte · Rüstungs-Modifikationen =================== -->
    <section class="module" data-module="sammelobjekte" id="moduleSammel">
      <!-- Reiter: Rüstungsbesätze + weitere Sammelobjekte (noch ohne Inhalt: „Bald verfügbar“) -->
      <div class="tabs-wrap sam-reiter-wrap">
        <div class="tabs sam-reiter" id="samReiter" role="tablist" aria-label="Art der Sammelobjekte"></div>
      </div>
      <div class="ach-stage" id="samStage">
        <div class="module-empty sam-bald" id="samBald" hidden></div>
        <div class="ach-header" id="samKopf">
          <div class="ach-header-row">
            <div class="ach-meter">
              <div class="ach-meter-num mono"><b id="samGefunden">0</b><span>/<span id="samGesamt">0</span></span></div>
              <div class="ach-meter-lbl">gefunden</div>
            </div>
            <div class="ach-meter">
              <div class="ach-meter-num mono"><b id="samFundorte">0</b><span>/<span id="samFundorteGesamt">0</span></span></div>
              <div class="ach-meter-lbl">Fundorte bekannt</div>
            </div>
            <div class="ach-meter">
              <div class="ach-meter-num mono"><b id="samProzent">0</b><span>%</span></div>
              <div class="ach-meter-lbl">Fortschritt</div>
            </div>
          </div>
          <div class="ach-bar"><span id="samBalken"></span></div>
          <!-- Alle Besätze auf einen Blick: je 2 untereinander, der Rest in einer Reihe -->
          <div class="sam-uebersicht" id="samUebersicht" aria-label="Alle Besätze auf einen Blick"></div>
        </div>
        <div class="ach-list" id="samListe"></div>
      </div>
      <nav class="bottombar">
        <!-- Filter-Knopf: öffnet das Sheet mit allen Filtern (statt der früheren drei Pillen) -->
        <button class="bb-item" id="samFilterBtn" aria-haspopup="dialog">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg></span>
          <span class="lab" id="samFilterLab">Filter</span>
        </button>
        <div class="bb-placeholder" id="samFuss">Gilt für die ganze Welt · alle können abhaken</div>
      </nav>
    </section>

    <!-- === Modul: Portal-Verwaltung · Umrechnen + Verbindungen ============== -->
    <section class="module" data-module="portale" id="modulePortale">
      <div class="orte-stage portal-stage" id="portalStage"></div>
      <nav class="bottombar">
        <button class="bb-item" id="portalInfoBtn" aria-pressed="false">
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></span>
          <span class="lab">Info</span>
        </button>
        <button class="bb-item" id="portalNeuBtn">
