server {
  # Nur IPv4: Eine feste IPv6-Zeile lässt nginx auf Hosts ohne IPv6 abstürzen.
  # Docker veröffentlicht Ports ohnehin über die IPv4-Adresse des Containers.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Gebaute Assets haben einen Hash im Dateinamen und dürfen lange gecacht werden.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nie cachen, damit neue Deployments sofort greifen.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA-Fallback: unbekannte Pfade liefern die App aus (für späteres Routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
